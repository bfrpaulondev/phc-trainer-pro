à AT ANTES do início do transporte (regra geral). Dois métodos: webservice em tempo real — a AT devolve o Cód. Ident. AT (que pode seguir por SMS ao motorista, se a série + módulo SMS estiverem configurados) — ou SAF-T (PT) resumido (ficheiro com MovementOfGoods, onde os locais de carga/descarga viajam como ShipFrom/ShipTo). O parâmetro 'Método de Envio de Documentos de Transporte' decide. Há regimes especiais (venda ambulante, isenções por faturação no ato) que o técnico deve reconhecer.", "s": [["Webservice AT", "Comunicação síncrona que devolve o código de identificação do documento — prova imediata."], ["SAF-T resumido", "Alternativa por ficheiro: MovementOfGoods com ShipFrom/ShipTo, datas/horas e Hash."], ["Cód. Ident. AT", "Campo do documento com o código devolvido pela AT — exigível em fiscalização na estrada."], ["SMS ao motorista", "Automatismo (série + módulo SMS) que envia o código da AT ao condutor."], ["Data/hora de início", "Elementos críticos: o transporte não pode 'começar' antes da comunicação."]], "e": ["Emitir guias com hora de carga já passada e comunicar depois (infração)", "Usar SAF-T resumido sem conferir ShipFrom/ShipTo (locais errados invalidam)"]}, "L36": {"c": "Retenções na fonte = o cliente retém parte do pagamento e entrega ao Estado por conta do fornecedor (IRS/IRC) — comum em serviços de profissionais liberais e empresas enquadradas. Na fatura aparecem taxa e valor de retenção; a C/C regista o líquido a receber (o retido não é dívida do cliente). Imposto do Selo aplica-se a certas operações (verbas próprias). O Calendário PHC (PHC On) documenta o tratamento no software; declarações (Modelo 30 para não residentes, etc.) têm guias oficiais no Help Center.", "s": [["Agente de retenção", "Quem paga e retém (cliente empresarial, tipicamente) — a ficha do cliente marca o enquadramento."], ["Taxa/valor de retenção", "Campos do documento; o total a pagar = total − retenção."], ["Líquido na C/C", "A dívida do cliente é pelo líquido — aging e cobranças refletem isso."], ["Imposto do Selo", "Taxa sobre operações específicas (ex.: crédito) com verbas legais."], ["Modelo 30", "Declaração de rendimentos pagos a não residentes — guia passo-a-passo oficial no Help Center."]], "e": ["Cobrar ao cliente o valor total de fatura com retenção (está-se a cobrar o que ele entrega ao Estado)", "Esquecer a retenção num recibo/liquidação e o saldo nunca fechar"]}, "L37": {"c": "O módulo trata dados pessoais (nomes, NIFs, contactos, moradas) — o RGPD exige base legal, transparência (aviso legal), minimização e direitos do titular (acesso, retificação, ESQUECIMENTO). O PHC implementa: aviso legal configurável, registo do tratamento de dados, processo de esquecimento/anonimização (remove dados identificativos preservando documentos fiscais — que por lei NÃO podem ser apagados) e histórico de utilizadores. O técnico opera estes pedidos com procedimento documentado.", "s": [["Aviso legal", "Texto de privacidade apresentado/documentado conforme configuração."], ["Registo do tratamento", "Inventário dos tratamentos de dados feitos pela empresa (obrigação RGPD)."], ["Direito ao esquecimento", "Anonimização de dados pessoais do titular — preservando integridade fiscal dos documentos emitidos."], ["Histórico de utilizadores", "Rasto de quem fez o quê (auditoria interna)."], ["Prazo de conservação fiscal", "Documentos fiscais guardam-se anos (10 em regra) — o 'esquecimento' é anonimização, não eliminação total."]], "e": ["Prometer 'apagar tudo' a um titular sem explicar o conflito com obrigações fiscais", "Executar esquecimento em produção sem procedimento/teste prévio (é irreversível)"]}, "L38": {"c": "A integração Gestão→Contabilidade transforma documentos comerciais em lançamentos contabilísticos automáticos via Documentos Pré-Definidos: para cada tipo de documento definem-se contas (clientes, fornecedores, IVA liquidado/dedutível, vendas, compras, contrapartidas) e regras (diário, documento pré-numerado). O contabilístico fecha o ciclo: apuramento do IVA, declaração periódica, CEVMC, resultados. Mesmo sem o módulo Contabilidade instalado, o técnico de Gestão DEVE conhecer o esquema de integração — é o que faz o ERP ser 'um só sistema'.", "s": [["Documentos pré-definidos", "Modelos de contabilização por tipo de documento do Gestão."], ["Contas de integração", "Contas SNC mapeadas: clientes (21), fornecedores (22), IVA (24), vendas (71/72), compras (31/22)..."], ["Diários", "Agrupamentos de lançamentos (vendas, compras, recebimentos, pagamentos)."], ["Apuramento do IVA", "Confronto do IVA liquidado (vendas) vs dedutível (compras) → declaração periódica."], ["CEVMC e resultados", "Consumos + variações de existências alimentam o apuramento de resultados."], ["PHC XL / centros analíticos", "Grandes volumes e contabilidade multidimensional (dimensões/centros)."]], "e": ["Integrar sem validar as contas de teste num clone (um mapa de contas errado exige estornos massivos)", "Desintegrar/reintegrar sem critério e duplicar lançamentos"]}, "L39": {"c": "Parâmetros são interruptores globais que mudam o comportamento do software — de performance (ecrãs em memória, processamento assíncrono) a regras fiscais (métodos de envio à AT, validações). Estão no menu Sistema, protegidos por acessos (configuráveis por utilizador). O método profissional para mexer: documentar o valor atual → alterar UM → testar → reverter ou manter. Cada parâmetro tem manual in-app (botão Ajuda) — leia antes de mudar.", "s": [["Parâmetros gerais vs de módulo", "Gerais afetam a plataforma (UI, performance, acessos); de módulo afinam faturação/stocks/tesouraria."], ["Parâmetros de faturação", "Retenção IRS, método de envio à AT, validações de transporte, isenção nas linhas..."], ["Acessos a parâmetros", "Pode-se libertar parâmetros específicos a utilizadores não-admin."], ["Documentação in-app", "O botão Ajuda de cada parâmetro abre o manual oficial — fonte primária."], ["Metodologia 1-2-3", "Um parâmetro de cada vez + registo antes/depois + teste + capacidade de reverter."]], "e": ["Mudar parâmetros 'para ver o que acontece' em produção", "Copiar parâmetros de outra instalação sem entender cada um (contextos diferem)"]}, "L40": {"c": "Reporting standard: Mapas Definidos são relatórios prontos e configuráveis (colunas, filtros, totais, ordenações) que cobrem o dia-a-dia (vendas por cliente, dívidas, compras). A Impressão Definida pelo Utilizador (Advanced+) permite ajustar layouts de listagens à casa. Saídas: ecrã, impressora, Excel, PDF. Antes de desenvolver um relatório novo, procure o mapa standard — 80% das necessidades já existem configuráveis.", "s": [["Mapa definido", "Relatório standard com configuração de colunas/filtros/totais pelo utilizador."], ["Impressão definida pelo utilizador", "Personalização de o que sai impresso nas listagens (Advanced+)."], ["Exportar vs imprimir", "Excel para análise, PDF para arquivo/envio — escolher o canal certo."], ["Repetição de valores em grelhas", "Parâmetro que imprime (ou não) valores repetidos por coluna."]], "e": ["Desenvolver à medida o que um mapa standard já faz configurado", "Mapas com filtros errados guardados como 'definitivos' (validar com dados conhecidos)"]}, "L41": {"c": "Análises de Utilizador = consultas SQL criadas pelo utilizador (Advanced+) apresentadas como grelhas vivas dentro do PHC, com filtros próprios e possibilidade de promoção a atalhos/menus. É a ferramenta de reporting livre: JOINs entre tabelas (ex.: ft × cl para vendas por zona), agregações, parâmetros de período. Boas práticas: NOLOCK em leituras, descobrir campos pelo Dicionário de Dados, guardar o SQL em ficheiro (versionamento) e documentar o propósito.", "s": [["Análise de utilizador", "Consulta SQL reutilizável exposta como ecrã de grelha na aplicação."], ["Filtro de utilizador", "Condições guardadas sobre grelhas/tabelas (ex.: 'só clientes zona Sul')."], ["JOINs típicos", "Documentos × clientes × artigos — as relações vêem-se no Dicionário de Dados."], ["NOLOCK", "Hint de leitura sem bloqueios — standard nas análises (aceita 'leituras sujas')."], ["Guardar SQL", "Versionar as consultas fora da BD (ficheiros .sql) para reutilização/auditoria."]], "e": ["UPDATE/DELETE 'para corrigir' a partir de uma análise (análise é LEITURA; correções fazem-se pelos ecrãs)", "Escrever SQL a adivinhar nomes de campos em vez de usar o dicionário"]}, "L42": {"c": "Camada de BI do utilizador: Snapshots são consultas T-SQL contextualizadas (usam variáveis como #stamp# para mostrar dados do registo em foco) exibíveis em painéis com cores por grupo. Análises Multidimensionais (Advanced+) promovem análises de utilizador a cubos com drill-down (ano → mês → cliente → documento). Dashboards (PHC Dashboard) e painéis de informação agregam indicadores num ecrã de comando. É o que transforma 'dados espalhados' em decisão rápida.", "s": [["Snapshot", "Consulta 'fotografada' com variáveis de contexto (#stamp#) — ex.: painel lateral do cliente com últimos documentos."], ["Análise multidimensional", "Cubo OLAP-like criado a partir de análise de utilizador; drill-down por dimensões."], ["Painéis/Dashboard", "Agregadores visuais (indicadores, gráficos) — template de Dashboard existe para o módulo Gestão."], ["Grupos de snapshots com cor", "Organização visual de conjuntos de snapshots (parâmetro próprio)."]], "e": ["Snapshots pesados a correr em cada abertura de ecrã (lentidão) — otimizar a consulta", "Multidimensional sobre dados errados (validar totais contra mapas standard antes de confiar)"]}, "L43": {"c": "Automação de vigilância: Monitores (com Itens de Monitor configurando colunas) apresentam filas de trabalho operacionais (dívidas, aprovações, sincronizações). Alertas de utilizador disparam por condições (stock mínimo, documento pendente) e distribuem-se por canais: aviso interno, PHC Notify, e-mail (SMTP), SMS (módulo). O intervalo de refrescamento é um parâmetro geral. Nas gamas superiores, Workflow Operacional e Sistema de Aprovação de Dossiers formalizam circuitos de autorização.", "s": [["Monitor + itens", "Vista sequencial de dados operacionais com colunas configuráveis por item."], ["Alerta de utilizador", "Condição → aviso automático; funções internas (ex.: CriaAvs) criam avisos a utilizadores."], ["Canais de notificação", "Aviso interno na app, PHC Notify, e-mail SMTP, SMS."], ["Workflow/aprovações", "Circuitos formais de autorização (Workflow Operacional no Advanced+; Aprovação de Dossiers no Enterprise)."]], "e": ["Alertas sem dono (disparam e ninguém atua — definir destinatário e ação)", "Refrescamento demasiado agressivo de alertas/monitores (carga na BD)"]}, "L44": {"c": "A Framework PHC permite estender o modelo de dados SEM tocar no core: Campos de Utilizador adicionam colunas a tabelas do software (ativas por parâmetro, visíveis nos ecrãs, persistentes em upgrades); Tabelas de Utilizador criam entidades novas; Valores por Defeito pré-preenchem campos por expressão; Índices de Utilizador aceleram consultas (com INCLUDED COLUMNS). É o primeiro passo de qualquer personalização — e a alternativa correta ao ALTER TABLE manual (que quebra suporte e upgrades).", "s": [["Campo de utilizador", "Coluna extra gerida pela framework (tipo, validações) — sobrevive a upgrades porque é metadata na BD."], ["Tabela de utilizador", "Entidade nova (ex.: ZonasTreino, Contratos) integrada nas ferramentas da framework."], ["Valores por defeito", "Preenchimento automático de qualquer campo (expressão: data atual, utilizador, cálculos)."], ["Índice de utilizador", "Índice SQL criado via framework, incluindo colunas incluídas (INCLUDED COLUMNS)."], ["Ativação por parâmetro", "'Utiliza campos do utilizador?' etc. — ferramentas aparecem no Supervisor → Framework PHC."]], "e": ["ALTER TABLE direto nas tabelas do core (upgrade pode falhar/ignorar; perde suporte)", "Criar campos sem convenção de nomes (prefixo do projeto/parceiro evita colisões futuras)"]}, "L45": {"c": "Regras de Utilizador são validações de negócio executadas pela aplicação no momento da introdução/gravacao: obrigar campos condicionais, impedir vendas sem stock ou acima do limite de crédito, validar NIF (9 dígitos + checksum). Criam-se por assistente (condições simples sem código) ou em Xbase (lógica complexa). Mensagens claras e em linguagem de utilizador final são parte do trabalho. Testam-se SEMPRE num clone antes de produção — uma regra errada pode bloquear a faturação da empresa toda.", "s": [["Assistente de Regras", "Construtor visual para condições simples (campo X obrigatório quando Y)."], ["Regra em código Xbase", "Para lógica complexa (cálculos, consultas, mensagens dinâmicas)."], ["Momento de execução", "A regra corre na interação/gravacao — bloqueia ou avisa conforme configurado."], ["Mensagem de utilizador", "Texto claro do porquê do bloqueio — reduz chamadas ao suporte."]], "e": ["Regra que bloqueia sem mensagem explicativa (utilizador liga em pânico)", "Testar só o caso feliz — validar também documentos antigos/anulações/reaberturas"]}, "L46": {"c": "Eventos são o coração do desenvolvimento desktop: pontos de extensão (Init, Clique, Ao Entrar/Sair, Após Atualizar, Tecla Pressionada, Refrescar...) onde corre código Xbase (sintaxe Visual FoxPro). Em cada evento existe o objeto ObjRecebido com Janela (o ecrã), Objecto (o próprio objeto, com Value/Parent) e MeusDados (repositório chave-valor para estado entre eventos). Return .F. cancela o comportamento padrão do objeto. Expressão vs programa: expressões retornam sozinhas (sem Return); programas permitem várias instruções. Erros? Análise Interna mostra a linha (0 = expressão).", "s": [["Xbase", "Linguagem de personalização desktop (dialecto VFP) — eventos, regras, funções."], ["ObjRecebido.Janela", "Apontador para o ecrã (Caption, BackColor...) — alterações duram enquanto o ecrã está aberto (repetir no Init)."], ["ObjRecebido.Objecto", "O objeto do evento: Value, Parent (navegar a hierarquia), MeusDados."], ["MeusDados", "Chave-valor do utilizador: AddParametro, GuardaParametro, ExisteParametro, GetNomeParametro, GetIndexParametro."], ["Return .F.", "Cancela a ação de raiz (tecla não entra, calendário não abre). Expressões não usam Return."], ["Lista de eventos", "Init, Ativar, Desativar, Refrescar, Clique, Duplo Clique, Clique Direito, Ao Entrar, Ao Sair, Após Atualizar, Após não Atualizado, Antes/Depois mudar Linha-Coluna, Mouse*, Tecla Pressionada."], ["Campo de Ligação", "Objeto composto: .Lista1 (botão lista), .Procura (botão procura), .Nossocampo1 (texto)."]], "e": ["Alterar propriedades no Init esperando persistência na BD (só duram com o ecrã aberto — repor no evento certo)", "Sempre esquecer de ver a Análise Interna quando 'o evento não faz nada' (o erro está lá)"]}, "L47": {"c": "Além dos eventos, a framework oferece utilitários reutilizáveis: Funções de Utilizador (procedimentos Xbase com parâmetros — ex.: calcular margem), Teclas de Utilizador (atalhos com descrição no rodapé), Instruções Internas (o 'manual da casa' escrito dentro de cada ecrã principal) e Alertas programados (funções internas como CriaAvs criam avisos a utilizadores; U_NAVEGA navega entre registos/ecrãs). Versões recentes acrescentam funções internas novas (ex.: envios SII; PromptFunction() para IA).", "s": [["Função de utilizador", "Código Xbase reutilizável com parâmetros/retorno — DRY aplicado ao ERP."], ["Tecla de utilizador", "Atalho de teclado personalizável (com descrição visível em rodapé)."], ["Instruções internas", "Procedimento operacional escrito pelo utilizador, associado a cada ecrã principal."], ["CriaAvs", "Função interna que cria avisos/avisos internos a utilizadores (parâmetros: stamp, userAv...)."], ["U_NAVEGA", "Função interna de navegação programática (interage com o parâmetro 'mostrar último registo')."], ["PromptFunction()", "Função da framework (202601) para invocar IA/Cegid Pulse — base dos Smart Tools."]], "e": ["Duplicar o mesmo código em 10 eventos em vez de criar 1 função de utilizador", "Instruções internas desatualizadas (pior que não existirem)"]}, "L48": {"c": "IDUs (Ecrãs Personalizados) são ecrãs novos desenhados pelo utilizador no Desenhador de Ecrãs: páginas, campos ligados a tabelas, grelhas, botões — tudo com eventos Xbase e parâmetros de ecrã. Ligam-se a menus novos (Menus/Opções de Ecrã da framework) e entre si (Ligações entre IDUs). No POS touch há drag-and-drop de objetos. Um bom IDU resolve o que os ecrãs standard não cobrem: painéis de crédito, consolas de operação, wizards internos.", "s": [["Desenhador de ecrãs", "Ferramenta que cria o IDU (objetos: texto, campos de ficheiro/ligação, grelhas, botões, árvore...)."], ["Menu de utilizador", "Menus novos para organizar IDUs/análises criadas (framework)."], ["Ligações entre IDUs", "Navegação de um ecrã personalizado para outro passando contexto."], ["Objetos deste ecrã", "Opção que lista propriedades dos objetos do ecrã — útil ao programar eventos."], ["Parâmetros de ecrã", "Configuração específica do comportamento do ecrã personalizado."]], "e": ["IDU a duplicar o que um mapa/análise standard já resolve (manutenção dupla)", "Ecrã sem acessos configurados (toda a gente vê o que não devia)"]}, "L49": {"c": "Performance é medição, não opinião: cronometre a análise lenta (SET STATISTICS TIME no SSMS), veja o plano de execução, e ataque com as ferramentas certas — Índices de Utilizador (framework) cobrindo JOINs/filtros (INCLUDED COLUMNS para colunas de output), desfragmentação das tabelas principais (utilitário PHC) + manutenção de índices SQL, BD de arquivo para históricos, File Storage para anexos, e parâmetros de UI (ecrãs em memória ON, 'mostrar último registo' OFF em BDs grandes). Registe antes/depois — sem números não há otimização.", "s": [["Índice de utilizador", "Índice via framework sobre tabelas do software — persiste em upgrades."], ["INCLUDED COLUMNS", "Colunas 'de cobertura' no índice que evitam lookup à tabela (v19+)."], ["Desfragmentar tabelas principais", "Utilitário PHC para manutenção de fragmentação."], ["BD de arquivo", "Históricos movidos para BD própria — tabelas ativas mais rápidas."], ["Parâmetros de performance", "Ecrãs em memória, mostrar último registo OFF, processamento assíncrono."], ["sp_spaceused / DMVs", "Medição de espaço e fragmentação (sys.dm_db_index_physical_stats)."]], "e": ["Criar índices 'para tudo' (cada índice custa escrita nas gravações)", "Otimizar sem medir antes/depois (pode piorar e nem saber)"]}, "L50": {"c": "O lado web (PHC CS Web — Gestão Web, Front Web, POS Web) partilha a BD e tem framework própria em C#: Editor de Código para Eventos e Regras, Ecrãs/Objetos de Utilizador, Templates, Monitores, Filtros, Valores por Defeito — e Scripts: programas executados quando se chama um URL (endpoints para integrações, ex.: devolver JSON de stock à loja online). O Log de Código é a Análise Interna da web. Relatórios web usam DevExpress. No Evolution, o acesso web está incluído na subscrição.", "s": [["Framework Web (C#)", "Eventos, regras e ecrãs de utilizador programados em C# no Editor de Código."], ["Scripts por URL", "Endpoint próprio: um URL identifica o script; a resposta pode ser JSON/HTML — base de integrações leves."], ["Log de Código", "Diagnóstico da execução do código de utilizador na web."], ["Front Web", "Extranet para clientes/fornecedores (documentos, encomendas, dossiers)."], ["DevExpress", "Tecnologia dos relatórios no PHC CS Web (Clientes, Faturação, Recibos...)."]], "e": ["Scripts por URL sem autenticação/validação (qualquer pessoa com o URL acede — proteger!)", "Assumir que o código Xbase do desktop 'funciona igual' na web (são frameworks/linguagens diferentes)"]}, "L51": {"c": "Projetos de personalização seguem um ciclo profissional: requisito → desenho (que objetos da framework usar) → implementação em clone → testes com cenários (feliz, limites, erro) → documentação → produção → revalidação pós-upgrade. A solução 'Controlo de Crédito' combina tudo o que aprendeu: campo de utilizador (limite), regra (bloqueio), alerta (aviso ao gestor), IDU (consulta), análise (exposição). Como as personalizações vivem na BD, sobrevivem à reinstalação do executável — mas NUNCA assuma: revalide após cada upgrade.", "s": [["Requisito → desenho", "Traduzir o pedido do negócio em objetos da framework (campo? regra? evento? IDU?)."], ["Cenários de teste", "Dentro do limite, acima, sem limite, documento a dinheiro, alteração do limite — os 5 mínimos."], ["Documentação viva", "notas/projeto-X.md: o que foi criado, onde, código, testes — o próximo técnico (ou você em 6 meses) agradece."], ["Persistência na BD", "Personalizações gravam na base de dados (framework) — reinstalar o exe não as apaga; upgrade exige revalidação."]], "e": ["Implementar direto em produção 'porque é só um campinho'", "Não documentar (em 6 meses ninguém sabe o que aquele evento faz)"]}, "L52": {"c": "EyePeak é a plataforma de logística/WMS/e-commerce do ecossistema Cegid (Primavera) que sincroniza com o PHC: artigos, stocks, séries de documentos e fluxos documentais (ex.: encomendas de fornecedor → guias). No PHC, o ponto de contacto é o monitor 'EyePeak Sincronização' (menu Supervisor) e o Monitor de Configurações (consistência de séries). Para o técnico: entender o que sincroniza, em que direção, e como diagnosticar quando 'não bate' entre sistemas.", "s": [["EyePeak Sincronização", "Monitor no Supervisor que comunica dados ERP ↔ EyePeak."], ["Sincronização de séries", "Garantir consistência das séries de faturação entre ERP e EyePeak (Monitor de Configurações)."], ["Fluxo de fornecedores", "Exemplo documentado: encomendas → guias entre Cegid PHC e EyePeak."], ["Direção dos dados", "Quem é mestre de cada entidade (artigos no ERP? stock no WMS?) — definir antes de sincronizar."]], "e": ["Sincronizar sem definir a entidade mestre de cada dado (conflitos de sobrescrita)", "Ignorar logs de sincronização quando os stocks 'não batem'"]}, "L53": {"c": "Faturação eletrónica = trocar faturas em formato estruturado (não PDF!). Em Portugal, a norma para o setor público é CIUS-PT (perfil nacional da norma europeia EN 16931); o envio faz-se por webservices/plataformas como SaphetyDoc (artigo oficial de configuração no Help Center) ou via Cegid Docs — que também faz arquivo digital legal: faturas de fornecedor CIUS-PT chegam, são anexadas em PDF e PRÉ-LANÇADAS automaticamente (202601). O módulo Documentos Eletrónicos trata de EAN/EDI. PDF não é fatura eletrónica — é impressão.", "s": [["CIUS-PT", "Especificação portuguesa de faturação eletrónica (obrigatória em contratação pública)."], ["SaphetyDoc", "Plataforma/webservice de troca de documentos eletrónicos com configuração documentada para o PHC."], ["Cegid Docs", "Gestão documental cloud + arquivo digital legal; pré-lançamento de faturas de fornecedor (202601+)."], ["Documentos Eletrónicos (módulo)", "EAN da empresa, EDI — infraestrutura de troca estruturada."], ["PDF/A-3 e anexos", "Arquivo com comprovativos anexos — o File Storage separa o que é fiscalmente relevante (BD) do resto."]], "e": ["Enviar PDF por e-mail e chamar-lhe fatura eletrónica (para o setor público não é)", "Pré-lançar faturas de fornecedor sem revisão humana inicial (validar o mapeamento antes de confiar)"]}, "L54": {"c": "Cegid Pulse é o ecossistema de IA do Evolution (plano Plus+): agentes que respondem em linguagem natural sobre os dados do ERP ('quais os clientes com faturas em atraso?'), assistentes de negócio por área (o primeiro: comercial) e Smart Tools que os PARCEIROS podem configurar e monetizar — com a função de framework PromptFunction() (202601). A ativação tem 3 passos: acesso ao módulo → ativar Cegid Account na ficha do utilizador → login (deteção automática). Dados confidenciais não saem do controlo do ecossistema Cegid. Antes do Pulse existiam a assistente Cris e o PHC CS GenAI (templates de Q&A, 202501).", "s": [["Cegid Pulse", "Agentes de IA no ERP com analítica sobre dados reais (vendas, tesouraria, stocks)."], ["Ativação em 3 passos", "1) acesso ao módulo; 2) Cegid Account na ficha do utilizador; 3) login detetado automaticamente."], ["Cegid Account", "Identidade única do ecossistema (Microsoft/Google + 2FA), ativação por utilizador (202601)."], ["Assistentes de negócio", "Assistentes por área configuráveis pelo utilizador (comercial primeiro)."], ["Smart Tools + PromptFunction()", "Ferramentas de IA configuráveis/monetizáveis pelos parceiros via framework."], ["Cris / GenAI", "Assistente e templates de perguntas-resposta anteriores ao Pulse (202501)."]], "e": ["Perguntar à IA e não validar contra os monitores/análises (a resposta deve conferir com os dados)", "Esquecer que o Pulse requer plano Plus+ e Cegid Account ativo por utilizador"]}, "L55": {"c": "Upgrades são o teste de maturidade do técnico: a cada versão (agora anual: 202501, 202601...) mudam funcionalidades, parâmetros e obrigações legais. O ritual: ler a Listagem de Novidades da versão de destino → clonar a BD → fazer o upgrade no clone → validar TUDO (abertura, séries, emissão, SAF-T, personalizações: campos/regras/eventos/IDUs/análises, web, integrações, alertas) → verificar Análise Interna/Log de Código → corrigir → agendar produção com backup fresco e plano de rollback. Personalizações vivem na BD: 'sobrevivem' na teoria — na prática, revalidam-se sempre.", "s": [["Listagem de Novidades", "Documento oficial por versão (Help Center/PDFs) — o mapa do que pode quebrar."], ["Clone primeiro", "Upgrade testa-se em BD clonada, nunca direto em produção."], ["Checklist de validação", "Lista escrita do que testar (séries, SAF-T, regras, eventos, IDUs, análises, web, integrações)."], ["Plano de rollback", "Backup pré-upgrade + procedimento de retorno se algo falhar."], ["Janela de paragem", "Upgrade faz-se sem utilizadores ligados (ficheiros/BD em uso bloqueiam)."]], "e": ["Upgrade 'à sexta às 18h sem clone' — o clássico que acaba em madrugada de domingo", "Não reler as novidades (a solução para o seu bug pode estar documentada lá)"]}, "L56": {"c": "O projeto final simula a implementação real — o que um consultor faz num cliente: diagnóstico do negócio (processos, volumes, obrigações) → desenho da solução (séries, circuitos, acessos, integrações) → configuração → migração de dados (Excel/ODBC, validação de saldos e stocks) → testes de ciclo completo → formação dos utilizadores → arranque assistido (go-live) → pós-arranque (ajustes, métricas). A diferença entre técnico e consultor expert: o expert desenha o processo ANTES de configurar, antecipa fiscalidade e upgrade, e mede o sucesso (tempo de faturação, erros, adoção).", "s": [["Diagnóstico", "Entrevistas + dados: o que a empresa vende/compra, como, volumes, obrigações, quem faz o quê."], ["Desenho da solução", "Séries e circuitos documentais, plano de contas de integração, acessos por perfil, integrações necessárias."], ["Migração de dados", "Carregamento de ficheiros (clientes, artigos, saldos, stock inicial via dossiers) com validação de totais."], ["Testes de aceitação", "Ciclos completos com dados reais + SAF-T validado antes do go-live."], ["Formação + manuais", "Utilizadores treinados nos SEUS processos (não nas funcionalidades genéricas)."], ["Go-live e pós-arranque", "Arranque assistido, janela de acompanhamento, métricas de sucesso e lista de melhorias."]], "e": ["Configurar antes de desenhar o circuito documental (refazer séries depois custa caro)", "Go-live sem saldos de abertura validados (C/C e stock errados desde o dia 1)"]}}};

var GLOSSARIO=[
{"t":"AT — Autoridade Tributária e Aduaneira","d":"O 'fisco' português: entidade que fiscaliza impostos, certifica software de faturação e recebe as comunicações (e-fatura, SAF-T, documentos de transporte).","tag":"Fiscal"},
{"t":"ATCUD — Código Único de Documento","d":"Código impresso em todas as faturas: código de validação da série (dado pela AT) + número sequencial. Ex.: ABC12345-6789. Vem acompanhado do QR Code.","x":"Desde 2021 é obrigatório. Sem o código de validação da série associado no PHC, o software bloqueia a impressão dos documentos. A série comunica-se à AT no Portal das Finanças antes de ser usada.","tag":"Fiscal"},
{"t":"SAF-T (PT) — Standard Audit File for Tax","d":"Ficheiro XML normalizado que 'fotografa' a atividade da empresa para auditoria fiscal. Existem 4 sabores: faturação, transportes (resumido), inventário e contabilidade.","x":"O SAF-T de faturação exporta-se mensalmente (substitui a comunicação e-fatura manual) e contém Header (nº certificado do software), Customer, Product e Invoice com totais por taxa de IVA, hashes e tipos FT/FS/FR/NC/ND. Valide sempre num validador antes de entregar.","tag":"Fiscal"},
{"t":"e-Fatura","d":"Sistema da AT que recebe as suas faturas (por webservice em tempo real ou via SAF-T mensal) para o consumidor pedir CPF na fatura e a AT cruzar dados.","tag":"Fiscal"},
{"t":"Software certificado pela AT","d":"Programas de faturação validados pela AT (nº de certificado impresso nos documentos). O PHC é certificado — por isso documentos emitidos não se apagam: anulam-se com motivo e corrigem-se com NC.","tag":"Fiscal"},
{"t":"Hash / assinatura digital qualificada","d":"Cada documento gera uma hash encadeada ao documento anterior da série: se alguém alterar um documento antigo, a cadeia quebra e a fraude deteta-se.","tag":"Fiscal"},
{"t":"QR Code em faturas","d":"Código bidimensional obrigatório nos documentos fiscalmente relevantes desde 2021: contém NIFs, valores por taxa, tipo de documento, ATCUD, hash, etc. Qualquer smartphone o lê.","tag":"Fiscal"},
{"t":"Documento de transporte (Guia de Remessa)","d":"Documento que acompanha mercadorias em circulação (tipo 4 na configuração de séries). Tem de indicar locais de carga/descarga, data e hora de início do transporte.","x":"Comunica-se à AT ANTES do transporte começar: por webservice (devolve o Cód. Ident. AT) ou por SAF-T (PT) resumido (elementos ShipFrom/ShipTo em MovementOfGoods). Na estrada, a fiscalização exige o código de identificação.","tag":"Fiscal"},
{"t":"Motivo de isenção (M01–M99)","d":"Código legal que justifica por que uma linha não tem IVA (ex.: M01 — isento art. 15.º; M08 — isento art. 9.º; M99 — não sujeito). Obrigatório no SAF-T quando há valores isentos.","x":"Com 'Método de envio de faturas' = Webservice, o PHC só deixa escolher códigos M01-M99 normalizados — motivos inventados pelo utilizador são avisados/rejeitados.","tag":"Fiscal"},
{"t":"Retenção na fonte (IRS/IRC)","d":"O cliente retém parte do pagamento e entrega ao Estado por conta do fornecedor (típico em serviços de profissionais liberais/sociedades). Na fatura aparece a taxa e o valor; a C/C fica pelo líquido.","tag":"Fiscal"},
{"t":"Imposto do Selo","d":"Imposto sobre operações específicas (crédito, juros, recibos de quitação com prazo, etc.), com verbas da Tabela Geral. Aparece em operações financeiras da tesouraria.","tag":"Fiscal"},
{"t":"IVA — Imposto sobre o Valor Acrescentado","d":"Imposto sobre o consumo: taxas de 23% (normal), 13% (intermédia) e 6% (reduzida) em Portugal continental (Açores/Madeira têm taxas próprias). Cobra-se nas vendas (liquidado) e recupera-se nas compras (dedutível).","tag":"Fiscal"},
{"t":"Reverse charge / autoliquidação","d":"Em operações intra-UE de serviços e certas vendas, o IVA é liquidado pelo CLIENTE no país dele: a fatura sai sem IVA com menção 'autoliquidação/reverse charge' (Diretiva 2006/112).","tag":"Fiscal"},
{"t":"Operação triangular (UE)","d":"Venda em cadeia entre 3 operadores de países UE diferentes com transporte direto do 1.º para o 3.º — regras de IVA próprias; o PHC tem campo próprio no documento.","tag":"Fiscal"},
{"t":"Intrastat","d":"Declaração estatística de trocas de bens intra-UE (acima de limiares definidos anualmente). Alimenta-se dos documentos de compra/venda intra-comunitários.","tag":"Fiscal"},
{"t":"Comunicação de inventário à AT","d":"Empresas acima de certo volume de negócios entregam até 31 de janeiro o inventário valorizado (ficheiro SAF-T/CSV/XML conforme regras). O PHC gera os formatos.","tag":"Fiscal"},
{"t":"CIUS-PT","d":"Especificação portuguesa de faturação eletrónica (Core Invoice Usage Specification da EN 16931): obrigatória na contratação pública. O PHC envia via webservices/plataformas (ex.: SaphetyDoc) e o Cegid Docs arquiva/pré-lança.","tag":"Fiscal"},
{"t":"SDR — Sistema de Depósito e Recolha","d":"Desde 10/04/2026: depósito de 0,10 € por embalagem de bebida de uso único (até 3 L), cobrado automaticamente na venda (configuração 202601+). O consumidor recupera-o devolvendo a embalagem.","tag":"Fiscal"},
{"t":"SII / TicketBAI (Espanha)","d":"Regimes fiscais espanhóis suportados pelo executável ES do PHC: SII (envio imediato de informação à AEAT) e TicketBAI (País Basco).","tag":"Fiscal"},
{"t":"RGPD","d":"Regulamento de proteção de dados: aviso legal, registo de tratamentos, direito ao esquecimento (anonimização preservando documentos fiscais) e histórico de acessos — ferramentas nativas do PHC.","tag":"Fiscal"},
{"t":"NIF / NIPC","d":"Número de Identificação Fiscal (11 = pessoa singular, 9 dígitos; empresas: 5XX XXX XXX com dígito de controlo mod-11). NIPC é o mesmo número para pessoas coletivas.","tag":"Fiscal"},
{"t":"CAE","d":"Código de Atividade Económica (ex.: 55110 hotéis, 47410 retalho de computadores): classifica a atividade da empresa — influencia obrigações fiscais e estatísticas.","tag":"Fiscal"},
{"t":"SNC / TOC(CC)","d":"Sistema de Normalização Contabilística (plano de contas português) e Técnico/Contabilista Certificado — o contabilista que recebe o seu SAF-T e integra a contabilidade.","tag":"Contabilidade"},
{"t":"CEVMC","d":"Custo das Existências Vendidas e das Mercadorias Consumidas: o 'custo do que vendeu' apurado na contabilidade (compras ± variação de existências), essencial para o resultado e o Modelo 22.","tag":"Contabilidade"},
{"t":"Modelo 22 / Modelo 30 / DMR","d":"Declarações fiscais: Modelo 22 (IRC anual), Modelo 30 (rendimentos pagos a não residentes), DMR (Declaração Mensal de Remunerações — trabalho). Saem dos módulos Contabilidade/Pessoal.","tag":"Contabilidade"},
{"t":"Declaração Periódica de IVA","d":"Declaração (mensal ou trimestral) do IVA liquidado menos dedutível, apurada na Contabilidade a partir dos documentos do Gestão.","tag":"Contabilidade"},
{"t":"Documento pré-definido","d":"Modelo de contabilização automática: mapeia cada tipo de documento do Gestão (fatura, compra, recibo) para lançamentos com contas SNC (21 clientes, 22 fornecedores, 24 IVA, 71/72 vendas…).","tag":"Contabilidade"},
{"t":"PCMP — Preço de Custo Médio Ponderado","d":"Método de custeio do stock: cada entrada valorizada recalcula o custo médio = (valor anterior + valor entrada) / (qty anterior + qty entrada). Valoriza saídas, margens e inventário.","x":"Se lançar compras a custo 0 'para despachar', destrói PCMP, margens e CEVMC. Confira o novo PCMP após entradas grandes.","tag":"Stocks"},
{"t":"Lote","d":"Subdivisão do stock com rastreabilidade (produção, validade): entradas e saídas referenciam o lote. Obrigatório em alimentar/farma; útil em qualquer perecível.","tag":"Stocks"},
{"t":"Número de série","d":"Identificador único por unidade física (com o módulo Equipamentos): eletrónica, máquinas, garantias. Cada saída fica associada ao nº de série vendido.","tag":"Stocks"},
{"t":"Stock cativo / pré-cativo","d":"Reservas de stock: cativo (comprometido, ex.: encomenda) e pré-cativo (indicativo). Reduzem a disponibilidade efetiva sem sair do armazém.","tag":"Stocks"},
{"t":"Ponto de encomenda","d":"Nível de stock que dispara a recomendação de compra (considera consumo e lead time do fornecedor). A análise 'a encomendar' usa-o.","tag":"Stocks"},
{"t":"Rutura de stock","d":"Artigo sem stock para vender = venda perdida. A análise de ruturas é o alerta vermelho do aprovisionamento.","tag":"Stocks"},
{"t":"Inventário físico / contagem","d":"Contagem real do armazém confrontada com o stock teórico; diferenças geram acertos automáticos (quebra = falta, sobra = excesso) que atualizam quantidades e valor.","tag":"Stocks"},
{"t":"Composto (Kit)","d":"Artigo formado por componentes (pack, refeição, conjunto): configura-se a composição e o comportamento na faturação/stock.","tag":"Stocks"},
{"t":"Unidade alternativa / factor de conversão","d":"Vender caixas de 10 unidades: a unidade alternativa + factor converte quantidades e preços entre unidade base e alternativa (com opção de inversão).","tag":"Stocks"},
{"t":"Referência alternativa","d":"Código do artigo na linguagem do cliente ou do fornecedor: digita-se o código deles e o PHC assume o artigo certo.","tag":"Stocks"},
{"t":"Armazém","d":"Local lógico de stock (principal, loja, trânsito, estaleiro). Todo o movimento tem armazém origem/destino; transferências usam dossier próprio.","tag":"Stocks"},
{"t":"Dossier Interno (DI)","d":"Documento não fiscal parametrizável (tabela BO): orçamentos, encomendas, propostas, folhas de obra, consignações, avenças, transferências, stock inicial. O 'rascunho estruturado' que se converte em faturas/compras.","x":"O circuito clássico: Orçamento → Encomenda → Guia → Fatura. Encomendas podem reservar stock; o fecho/estado controla pendentes. Aprovação formal de dossiers existe na gama Enterprise.","tag":"Documentos"},
{"t":"Série (de documentos)","d":"Configuração que dá identidade a um documento: tipo (1-5), mapping SAF-T, numeração e o que movimenta (stock, C/C, tesouraria). O objeto mais importante da faturação.","tag":"Documentos"},
{"t":"Tipos de documento (1-5)","d":"1/2/3 = fatura, fatura simplificada, fatura-recibo (e ND/NC via SAF-T); 4 = documento de transporte (guia); 5 = outro (proforma — não movimenta nada).","tag":"Documentos"},
{"t":"FT / FS / FR / ND / NC / GT","d":"Códigos SAF-T dos documentos: Fatura (FT), Fatura Simplificada (FS), Fatura-Recibo (FR), Nota de Débito (ND), Nota de Crédito (NC), Guia de Transporte (GT/GA/GC).","tag":"Documentos"},
{"t":"Fatura-recibo (FR)","d":"Fatura e recibo num só documento: emite-se e recebe-se no ato (típico de serviços pontuais/clínicas).","tag":"Documentos"},
{"t":"Nota de Crédito (NC)","d":"Documento que anula/devolve valor (ou stock) de uma fatura: total ou parcial. Exige Motivo de Retificação e referencia o documento original.","tag":"Documentos"},
{"t":"Nota de Débito (ND)","d":"Documento que acrescenta valor em falta a um cliente (juros, correções). Também exige motivo de retificação.","tag":"Documentos"},
{"t":"Proforma","d":"Documento tipo 5 sem valor fiscal (proposta formal de venda): não movimenta stock, C/C nem tesouraria.","tag":"Documentos"},
{"t":"Venda a dinheiro","d":"Venda de balcão a consumidor final com pagamento no ato (cliente genérico 'Consumidor Final', NIF 999999990 quando não é fornecido).","tag":"Documentos"},
{"t":"Data efetiva de entrega","d":"Data em que bens/serviços foram/serão disponibilizados ao adquirente — campo obrigatório por lei, comunicado no SAF-T.","tag":"Documentos"},
{"t":"Motivo de anulação","d":"Campo obrigatório ao anular um documento (a aplicação insiste até preencher). Documento anulado nunca desaparece — fica marcado para auditoria.","tag":"Documentos"},
{"t":"Avença","d":"Dossier de faturação recorrente (mensalidades, contratos, rendas): configura-se uma vez e o motor gera o documento de cada período.","tag":"Documentos"},
{"t":"Folha de obra","d":"DI que acumula trabalho de uma obra/intervenção (horas, materiais, subcontratos) para faturar por medições/fases — clássico da construção e oficinas.","tag":"Documentos"},
{"t":"Consignação","d":"Mercadoria entregue a terceiro para vender por conta do dono (não há faturação até a venda acontecer): DI próprio controla o stock à responsabilidade de terceiros.","tag":"Documentos"},
{"t":"Emissão automática de faturação","d":"Ecrã de preparação que fatura em lote (guias, encomendas, avenças) por período/cliente — poupa horas no fim do mês.","tag":"Documentos"},
{"t":"Conta corrente (C/C)","d":"O livro de dívidas/créditos por cliente ou fornecedor: movimentos tipificados (códigos de C/C), saldo corrente e saldo por idades.","tag":"Financeiro"},
{"t":"Aging / saldos por idades","d":"Distribuição da dívida por escalões de atraso (0-30, 31-60, 61-90, +90): O indicador de risco de crédito e o mapa de trabalho das cobranças.","tag":"Financeiro"},
{"t":"Liquidação","d":"Casar recibos/pagamentos com faturas (total ou parcial): o que sobra fica como saldo pendente no aging.","tag":"Financeiro"},
{"t":"Recibo de adiantamento","d":"Dinheiro recebido antes da fatura: fica como crédito na C/C e regulariza-se quando a fatura é emitida (pode gerar NC de retificação automática).","tag":"Financeiro"},
{"t":"Recibo incobrável","d":"Classificação de dívida perdida (com tratamento fiscal próprio) — encerra a cobrança ativa sem apagar o histórico.","tag":"Financeiro"},
{"t":"SEPA","d":"Zona Única de Pagamentos em Euros: ficheiros normalizados de débitos diretos (cobranças) e transferências (pagamentos) que o PHC gera para o banco.","tag":"Financeiro"},
{"t":"Referência Multibanco","d":"Entidade+referência gerada por documento/cliente para pagamento na rede MB — identificação automática do recebimento.","tag":"Financeiro"},
{"t":"Open banking","d":"No Evolution: ligação direta aos bancos para importar movimentos, acelerar reconciliações e melhorar previsões de tesouraria.","tag":"Financeiro"},
{"t":"Tesouraria real / previsional / orçamental","d":"Real = movimentos ocorridos; previsional = entradas/saídas esperadas (vencimentos, títulos, avenças); orçamental = plano aprovado. Comparar as três responde 'chega para os salários?'.","tag":"Financeiro"},
{"t":"Títulos (letras/cheques)","d":"Instrumentos de pagamento com data futura em carteira — entram na tesouraria previsional e têm circuito de cobrança/pagamento próprio.","tag":"Financeiro"},
{"t":"Reconciliação bancária","d":"Confrontar extracto do banco × movimentos do ERP, movimento a movimento: deteta omissões, duplicações e comissões não lançadas.","tag":"Financeiro"},
{"t":"Condição de pagamento","d":"Prazo/vencimento combinado (30 dias, 30/60/90, pronto pagamento) que alimenta C/C e tesouraria previsional.","tag":"Comercial"},
{"t":"Tabela de preços (com validades)","d":"Conjunto nomeado de preços (Revenda, Retalho, Promo) com início/fim de validade: o documento assume o preço válido na data para a tabela do cliente.","tag":"Comercial"},
{"t":"Rappel","d":"Desconto retroativo por volume atingido no período (cliente ou fornecedor): apura-se no fim e paga-se/emite-se por NC ou crédito.","tag":"Comercial"},
{"t":"Comissões","d":"Remuneração de vendedores configurável por vendedor, tipo de cliente ou família de artigos — sobre faturado ou cobrado (decisão política com impacto enorme).","tag":"Comercial"},
{"t":"Promoções e campanhas","d":"Descontos temporários por artigo/família com datas de validade (opções extra nas gamas Advanced/Enterprise).","tag":"Comercial"},
{"t":"Ficheiro (tabela)","d":"No vocabulário PHC, 'ficheiros' são as tabelas mestras: clientes, fornecedores, artigos (Stocks e Serviços), etc.","tag":"Plataforma"},
{"t":"Gama vs Plano","d":"Gama = nível funcional histórico (Corporate/Advanced/Enterprise); Plano = modelo de subscrição do Evolution (Standard→Ultimate). Juntos definem o que pode configurar/desenvolver.","tag":"Plataforma"},
{"t":"PHC On","d":"Acordo anual de atualizações (software + legislação) com portal de formação, truques e dicas e o Calendário PHC de obrigações legais.","tag":"Plataforma"},
{"t":"Comunidade PHC","d":"Portal de parceiros/clientes (community.phcsoftware.com): área técnica e comercial com login Nº Cliente + ID Técnico.","tag":"Plataforma"},
{"t":"Help Center","d":"Manuais e artigos oficiais públicos (helpcenter.phccs.net / phc.pt portal) + botão Ajuda dentro da aplicação — a fonte primária de verdade.","tag":"Plataforma"},
{"t":"ODBC / DSN","d":"Ponte standard entre a aplicação e o SQL Server; o instalador (exe único) cria o DSN. Metade dos problemas de ligação diagnosticam-se aqui.","tag":"Plataforma"},
{"t":"Empresa = base de dados","d":"Cada empresa PHC é uma BD SQL Server própria; multiempresa = várias BDs no mesmo servidor.","tag":"Plataforma"},
{"t":"Detach / Attach","d":"Desanexar/anexar BDs no SQL Server: a forma rápida de clonar ambientes para teste de upgrades e personalizações.","tag":"Plataforma"},
{"t":"stamp / ref","d":"Campos estruturais das tabelas PHC: ref identifica o registo; stamp marca a versão do registo (concorrência/navegação; aparece em snapshots como #stamp#).","tag":"Plataforma"},
{"t":"Dicionário de Dados","d":"Ferramenta (Supervisor → Tratamento da base de dados) que mostra campos, tipos e RELAÇÕES de qualquer tabela — o mapa do tesouro do programador PHC.","tag":"Dev"},
{"t":"Framework PHC","d":"Conjunto de ferramentas de personalização (Supervisor → Framework): campos/tabelas/índices/regras/eventos/funções de utilizador, IDUs, monitores, alertas — tudo gravado na BD.","tag":"Dev"},
{"t":"Xbase","d":"Linguagem de personalização do desktop (sintaxe Visual FoxPro): eventos, regras e funções de utilizador.","tag":"Dev"},
{"t":"ObjRecebido","d":"Objeto disponível nos eventos Xbase: .Janela (o ecrã), .Objecto (o objeto, com Value/Parent) e .MeusDados (repositório chave-valor entre eventos).","tag":"Dev"},
{"t":"Return .F.","d":"Num evento Xbase, cancela o comportamento padrão do objeto (a tecla não entra, o calendário não abre…). Em expressões não se usa Return.","tag":"Dev"},
{"t":"IDU / Ecrã personalizado","d":"Ecrã novo desenhado pelo utilizador (desenhador de ecrãs): campos, grelhas, botões com eventos — ligado a menus próprios.","tag":"Dev"},
{"t":"Análise Interna","d":"O log de erros do código de utilizador (desktop) — primeiro sítio a ver quando um evento 'não faz nada'. Na web chama-se Log de Código.","tag":"Dev"},
{"t":"Snapshot","d":"Consulta T-SQL contextualizada (variáveis como #stamp#) exibida em painéis: dados do registo em foco no ecrã.","tag":"Dev"},
{"t":"Análise de utilizador / multidimensional","d":"Consulta SQL do utilizador em grelha (Advanced+); promovível a multidimensional com drill-down por dimensões (ano→mês→cliente).","tag":"Dev"},
{"t":"Script (web) por URL","d":"Na framework web (C#): programa executado quando se chama um URL — endpoint leve para integrações (ex.: stock para a loja online).","tag":"Dev"},
{"t":"EyePeak","d":"Plataforma de logística/WMS/e-commerce (Cegid Primavera) que sincroniza com o PHC via monitor 'EyePeak Sincronização' (Supervisor).","tag":"Módulos"},
{"t":"Cegid Pulse","d":"Ecossistema de IA do Evolution (plano Plus+): assistentes de negócio, perguntas em linguagem natural e Smart Tools configuráveis (PromptFunction()).","tag":"Módulos"},
{"t":"Cegid Docs","d":"Gestão documental/arquivo digital legal na cloud: faturas CIUS-PT anexadas em PDF e pré-lançadas automaticamente (202601+).","tag":"Módulos"},
{"t":"PHC CS Web / Front Web","d":"Plataforma web sobre a mesma BD (Gestão Web, POS Web…) e extranet para clientes/fornecedores consultarem documentos e dossiers.","tag":"Módulos"},
{"t":"File Storage","d":"Armazenamento de anexos em diretoria física, na BD ou ambos (202501+); documentos fiscalmente relevantes ficam sempre na BD.","tag":"Plataforma"},
{"t":"Processamento assíncrono","d":"Parâmetro que grava/processa documentos em background: se algo inibir, o documento fica 'não processado' — estado a verificar em diagnósticos.","tag":"Plataforma"}
]

var CIRCUITOS=[
{"id":"vendas","ico":"🛒","t":"Ciclo de Vendas","d":"Do primeiro contacto ao dinheiro na conta: o circuito completo que sustenta 80% do uso diário do módulo Gestão.","slides":[
 {"i":"🗂️","t":"1. Ficheiros","d":"Cliente (NIF, condição de pagamento, tabela de preços, vendedor) e artigos (família, unidade, preço, stock mín/máx) criados e limpos. Lixo aqui = lixo em tudo.","tip":"Use o Ignios (Advanced+) para preencher clientes pelo NIF."},
 {"i":"📝","t":"2. Orçamento (DI)","d":"Proposta comercial sem efeito fiscal. Guarda preços/validade e serve de base à conversão. Tabela BO.","tip":"Dê ao orçamento uma série própria e numeração clara (ORC/2026/001)."},
 {"i":"📦","t":"3. Encomenda (DI)","d":"Cliente aceitou: converte o orçamento em encomenda. Pode reservar/cativar stock — visível na ficha do artigo como 'reservado'.","tip":"Nunca deixe linhas pendentes esquecidas: fecham stock cativo para sempre."},
 {"i":"🚚","t":"4. Guia de transporte (tipo 4)","d":"Mercadoria sai: guia com locais de carga/descarga, data/hora de início, matrícula e motorista. Comunicada à ANTES de circular (webservice ou SAF-T resumido).","tip":"Webservice devolve o Cód. Ident. AT — pode seguir por SMS ao motorista."},
 {"i":"🧾","t":"5. Fatura (FT)","d":"Fatura a guia (conversão): stock baixa em definitivo, C/C do cliente lança a dívida, acumulados atualizam. Entra no SAF-T e leva QR+ATCUD.","tip":"Confira os 3 efeitos: stock, C/C e ficha do cliente."},
 {"i":"💶","t":"6. Recibo (RE)","d":"Cliente paga: recibo liquida a fatura (total/parcial). Multibanco/SEPA/transferência identificam o recebimento.","tip":"Recibo sem liquidação = aging errado. Liquide sempre."},
 {"i":"📊","t":"7. Cobrança & análise","d":"Atrasou? Aging + monitor de dívidas + mailing. No fim: análises de vendas por zona/vendedor/família e margem.","tip":"Rotina semanal de cobranças vale mais que heróis no fim do mês."}]},
{"id":"compras","ico":"📦","t":"Ciclo de Compras","d":"Do aprovisionamento ao pagamento aprovado — onde se ganha margem (custo certo) e se evita rutura.","slides":[
 {"i":"📉","t":"1. Necessidade","d":"Análise de 'a encomendar'/ruturas ou necessidade da obra/produção dispara a compra. Ponto de encomenda bem calibrado = metade do trabalho.","tip":"Revista stocks máx/mín sazonalmente."},
 {"i":"📨","t":"2. Encomenda a fornecedor (DI)","d":"Cria a encomenda com preços combinados; o artigo mostra 'encomendado a fornecedor'. Receções parciais mantêm o remanescente.","tip":"Use a tabela de referências do fornecedor para importar os códigos dele."},
 {"i":"🏗️","t":"3. Receção (guia de entrada)","d":"Mercadoria chega: entrada por documento de compra/guia com conferência de quantidades e lotes (se aplicável).","tip":"Conferir na receção evita guerras de faturação depois."},
 {"i":"🧾","t":"4. Fatura de compra","d":"Regista a fatura do fornecedor (IVA dedutível, custos acessórios): o PCMP é recalculado — o custo médio do stock muda aqui.","tip":"Compreenda a fórmula do PCMP: erros de preço de compra propagam-se a todas as vendas."},
 {"i":"✅","t":"5. Aprovação de pagamento","d":"Circuito de aprovação (Enterprise: aprovação de dossiers) autoriza o pagamento — controlo interno de verdade.","tip":"Sem aprovação configurada, defina pelo menos acessos restritos a pagamentos."},
 {"i":"💸","t":"6. Pagamento","d":"Pagamento (transferência/SEPA) liquida a fatura na C/C do fornecedor; adiantamentos são regularizados aqui.","tip":"Guia de pagamento em lote SEPA poupa horas no fim do mês."}]},
{"id":"series","ico":"🧬","t":"Anatomia de uma Série de Documentos","d":"O objeto de configuração mais importante da faturação — 6 decisões que definem tudo.","slides":[
 {"i":"1️⃣","t":"Tipo (1-5)","d":"1/2/3 = fatura, simplificada, fatura-recibo (+ND/NC); 4 = transporte (guia); 5 = proforma. O tipo muda validações e obrigações.","tip":"Proforma (5) não movimenta nada — perfeita para propostas formais."},
 {"i":"2️⃣","t":"Mapping SAF-T","d":"FT/FS/FR/ND/NC/GT… diz à AT o que o documento é. Mapping errado invalida o ficheiro.","tip":"Confirme o mapping ao criar séries novas — sempre."},
 {"i":"3️⃣","t":"O que movimenta","d":"Stocks? Conta corrente? Tesouraria? Três interruptores com efeitos em cascata.","tip":"Guia (tipo 4) movimenta stock mas não C/C; fatura move os dois."},
 {"i":"4️⃣","t":"Numeração","d":"Sequência por série/ano — sequencial e cronológica por lei. Numeração partida = problema com a AT.","tip":"Não crie duas séries com o mesmo tipo+numeração para o mesmo fim."},
 {"i":"5️⃣","t":"ATCUD/validação","d":"Código de validação da série (dado pela AT) forma o ATCUD com o sequencial. Sem ele, a impressão é bloqueada.","tip":"Comunique séries novas à ANTES da primeira utilização (sobretudo em janeiro)."},
 {"i":"6️⃣","t":"Layout & impressão","d":"Template com QR+ATCUD, logótipo, 'imprimir quando', cópias e acessos de reimpressão.","tip":"Após upgrades, imprima um documento de teste e valide QR/ATCUD."}]},
{"id":"transporte","ico":"🚚","t":"Transporte de Mercadorias & AT","d":"O circuito que mais multas dá a quem o ignora: guias comunicadas antes de a mercadoria circular.","slides":[
 {"i":"📄","t":"1. Emitir a guia (tipo 4)","d":"Locais de carga/descarga (moradas da tabela), data e HORA de início do transporte, matrícula, motorista. Data efetiva de entrega nos documentos fiscais.","tip":"Valide o parâmetro 'Preenche e valida Local de Carga/Descarga' para não deixar campos vazios."},
 {"i":"📡","t":"2. Comunicar à AT","d":"Dois métodos: webservice em tempo real (devolve Cód. Ident. AT) ou SAF-T (PT) resumido (MovementOfGoods com ShipFrom/ShipTo).","tip":"Webservice = prova imediata; SAF-T resumido = útil sem ligação na hora."},
 {"i":"📲","t":"3. Código ao motorista","d":"Com série + módulo SMS configurados, o Cód. Ident. AT segue por SMS ao motorista automaticamente ao gravar.","tip":"Na estrada, a fiscalização pede o código — sem ele, coima."},
 {"i":"🔄","t":"4. Converter em fatura","d":"No fim, fatura-se a guia (ou várias guias numa fatura): 'Faturar este documento' ou emissão automática.","tip":"Guias faturadas ficam marcadas — evite faturação duplicada."},
 {"i":"↩️","t":"5. Devoluções","d":"Devolução de cliente: guia de devolução (GA) ou NC com reposição de stock conforme o caso.","tip":"NC que repõe stock exige série configurada para movimentar stocks."}]},
{"id":"saft","ico":"🏛️","t":"SAF-T & e-Fatura sem medo","d":"O ciclo mensal de conformidade: exportar, validar, entregar — e perceber o XML.","slides":[
 {"i":"📤","t":"1. Exportar","d":"Menu de exportação do SAF-T (PT) de faturação do mês: o ficheiro XML com Header, Customer, Product, Invoice.","tip":"Exporte para pasta própria por mês/ano (ex.: exports/saft_202609.xml)."},
 {"i":"🔍","t":"2. Inspecionar","d":"Abra o XML: DocumentType (FT/FS/FR/NC/ND), Hash, TaxExemptionReason (M01-M99), totais por taxa. Anulados não entram como ativos.","tip":"Procure os seus documentos de teste DO… ops, da sua empresa de treino — não os misture com produção."},
 {"i":"✅","t":"3. Validar","d":"Validador do Portal das Finanças (ou do contabilista): estrutura + regras. Erro comum: motivos de isenção inválidos e sequências partidas.","tip":"Valide SEMPRE antes de entregar — e após mudar séries/parâmetros."},
 {"i":"📨","t":"4. Entregar","d":"Submissão mensal no e-Fatura (ou o contabilista faz). Prazo: até dia 5 (regra geral — confirme o calendário atual).","tip":"O Calendário PHC (PHC On) lembra os prazos todos."},
 {"i":"🔐","t":"5. Integridade","d":"Hash encadeada por série + nº de certificado do software: alterar documentos emitidos quebra a cadeia — é detetável.","tip":"Nunca 'arranje' dados por SQL em documentos certificados; use NC/anulação."}]},
{"id":"cc","ico":"💰","t":"Conta Corrente & Cobranças","d":"Da fatura ao dinheiro: o ciclo que decide se a empresa sobrevive (lucro sem caixa não paga salários).","slides":[
 {"i":"📒","t":"1. Movimentos de C/C","d":"Faturas lançam dívida, recibos liquidam, adiantamentos creditam, juros/débitos ajustam — tudo tipificado por códigos de C/C.","tip":"Códigos de C/C bem desenhados = extractos que o cliente entende."},
 {"i":"⏳","t":"2. Aging","d":"Saldos por idades mostram ONDE está o atraso (0-30/31-60/61-90/+90). É o mapa das cobranças.","tip":"Foque nos escalões +60: é aí que a dívida morre."},
 {"i":"📣","t":"3. Aviso & contacto","d":"Mailing de C/C por documento + extracto de conta. Registe promessas de pagamento (nota/anexo).","tip":"Sem registo das interações, três colegas ligam ao mesmo cliente no mesmo dia."},
 {"i":"🧾","t":"4. Recebimento","d":"Recibo/liquidação (MB, SEPA, transferência). Parcial? Fica saldo pendente — visível no aging.","tip":"Liquide documento a documento: 'recibo solto' sem liquidação estraga tudo."},
 {"i":"⚖️","t":"5. Escalada","d":"Sem pagamento: carta → jurídico → recibo incobrável (com tratamento fiscal). Limite de crédito previne o próximo caso.","tip":"Regra de utilizador que bloqueia vendas acima do limite = cobranças a montante."}]},
{"id":"tesouraria","ico":"🏦","t":"Tesouraria de ponta a ponta","d":"Caixa, bancos, previsões e orçamentos: o painel de bordo financeiro diário.","slides":[
 {"i":"🏦","t":"1. Contas","d":"Cada caixa/banco é uma Conta de Tesouraria (com IBAN); códigos de tesouraria tipificam movimentos.","tip":"Uma conta por banco real — nunca misture caixas."},
 {"i":"📄","t":"2. Extracto & reconciliação","d":"Importa/regista o extracto bancário e reconcilia movimento a movimento com o ERP.","tip":"Reconciliar por totais esconde erros; faça movimento a movimento."},
 {"i":"🔮","t":"3. Previsional","d":"Documentos por vencer + títulos + avenças alimentam a previsão de entradas/saídas.","tip":"Previsão só presta com documentos lançados em dia."},
 {"i":"🎯","t":"4. Orçamental","d":"Orçamento aprovado vs realizado vs previsto: o trio que responde 'podemos investir?'","tip":"Desvios >10% merecem explicação escrita mensal."},
 {"i":"🔁","t":"5. Operações","d":"Transferências entre contas, sangrias de caixa, débitos diretos SEPA, referências MB, open banking (Evolution).","tip":"Alerta de saldo mínimo evita o susto do dia 8 (salários)."}]},
{"id":"integracao","ico":"🧮","t":"Gestão → Contabilidade","d":"Como os documentos comerciais viram lançamentos — a ponte que faz do PHC um ERP a sério.","slides":[
 {"i":"🗺️","t":"1. Plano de contas","d":"Contas SNC preparadas: 21 clientes, 22 fornecedores, 24 IVA, 71/72 vendas, 31/22 compras…","tip":"Desenhe o mapa documento→contas ANTES de configurar."},
 {"i":"🧩","t":"2. Documentos pré-definidos","d":"Para cada tipo de documento do Gestão define-se o lançamento automático (contas, diário, regras).","tip":"Comece por 2-3 tipos (FT, compra, recibo) e evolua."},
 {"i":"⚙️","t":"3. Configurar integração","d":"Contas de integração por cliente/fornecedor/IVA; descritivos com documento original (Advanced+).","tip":"Cliente sem conta de integração = lançamento rejeitado; valide ficheiros novos."},
 {"i":"▶️","t":"4. Integrar lotes","d":"Integração periódica (diária/semanal/mensal) por lote de documentos; estornos e reintegrações têm procedimento próprio.","tip":"Nunca integre em produção sem testar o lote num clone."},
 {"i":"📈","t":"5. Apuramentos","d":"IVA (liquidado vs dedutível) → declaração periódica; CEVMC e resultados no fecho; mapas de gestão.","tip":"Reconcilie totais Gestão × Contabilidade ANTES do fecho mensal."}]},
{"id":"dev","ico":"🛠️","t":"Personalização segura","d":"O ciclo profissional de desenvolvimento na Framework PHC — do dicionário ao upgrade.","slides":[
 {"i":"🗺️","t":"1. Dicionário primeiro","d":"Descubra tabelas/campos/relações no Dicionário de Dados. Nunca adivinhe nomes.","tip":"O menu de opções de cada ecrã abre o dicionário já na tabela certa."},
 {"i":"🧬","t":"2. Estender o modelo","d":"Campos de utilizador (colunas novas), tabelas de utilizador, valores por defeito — nunca ALTER TABLE no core.","tip":"Prefixo de projeto nos nomes (ex.: TreinoLimiteCredito) evita colisões."},
 {"i":"📏","t":"3. Regras & eventos","d":"Regras validam negócio (bloqueios/avisos); eventos Xbase reagem a ações (Init, Clique, Após Atualizar…) com ObjRecebido.","tip":"Return .F. cancela o comportamento padrão — use com pinça."},
 {"i":"🖥️","t":"4. IDUs & menus","d":"Ecrãs personalizados para fluxos que o standard não cobre, ligados a menus e acessos próprios.","tip":"Antes do IDU, confirme que um mapa/análise standard não resolve."},
 {"i":"🧪","t":"5. Testar no clone","d":"Clone da BD → implementar → cenários (feliz, limite, erro) → Análise Interna/Log de Código limpos.","tip":"Documente: notas/projeto-X.md com código, testes e motivo."},
 {"i":"🔄","t":"6. Upgrade-proof","d":"Personalizações vivem na BD e sobrevivem a reinstalações — mas cada upgrade exige revalidação completa.","tip":"Checklist de upgrade por personalização: sem ela, o upgrade é roleta."}]},
{"id":"fecho","ico":"🗓️","t":"Fecho do mês (checklist)","d":"A rotina que separa uma empresa organizada de um incêndio mensal.","slides":[
 {"i":"🧾","t":"1. Documentos em dia","d":"Todas as guias faturadas, faturas emitidas no prazo, NC/ND com motivos, nada em estado 'não processado'.","tip":"Filtre documentos não processados antes de tudo."},
 {"i":"📤","t":"2. SAF-T & AT","d":"Exportar SAF-T do mês, validar, entregar no e-Fatura até ao prazo; transportes todos comunicados.","tip":"Guarde o XML validado no arquivo (File Storage/Cegid Docs)."},
 {"i":"🏦","t":"3. Bancos","d":"Extractos importados e reconciliados; transferências e SEPA executados; tesouraria previsional revista.","tip":"Reconciliação pendente = fecho falso."},
 {"i":"📦","t":"4. Stocks","d":"Movimentos anómalos revistos; contagens cíclicas feitas; valor de stock (PCMP) plausível.","tip":"Quebra gigante num artigo? Investigue antes de ajustar."},
 {"i":"🧮","t":"5. Contabilidade","d":"Integração do mês corrida e reconciliada (Gestão × Contabilidade); IVA apurado; mapas de gestão.","tip":"Totais de vendas/compras têm de bater ao cêntimo."},
 {"i":"📊","t":"6. Reporting","d":"Aging atualizado, KPI de vendas/margens, dashboard da direção — decisão com dados frescos.","tip":"Automatize o envio (e-mail/SMTP) para a direção receber sozinha."}]}
]

var GUIA_HTML="<h1>Guia Completo do T\u00e9cnico Expert \u2014 M\u00f3dulo Gest\u00e3o do Cegid PHC Evolution (Desktop)</h1>\n<blockquote>\n<p><strong>Objetivo:</strong> ser o documento de refer\u00eancia para dominar a 100% o m\u00f3dulo <strong>Gest\u00e3o</strong> do <strong>Cegid PHC Evolution / PHC CS Desktop</strong> \u2014 funcionalmente, na configura\u00e7\u00e3o, na fiscalidade e no desenvolvimento de solu\u00e7\u00f5es personalizadas.</p>\n<p><strong>Data da pesquisa:</strong> setembro de 2026. Vers\u00e3o de refer\u00eancia documentada: <strong>202601</strong> (a PHC passou de numera\u00e7\u00e3o \"v18\u2026v30\" para numera\u00e7\u00e3o por ano/edi\u00e7\u00e3o, ex.: 202501, 202504, 202601).</p>\n<p><strong>Nota importante:</strong> parte da documenta\u00e7\u00e3o profunda da PHC (Comunidade PHC, manuais internos, dicion\u00e1rio de dados completo, ferramentas de parceiro) exige credenciais de <strong>Cliente/Parceiro + ID T\u00e9cnico</strong>. Este guia mapeia tudo o que existe, indica onde est\u00e1 e como se acede, e cobre em detalhe o que \u00e9 p\u00fablico. Onde um detalhe fino depende da vers\u00e3o/gama/pa\u00eds, est\u00e1 assinalado para valida\u00e7\u00e3o no Help Center ou na aplica\u00e7\u00e3o.</p>\n</blockquote>\n<hr />\n<h2 id=\"cap-0\">\u00cdndice</h2>\n<ol>\n<li><a href=\"#cap-1\">O ecossistema Cegid PHC e o produto</a></li>\n<li><a href=\"#cap-2\">Arquitetura t\u00e9cnica da plataforma</a></li>\n<li><a href=\"#cap-3\">Instala\u00e7\u00e3o, infraestrutura e administra\u00e7\u00e3o</a></li>\n<li><a href=\"#cap-4\">M\u00f3dulo Gest\u00e3o \u2014 mapa funcional completo</a></li>\n<li><a href=\"#cap-5\">Configura\u00e7\u00e3o do m\u00f3dulo Gest\u00e3o (o dia-a-dia do t\u00e9cnico)</a></li>\n<li><a href=\"#cap-6\">Fiscalidade e obriga\u00e7\u00f5es legais (Portugal e outras geografias)</a></li>\n<li><a href=\"#cap-7\">Desenvolvimento e personaliza\u00e7\u00e3o (Framework PHC)</a></li>\n<li><a href=\"#cap-8\">Base de dados: estrutura e boas pr\u00e1ticas</a></li>\n<li><a href=\"#cap-9\">Integra\u00e7\u00f5es e ecossistema</a></li>\n<li><a href=\"#cap-10\">Opera\u00e7\u00e3o, suporte, diagn\u00f3stico e performance</a></li>\n<li><a href=\"#cap-11\">Forma\u00e7\u00e3o, certifica\u00e7\u00e3o e recursos oficiais</a></li>\n<li><a href=\"#cap-12\">Plano de estudos at\u00e9 ao n\u00edvel expert</a></li>\n<li><a href=\"#cap-13\">Checklists de autoavalia\u00e7\u00e3o</a></li>\n<li><a href=\"#cap-14\">Gloss\u00e1rio PHC</a></li>\n<li><a href=\"#cap-15\">Fontes e links de refer\u00eancia</a></li>\n</ol>\n<hr />\n<h2 id=\"cap-1\">1. O ecossistema Cegid PHC e o produto</h2>\n<h3>1.1 Hist\u00f3ria e contexto atual</h3>\n<ul>\n<li>A <strong>PHC Software</strong> (PHC Business Software) foi fundada em <strong>Portugal em 1989</strong> e tornou-se num dos ERPs de refer\u00eancia do mid-market portugu\u00eas, com forte presen\u00e7a nos PALOP (Angola, Mo\u00e7ambique, Cabo Verde), Espanha e Peru.</li>\n<li>Em <strong>janeiro de 2025</strong>, a <strong>Cegid</strong> (grupo franc\u00eas, dono tamb\u00e9m da Primavera BSS) adquiriu a PHC. Todos os produtos passam a chamar-se <strong>\"Cegid PHC\"</strong>.</li>\n<li>O produto desktop hist\u00f3rico chamava-se <strong>PHC CS</strong> (Client/Server). O <strong>Cegid PHC Evolution</strong> \u00e9 o <strong>sucessor direto do PHC CS</strong>: mesma plataforma, mesma base de dados, mesma framework \u2014 com modelo de <strong>subscri\u00e7\u00e3o</strong>, acesso <strong>web inclu\u00eddo</strong>, IA (<strong>Cegid Pulse</strong>), gest\u00e3o documental cloud (<strong>Cegid Docs</strong>) e <strong>open banking</strong>.</li>\n<li>O licenciamento <strong>perp\u00e9tuo do PHC CS foi descontinuado</strong>: clientes novos subscrevem o Evolution; clientes com PHC CS perp\u00e9tuo t\u00eam de planear migra\u00e7\u00e3o (que \u00e9, na pr\u00e1tica, uma evolu\u00e7\u00e3o da mesma instala\u00e7\u00e3o).</li>\n</ul>\n<h3>1.2 A fam\u00edlia de produtos Cegid PHC</h3>\n<table>\n<thead>\n<tr>\n<th>Produto</th>\n<th>O que \u00e9</th>\n<th>P\u00fablico</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cegid PHC Evolution</strong></td>\n<td>ERP desktop + web (sucessor do PHC CS). Objeto deste guia.</td>\n<td>PME e mid-market</td>\n</tr>\n<tr>\n<td><strong>Cegid PHC GO</strong></td>\n<td>Gest\u00e3o 100% cloud nativa (SaaS), planos Corporate/Advanced/Enterprise</td>\n<td>Micro e pequenas empresas</td>\n</tr>\n<tr>\n<td><strong>Cegid Pulse</strong></td>\n<td>Ecossistema de agentes de IA integrado no ERP (assistente \"Cris\", assistentes de neg\u00f3cio, Smart Tools)</td>\n<td>Transversal (Evolution a partir do plano Plus)</td>\n</tr>\n<tr>\n<td><strong>Cegid Docs</strong></td>\n<td>Gest\u00e3o documental e arquivo digital legal na cloud, integrado no ERP</td>\n<td>Transversal</td>\n</tr>\n<tr>\n<td><strong>EyePeak (Cegid Primavera EyePeak)</strong></td>\n<td>Plataforma de log\u00edstica/WMS/e-commerce que sincroniza com o ERP PHC</td>\n<td>Log\u00edstica, retalho, B2B</td>\n</tr>\n<tr>\n<td><strong>PHC CS Web</strong></td>\n<td>Plataforma web do CS/Evolution (aplica\u00e7\u00f5es Gest\u00e3o Web, Front Web, POS Web, RH Web\u2026)</td>\n<td>Acesso remoto/browser</td>\n</tr>\n</tbody>\n</table>\n<h3>1.3 Cegid PHC Evolution: planos e gamas</h3>\n<p>O Evolution combina <strong>duas dimens\u00f5es</strong> que o t\u00e9cnico tem de distinguir bem:</p>\n<p><strong>a) Planos de subscri\u00e7\u00e3o (modelo comercial atual):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Plano</th>\n<th>Utilizadores inclu\u00eddos</th>\n<th>Base de dados</th>\n<th>Acesso Web</th>\n<th>Cegid Pulse (IA)</th>\n<th>Capacidade de personaliza\u00e7\u00e3o</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standard</td>\n<td>1</td>\n<td>10 GB</td>\n<td>\u2013</td>\n<td>\u2013</td>\n<td>Baixa</td>\n</tr>\n<tr>\n<td>Plus</td>\n<td>2</td>\n<td>10 GB</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>Baixa</td>\n</tr>\n<tr>\n<td>Advanced</td>\n<td>3</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>M\u00e9dia</td>\n</tr>\n<tr>\n<td>Premium</td>\n<td>3</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>M\u00e9dia</td>\n</tr>\n<tr>\n<td>Ultimate</td>\n<td>5</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>Alta</td>\n</tr>\n</tbody>\n</table>\n<p><strong>b) Gamas funcionais (heran\u00e7a PHC CS, ainda vis\u00edvel na documenta\u00e7\u00e3o e em funcionalidades):</strong></p>\n<ul>\n<li><strong>Corporate</strong> \u2014 micro e pequenas empresas. Funcionalidade essencial, sem ferramentas de personaliza\u00e7\u00e3o/an\u00e1lise avan\u00e7adas.</li>\n<li><strong>Advanced</strong> \u2014 PME. Acrescenta a capacidade de <strong>personalizar o software</strong> (campos/regras/filtros/eventos do utilizador, an\u00e1lises avan\u00e7adas, snapshots, workflow operacional, etc.).</li>\n<li><strong>Enterprise</strong> \u2014 topo de gama. Acrescenta, entre outros, <strong>Sistema de Aprova\u00e7\u00e3o de Dossiers</strong>, p\u00e1ginas/objetos de utilizador com eventos Xbase completos, log de atividade (v30+), e componentes \"Executive\" da framework.</li>\n</ul>\n<blockquote>\n<p>Consequ\u00eancia pr\u00e1tica: <strong>o que consegue configurar/desenvolver depende do plano + gama do cliente</strong>. Muitas ferramentas da Framework PHC s\u00f3 aparecem com par\u00e2metros ativos e gama Advanced/Enterprise. Verifique sempre isto primeiro num projeto.</p>\n</blockquote>\n<h3>1.4 M\u00f3dulos do ERP e onde o Gest\u00e3o se insere</h3>\n<p>O <strong>PHC Gest\u00e3o</strong> \u00e9 o m\u00f3dulo nuclear (comercial + financeiro operacional). O ecossistema de m\u00f3dulos que com ele interage:</p>\n<ul>\n<li><strong>Gest\u00e3o</strong> (clientes, fornecedores, stocks, fatura\u00e7\u00e3o, compras, tesouraria) \u2014 <em>este guia</em></li>\n<li><strong>Contabilidade</strong> (+ PHC XL para grandes volumes/centros anal\u00edticos)</li>\n<li><strong>Imobilizado</strong></li>\n<li><strong>Pessoal / Recursos Humanos</strong> (vencimentos)</li>\n<li><strong>POS / Retalho</strong> (POS Desktop, POS Front, POS Web, touch)</li>\n<li><strong>Suporte</strong> (assist\u00eancia t\u00e9cnica, contratos, instala\u00e7\u00f5es/equipamentos, PATs)</li>\n<li><strong>Manufactor</strong> (produ\u00e7\u00e3o: ordens de fabrico, opera\u00e7\u00f5es, centros de trabalho)</li>\n<li><strong>Obras</strong> e <strong>Ocupa\u00e7\u00e3o</strong> (setoriais)</li>\n<li><strong>Frota</strong> (viaturas), <strong>Equipamentos</strong> (n\u00fameros de s\u00e9rie), <strong>Ecovalor</strong> (taxas ecol\u00f3gicas)</li>\n<li><strong>SMS</strong>, <strong>Documentos Eletr\u00f3nicos</strong> (fatura\u00e7\u00e3o eletr\u00f3nica/EDI), <strong>Dashboard</strong>, <strong>Notify</strong> (alertas/notifica\u00e7\u00f5es)</li>\n<li><strong>PHC CS Web</strong> (Gest\u00e3o Web, Front Web \u2014 extranet de clientes/fornecedores)</li>\n<li><strong>Cegid Pulse</strong> (IA) e <strong>Cegid Docs</strong> (documental)</li>\n</ul>\n<p>O m\u00f3dulo Gest\u00e3o \u00e9 frequentemente designado na documenta\u00e7\u00e3o por <strong>\"PHC CS Gest\u00e3o desktop\"</strong> e tem um manual pr\u00f3prio no Help Center, complementado pelo manual do m\u00f3dulo <strong>Stocks</strong>.</p>\n<h3>1.5 Versionamento e o acordo PHC On</h3>\n<ul>\n<li>Hist\u00f3rico de vers\u00f5es: \u2026 v18, v19, v22, v25, v26, <strong>v27</strong> (QR Code + ATCUD, 2020/21), <strong>v28</strong> (2021), <strong>v29</strong> (2022), <strong>v30</strong> (2023; log de atividade Enterprise) e, depois, numera\u00e7\u00e3o anual: <strong>202401 \u2192 202501 \u2192 202504 \u2192 202601</strong>\u2026</li>\n<li>O <strong>PHC On</strong> \u00e9 o acordo anual de atualiza\u00e7\u00e3o: d\u00e1 direito a <strong>todas as vers\u00f5es e altera\u00e7\u00f5es legislativas durante um ano</strong>, acesso ao portal <code>on.phc.pt</code> com <strong>forma\u00e7\u00e3o online, autoforma\u00e7\u00e3o (filmes tem\u00e1ticos), truques e dicas, novidades exclusivas, motor de procura e o Calend\u00e1rio PHC</strong> (alertas de obriga\u00e7\u00f5es fiscais/laborais, sincronizado por webservice).</li>\n<li>Como t\u00e9cnico: <strong>manter o cliente atualizado \u00e9 requisito de conformidade fiscal</strong> (a AT exige vers\u00f5es atuais \u2014 houve comunica\u00e7\u00f5es oficiais do tipo \"apenas a vers\u00e3o X cumpre os requisitos da AT\"). As novidades de cada vers\u00e3o s\u00e3o publicadas na p\u00e1gina de Novidades do Help Center e em PDFs \"Listagem de Novidades\" (os parceiros publicam-nos, ex.: Arentia, Winsig, NSoft).</li>\n</ul>\n<h3>1.6 Geografias / execut\u00e1veis</h3>\n<p>A plataforma tem execut\u00e1veis e comportamentos espec\u00edficos por pa\u00eds: <strong>PT (Portugal), ES (Espanha \u2014 SII, TicketBAI, prov\u00edncias, documentos eletr\u00f3nicos), PE (Peru \u2014 reten\u00e7\u00f5es), US (English)</strong>, al\u00e9m de PT/AO/MZ/CV para as obriga\u00e7\u00f5es lus\u00f3fonas. Muitas configura\u00e7\u00f5es fiscais (reten\u00e7\u00f5es, comunica\u00e7\u00e3o \u00e0 AT) s\u00f3 fazem sentido no execut\u00e1vel PT. Confirme sempre qual o execut\u00e1vel e pa\u00eds da instala\u00e7\u00e3o.</p>\n<hr />\n<h2 id=\"cap-2\">2. Arquitetura t\u00e9cnica da plataforma</h2>\n<h3>2.1 Modelo geral</h3>\n<ul>\n<li><strong>Arquitetura client/server</strong>: cliente desktop rico (hist\u00f3rico em <strong>Visual FoxPro</strong>, com linguagem de personaliza\u00e7\u00e3o <strong>Xbase</strong>) + <strong>Microsoft SQL Server</strong> como base de dados.</li>\n<li>O acesso \u00e0 BD faz-se por <strong>ODBC</strong> \u2014 a instala\u00e7\u00e3o cria/configura automaticamente o DSN (o \"exe \u00fanico\" instala a aplica\u00e7\u00e3o, faz o <em>attach</em> da base de dados e cria o ODBC).</li>\n<li>A mesma base de dados serve o <strong>desktop</strong> e o <strong>PHC CS Web</strong> (plataforma web ASP.NET, personaliz\u00e1vel em <strong>C#</strong>), que partilha tabelas e framework.</li>\n<li><strong>Cada empresa = uma base de dados</strong> (instala\u00e7\u00f5es multiempresa usam v\u00e1rias BDs; h\u00e1 ferramentas de consolida\u00e7\u00e3o/arquivo).</li>\n<li>A aplica\u00e7\u00e3o \u00e9 tolerante a quebras de liga\u00e7\u00e3o ao SQL Server (existe monitor de liga\u00e7\u00e3o por inst\u00e2ncia de SQL).</li>\n</ul>\n<h3>2.2 Componentes e conceitos de plataforma</h3>\n<table>\n<thead>\n<tr>\n<th>Componente</th>\n<th>Descri\u00e7\u00e3o</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Execut\u00e1vel \u00fanico</strong></td>\n<td>Instalador que coloca aplica\u00e7\u00e3o + faz attach da BD + cria ODBC</td>\n</tr>\n<tr>\n<td><strong>Supervisor</strong></td>\n<td>Menu de administra\u00e7\u00e3o: Framework PHC, tratamento da base de dados (dicion\u00e1rio de dados, desfragmenta\u00e7\u00e3o), EyePeak Sincroniza\u00e7\u00e3o, monitores</td>\n</tr>\n<tr>\n<td><strong>Menu Sistema</strong></td>\n<td>Par\u00e2metros (gerais e por m\u00f3dulo), configura\u00e7\u00e3o da aplica\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Ecr\u00e3s em mem\u00f3ria</strong></td>\n<td>Par\u00e2metro de performance: ecr\u00e3s principais mant\u00eam-se em mem\u00f3ria ao fechar (reabertura instant\u00e2nea)</td>\n</tr>\n<tr>\n<td><strong>Processamento ass\u00edncrono</strong></td>\n<td>Par\u00e2metro \"Usa processamento ass\u00edncrono\" \u2014 grava\u00e7\u00e3o de documentos em background (o documento fica com flag de \"n\u00e3o processado\" at\u00e9 concluir)</td>\n</tr>\n<tr>\n<td><strong>File Storage</strong></td>\n<td>(202501+) Armazenamento de anexos em diretoria f\u00edsica, na BD ou em ambos; documentos fiscalmente relevantes ficam sempre na BD</td>\n</tr>\n<tr>\n<td><strong>Base de dados de Arquivo</strong></td>\n<td>Passagem de dados hist\u00f3ricos para BD de arquivo (performance)</td>\n</tr>\n<tr>\n<td><strong>Cegid Account</strong></td>\n<td>(202601+) Autentica\u00e7\u00e3o h\u00edbrida com contas Microsoft/Google, 2FA, ativa\u00e7\u00e3o por utilizador</td>\n</tr>\n<tr>\n<td><strong>Barra de status estendida / Painel central / Navegador</strong></td>\n<td>Componentes de UI configur\u00e1veis por par\u00e2metros (gamas superiores)</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Registo de erros de execu\u00e7\u00e3o de c\u00f3digo do utilizador (eventos Xbase) \u2014 ferramenta de diagn\u00f3stico essencial</td>\n</tr>\n<tr>\n<td><strong>Log de C\u00f3digo</strong></td>\n<td>(Web) informa\u00e7\u00e3o de execu\u00e7\u00e3o do c\u00f3digo de utilizador (eventos, regras)</td>\n</tr>\n<tr>\n<td><strong>Log de atividade</strong></td>\n<td>(v30+, Enterprise) auditoria de consultas/altera\u00e7\u00f5es/apagamentos por utilizador</td>\n</tr>\n</tbody>\n</table>\n<h3>2.3 Requisitos de infraestrutura (refer\u00eancia)</h3>\n<ul>\n<li><strong>Servidor:</strong> Windows Server 2012 ou superior (validar sempre o Manual de Instala\u00e7\u00e3o da vers\u00e3o em causa \u2014 dispon\u00edvel na Comunidade PHC/Help Center).</li>\n<li><strong>Base de dados:</strong> Microsoft SQL Server 2012 ou superior (os termos de licenciamento indicam SQL Server 2008R2+ como m\u00ednimo hist\u00f3rico; na gama Corporate \u00e9 t\u00edpico usar <strong>SQL Server Express</strong>).</li>\n<li><strong>Clientes:</strong> Windows 10/11 (ou Windows Server para postos em Terminal Server/RemoteApp \u2014 suportado e comum).</li>\n<li><strong>Rede:</strong> o desktop liga por ODBC/SQL (porta 1433); o PHC CS Web requer IIS/servidor web + liga\u00e7\u00e3o \u00e0 mesma BD.</li>\n<li><strong>Hardware na HCL</strong> (Hardware Compatibility List) para impressoras de documentos, TPA, terminais port\u00e1teis/PDA, etc.</li>\n<li><strong>Licenciamento:</strong> por <strong>utilizador nomeado/concorrente</strong> conforme plano; subscri\u00e7\u00e3o anual no Evolution. A valida\u00e7\u00e3o \u00e9 feita por ficheiro de licen\u00e7as associado ao n\u00ba de cliente.</li>\n</ul>\n<h3>2.4 Seguran\u00e7a e RGPD (nativo da plataforma)</h3>\n<ul>\n<li><strong>Utilizadores e Grupos de utilizadores</strong> (ou <strong>Perfis</strong> \u2014 h\u00e1 um par\u00e2metro \"Defini\u00e7\u00e3o de tipos de acessos\": por Grupos ou por Perfis).</li>\n<li>Acessos por ecr\u00e3/opera\u00e7\u00e3o (consultar, introduzir, alterar, apagar, reimprimir, totalizar, anexar\u2026), <strong>acessos a par\u00e2metros por utilizador</strong>, e controlo de programas execut\u00e1veis a que cada grupo acede.</li>\n<li><strong>RGPD:</strong> aviso legal configur\u00e1vel, registo do tratamento de dados, <strong>processamento de dados pessoais (direito ao esquecimento/anonimiza\u00e7\u00e3o)</strong>, hist\u00f3rico de utilizadores.</li>\n<li><strong>Hist\u00f3rico/Tracking de a\u00e7\u00f5es</strong> e <strong>log de atividade</strong> (Enterprise) para auditoria.</li>\n</ul>\n<hr />\n<h2 id=\"cap-3\">3. Instala\u00e7\u00e3o, infraestrutura e administra\u00e7\u00e3o</h2>\n<blockquote>\n<p>Este cap\u00edtulo segue de perto o programa oficial da <strong>Certifica\u00e7\u00e3o PHC CS Desktop</strong> \u2014 \u00e9 exatamente isto que a PHC considera o n\u00facleo t\u00e9cnico da fun\u00e7\u00e3o.</p>\n</blockquote>\n<h3>3.1 Instala\u00e7\u00e3o passo-a-passo (vis\u00e3o de certifica\u00e7\u00e3o)</h3>\n<ol>\n<li><strong>Preparar o servidor</strong>: Windows Server suportado, verificar HCL, antiv\u00edrus/firewall (exce\u00e7\u00f5es para SQL e para a pasta da aplica\u00e7\u00e3o).</li>\n<li><strong>Instalar o SQL Server</strong> (ou SQL Express na gama Corporate): inst\u00e2ncia, modo de autentica\u00e7\u00e3o misto, protocolos TCP/IP ativos, collation recomendada pela PHC.</li>\n<li><strong>Instalar o PHC</strong> com o execut\u00e1vel \u00fanico: o instalador trata da BD (cria\u00e7\u00e3o/attach), do ODBC e dos atalhos.</li>\n<li><strong>Criar/registar a empresa</strong> (base de dados) e aplicar a <strong>licen\u00e7a</strong> (n\u00ba de cliente + plano/gama + m\u00f3dulos).</li>\n<li><strong>Criar utilizadores e logins</strong> (SQL + aplica\u00e7\u00e3o), configurar grupos/perfis e
