var PERSONA="Você é o Professor Einstein: um Albert Einstein em ilustração 2D — sereno, sábio e levemente bem-humorado — tutor de IA da plataforma profissional de formação PHC Trainer Pro, focada no módulo Gestão do ERP Cegid PHC Evolution/PHC CS Desktop. Missão: ensinar com clareza máxima. Explique todo conteúdo como para um leigo completo: frases curtas, analogias simples do quotidiano (comércio, escritório, logística, vida doméstica — NUNCA jogos), zero jargão sem explicação, aplicando SEMPRE à EMPRESA EM FOCO definida no perfil do aluno (empresa portuguesa realista, com NIF, CAE e necessidades reais). Regras: (1) Seja tecnicamente correto sobre o PHC — baseie-se no contexto fornecido; na dúvida, mande consultar o Help Center oficial e os manuais in-app. (2) Português do BRASIL, tom profissional e encorajador; humor leve, sem palhaçadas. (3) O aluno é um técnico em formação para expert: valorize precisão, boas práticas e conformidade legal/fiscal (AT). (4) Nunca invente funcionalidades, menus ou tabelas do PHC. (5) Termine explicações com '💡 Dica prática:' + uma frase aplicável.";
async function openAI(messages,maxTokens){
  var key=(S.settings.aiKey||"").trim();
  if(!key)throw new Error("Sem chave OpenRouter — abra ⚙️ Definições e cole a sua chave (sk-or-v1-...).");
  var r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
    headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json","HTTP-Referer":location.origin+location.pathname,"X-Title":"PHC Trainer Pro"},
    body:JSON.stringify({model:S.settings.aiModel||"openai/gpt-4o-mini",messages:messages,max_tokens:maxTokens||500,temperature:0.7})});
  if(!r.ok){var t="";try{t=(await r.text()).slice(0,160)}catch(e){}
    if(r.status===401||r.status===403)throw new Error("Chave OpenRouter inválida/revogada (HTTP "+r.status+").");
    if(r.status===402)throw new Error("Sem créditos no OpenRouter (HTTP 402).");
    if(r.status===429)throw new Error("Limite de requisições atingido (HTTP 429) — espere uns segundos.");
    throw new Error("OpenRouter HTTP "+r.status+" "+t)}
  var j=await r.json();
  var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!c)throw new Error("Resposta vazia do modelo.");
  return String(c).trim();
}
function aiCacheGet(k){var e=S.ai[k];return e?e.t:null}
function aiCacheSet(k,t){S.ai[k]={t:t,ts:Date.now()};var ks=Object.keys(S.ai);if(ks.length>600){ks.sort(function(a,b){return S.ai[a].ts-S.ai[b].ts}).slice(0,100).forEach(function(x){delete S.ai[x]})}}
async function explainText(text,ctxTitle){
  var ck=hashStr((S.settings.aiModel||"")+text);

  var out=await openAI(msg,420);

}

function labLesson(lab){

var CARD_SESS={list:[],idx:0,rev:false,mode:""};
function cardSt(i){if(!S.cards[i])S.cards[i]={c:0,due:null};return S.cards[i]}
function dueCardsN(){var t=todayISO(),n=0;for(var i=0;i<DATA.cards.length;i++){var s=S.cards[i];if(s&&s.due&&s.due<=t&&s.c<CARD_TARGET)n++}return n}
function newCardsN(){var n=0;for(var i=0;i<DATA.cards.length;i++)if(!S.cards[i])n++;return n}
function startCards(mode){
  var list=[];
  if(mode==="due"){var t=todayISO();for(var i=0;i<DATA.cards.length;i++){var s=S.cards[i];if(s&&s.due&&s.due<=t&&s.c<CARD_TARGET)list.push(i)}}
  else if(mode==="new"){for(var j=0;j<DATA.cards.length&&list.length<20;j++)if(!S.cards[j])list.push(j)}
  else{var t2=todayISO();for(var k=0;k<DATA.cards.length;k++){var s2=S.cards[k];if(s2&&s2.due&&s2.due<=t2&&s2.c<CARD_TARGET)list.push(k)}
    for(var m=0;m<DATA.cards.length&&list.length<dueCardsN()+10;m++)if(!S.cards[m]&&list.indexOf(m)<0)list.push(m)}
  if(!list.length){MSG.info("Nenhuma carta para agora. Estude 'novas' ou volte amanhã!");return}
  CARD_SESS={list:list,idx:0,rev:false,mode:mode};renderTick();
}
function flipCard(){CARD_SESS.rev=true;renderTick()}
function rateCard(q){
  var gi=CARD_SESS.list[CARD_SESS.idx];
  mut(function(s){var c=cardSt(gi);var t=todayISO();
    if(q===0){c.due=addDays(t,1)}else if(q===1){c.due=addDays(t,2)}else{c.c++;c.due=addDays(t,LADDER[Math.min(c.c-1,LADDER.length-1)])}
    touchStreak()});
  CARD_SESS.idx++;CARD_SESS.rev=false;
  if(CARD_SESS.idx>=CARD_SESS.list.length){MascotBus.set("mood","cheer");say("Baralho do dia dominado! 🃏🚀","cheer",5000)}
  renderTick();
}

        <Button onClick={function(){startCards("new")}}>✨ Estudar 20 novas</Button>
        <Button onClick={function(){startCards("mix")}}>🔀 Sessão mista</Button>
      </Space>
      {CARD_SESS.list.length?<Alert type="success" showIcon style={{marginTop:12}} message="Sessão concluída! Registre no diário o que errou — erros de hoje são cartas de amanhã."/>:null}

/* ============ Aba Testes ============ */
var QUIZ={lv:-1,ans:{}};
function startQuiz(lv){QUIZ={lv:lv,ans:{}};renderTick()}
function answerQ(qi,oi){
  if(QUIZ.ans[qi]!==undefined)return;
  QUIZ.ans[qi]=oi;
  var qz=null;for(var i=0;i<DATA.quizzes.length;i++)if(DATA.quizzes[i].lv===QUIZ.lv)qz=DATA.quizzes[i];
  var done=Object.keys(QUIZ.ans).length;
  if(qz&&done===qz.qs.length){
    var ok=0;for(var k in QUIZ.ans)if(QUIZ.ans[k]===qz.qs[k].a)ok++;
    var pct=Math.round(ok/qz.qs.length*100);
    mut(function(s){var prev=s.quiz[QUIZ.lv]||{best:0,passed:false,tries:0};
      s.quiz[QUIZ.lv]={best:Math.max(prev.best,pct),passed:prev.passed||pct>=80,tries:(prev.tries||0)+1};touchStreak()});
    if(pct>=80){MascotBus.set("mood","cheer");say("Aprovado! Nível concluído — avance com confiança.","cheer",7000)}
    else say("Abaixo de 80%: reveja os conceitos e refaça o teste.",7000);
  }
  renderTick();
}

function buildChapters(){
  var parts=GUIA_HTML.split(/(?=<h2)/);

    chs.push({title:title||("Parte "+i),html:p});

function importar(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!o.labs)throw 0;
    o.settings=Object.assign(defaultSettings(),o.settings||{});if(!o.ai)o.ai={};if(!o.ui)o.ui={lastLab:null,tab:"hoje"};if(!o.company)o.company=defaultCompany();if(o.plan===undefined)o.plan=null;

async function gerarCursoIA(){
  WIZ.err=null;WIZ.gerando=true;renderTick();MascotBus.set("mood","think");
  try{
    var seg=segmentById(WIZ.segId);
    var ids=DATA.labs.map(function(l){return l.id+" ("+l.t+")"}).join("; ");
    var usr="Crie um plano de curso personalizado para este aluno.\nPERFIL: interesses='"+(WIZ.interesses||"(não indicados)")+"'; objetivos="+JSON.stringify(WIZ.objetivos)+"; tempo/dia="+WIZ.minutos+" min; empresa-treino="+WIZ.nome+" (segmento: "+seg.nome+", "+seg.cidade+"); vende "+(WIZ.tipo==="ambos"?"produtos e serviços":WIZ.tipo)+"; dimensão "+WIZ.tam+".\nNECESSIDADES DO NEGÓCIO: "+seg.empresa.necessidades.join("; ")+".\nMISSÕES DISPONÍVEIS: "+ids+"\nResponda APENAS com JSON válido, sem texto à volta: {\"nota\":\"frase de foco do curso, máx 40 palavras\",\"destaques\":[\"L##\",... até 8 missões prioritárias para este negócio],\"ordem\":[\"L##\",... de 12 a 20 missões em sequência pedagógica]}";
    var out=await openAI([{role:"system",content:personaSys()},{role:"user",content:usr}],900);
    var jm=out.match(/\{[\s\S]*\}/);
    if(!jm)throw new Error("A IA não devolveu JSON — use o plano padrão.");
    var pl=JSON.parse(jm[0]);
    var valid={};DATA.labs.forEach(function(l){valid[l.id]=1});
    pl.destaques=(pl.destaques||[]).filter(function(x){return valid[x]}).slice(0,10);
    pl.ordem=(pl.ordem||[]).filter(function(x){return valid[x]}).slice(0,30);
    if(!pl.destaques.length)throw new Error("Destaques inválidos — use o plano padrão.");
    if(!pl.ordem.length)pl.ordem=pl.destaques;
    pl.nota=String(pl.nota||seg.plano.nota);pl.porIA=true;
    WIZ.plano=pl;
  }catch(e){WIZ.err=String(e.message||e)}

var DICT={q:"",tag:"Todos",open:{},ai:{},loading:null};
function DicionarioTab(){
  var _f=useStore();
  var tags=["Todos"];GLOSSARIO.forEach(function(g){if(tags.indexOf(g.tag)<0)tags.push(g.tag)});
  var q=DICT.q.toLowerCase();
  var list=GLOSSARIO.filter(function(g){
    var okT=DICT.tag==="Todos"||g.tag===DICT.tag;
    var okQ=!q||g.t.toLowerCase().indexOf(q)>=0||g.d.toLowerCase().indexOf(q)>=0;
    return okT&&okQ});
  async function prof(term){
    var g=null;GLOSSARIO.forEach(function(x){if(x.t===term)g=x});
    DICT.loading=term;renderTick();MascotBus.set("mood","think");
    try{
      var out=await explainText("TERMO: "+g.t+" — "+g.d+(g.x?" DETALHE: "+g.x:""),"Dicionário: "+g.t);
      DICT.ai[term]=out;
    }catch(e){DICT.ai[term]="⚠ "+String(e.message||e)}
    DICT.loading=null;MascotBus.set("mood","idle");renderTick();
    if(DICT.ai[term]&&S.settings.tts&&DICT.ai[term].indexOf("⚠")!==0)speak(DICT.ai[term]);
  }
  return (<div>
    <Card size="small" title={"📖 Dicionário PHC — "+GLOSSARIO.length+" termos com explicação clara"}>
      <Space wrap style={{marginBottom:10}}>
        <Input style={{width:280}} allowClear placeholder="Procurar (ex.: ATCUD, SAF-T, PCMP…)" value={DICT.q} onChange={function(e){DICT.q=e.target.value;renderTick()}}/>
        <Select style={{width:170}} value={DICT.tag} onChange={function(v){DICT.tag=v;renderTick()}} options={tags.map(function(t){return {value:t,label:t}})}/>
        <Tag>{list.length} resultados</Tag>
      </Space>
      {list.map(function(g){return (
        <Card key={g.t} size="small" className="dictCard" title={<span><b>{g.t}</b> <Tag color="blue">{g.tag}</Tag></span>}
          extra={<Space>
            <Button size="small" onClick={function(){speak(g.t+". "+g.d+(g.x?" "+g.x:""))}}>🔊</Button>
            <Button size="small" type="primary" ghost loading={DICT.loading===g.t} onClick={function(){prof(g.t)}}>🧠 Professor</Button>
          </Space>}>
          <p>{g.d}</p>
          {g.x?<div><Button size="small" type="link" style={{padding:0}} onClick={function(){DICT.open[g.t]=!DICT.open[g.t];renderTick()}}>{DICT.open[g.t]?"▲ ocultar detalhe":"▼ ver detalhe / na prática"}</Button>
            {DICT.open[g.t]?<Alert style={{marginTop:6}} type="info" message={g.x}/>:null}</div>:null}
          {DICT.ai[g.t]?<Card size="small" className="theoryCard" style={{marginTop:8}} title="🧠 Professor Einstein"><div className="expText">{DICT.ai[g.t]}</div></Card>:null}
        </Card>)})}
      {!list.length?<Empty description="Nada encontrado — tente outra palavra (ex.: série, guia, aging)."/>:null}
    </Card>
  </div>);
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return{err:e}}
  componentDidCatch(e,i){try{console.error(e,i)}catch(x){}}
  render(){if(this.state.err){return (
    <div style={{padding:30}}>
      <Card title="💥 Kaboom! (Erro na aplicação)"><p className="mut">{String(this.state.err&&this.state.err.message||this.state.err)}</p>
      <p>Até sistemas falham. Recarregue a página; se persistir, exporte o progresso (se conseguir) e reporte no repositório.</p>
      <Button type="primary" onClick={function(){location.reload()}}>🔄 Recarregar</Button></Card>
    </div>)}
  return this.props.children}
}
