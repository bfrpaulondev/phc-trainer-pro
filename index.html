 acessos.</li>\n<li><strong>Configurar par\u00e2metros</strong> gerais e do m\u00f3dulo (ver cap\u00edtulo 5).</li>\n<li><strong>Backups</strong>: plano de backups do SQL (full + logs), testar restauro; usar tamb\u00e9m as rotinas de \"Backup de Base de Dados\" da aplica\u00e7\u00e3o.</li>\n<li><strong>Atualiza\u00e7\u00f5es</strong>: procedimento de upgrade de vers\u00e3o (sempre com backup pr\u00e9vio, em hor\u00e1rio sem utilizadores; validar personaliza\u00e7\u00f5es ap\u00f3s upgrade).</li>\n<li><strong>Postos de trabalho</strong>: instalar o cliente, apontar ao ODBC/servidor; em Terminal Server validar perfis Windows.</li>\n</ol>\n<h3>3.2 Manuten\u00e7\u00e3o da base de dados</h3>\n<ul>\n<li><strong>Detach/Attach</strong> de bases de dados (migra\u00e7\u00f5es, clones de teste).</li>\n<li><strong>Desfragmentar as Tabelas Principais</strong> (utilit\u00e1rio documentado no Help Center) + manuten\u00e7\u00e3o de \u00edndices do SQL (rebuild/reorganize, estat\u00edsticas).</li>\n<li><strong>Base de dados de arquivo</strong> para hist\u00f3ricos pesados.</li>\n<li><strong>\u00cdndices de utilizador</strong> (Framework PHC) \u2014 incluindo <em>INCLUDED COLUMNS</em> \u2014 para acelerar consultas personalizadas sem tocar no core.</li>\n<li><strong>Monitor de liga\u00e7\u00e3o</strong> ao SQL por inst\u00e2ncia (diagn\u00f3stico de quebras de rede).</li>\n<li><strong>Explorador de dados</strong> e <strong>Simulador de SQL</strong> (permite executar consultas \u00e0 BD a partir da aplica\u00e7\u00e3o, com vari\u00e1veis como <code>#stamp#</code>).</li>\n</ul>\n<h3>3.3 Rotina de sa\u00fade de uma instala\u00e7\u00e3o (checklist do t\u00e9cnico)</h3>\n<ul>\n<li>[ ] Vers\u00e3o do software e do PHC On atualizadas (conformidade AT)</li>\n<li>[ ] Backups autom\u00e1ticos + teste de restauro documentado</li>\n<li>[ ] Utilizadores nomeados, acessos m\u00ednimos necess\u00e1rios, passwords/2FA</li>\n<li>[ ] Par\u00e2metros de fatura\u00e7\u00e3o/s\u00e9ries revistos antes de cada viragem de ano (c\u00f3digos de valida\u00e7\u00e3o AT, ATCUD)</li>\n<li>[ ] Manuten\u00e7\u00e3o de \u00edndices/desfragmenta\u00e7\u00e3o agendada</li>\n<li>[ ] Espa\u00e7o em disco da BD vs. plano contratado (10 GB nos planos Standard/Plus)</li>\n<li>[ ] Personaliza\u00e7\u00f5es documentadas (c\u00f3digo Xbase/C#, regras, campos de utilizador) para sobreviverem a upgrades</li>\n<li>[ ] Liga\u00e7\u00f5es externas testadas: webservice AT, e-mail SMTP, EyePeak, Cegid Docs, open banking</li>\n</ul>\n<hr />\n<h2 id=\"cap-4\">4. M\u00f3dulo Gest\u00e3o \u2014 mapa funcional completo</h2>\n<h3>4.1 Ficheiros (dados mestres)</h3>\n<p><strong>Clientes (tabela CL + CL2 \"Outros Dados\")</strong>\n- N\u00ba de contribuinte com pa\u00eds associado; servi\u00e7o <strong>Ignios</strong> (Advanced+) preenche automaticamente nome/morada a partir do NIF.\n- <strong>Sede (0) e filiais/estabelecimentos (1\u2013999)</strong> \u2014 no\u00e7\u00e3o de estabelecimento vs. sede.\n- Campos: abreviatura, morada, localidade, c\u00f3digo postal (preenchimento autom\u00e1tico configur\u00e1vel), pa\u00eds, prov\u00edncia (ES), telefone/fax/e-mail/WWW/telem\u00f3vel (com envio de SMS via m\u00f3dulo SMS), contribuinte do representante, <strong>idioma</strong> (descri\u00e7\u00f5es de artigos em documentos), <strong>zona</strong> (campo de tabela do utilizador), tipo de cliente, classifica\u00e7\u00e3o de vendas, segmento, ref\u00aa interna, centro anal\u00edtico (XL), condi\u00e7\u00f5es de pagamento, forma de pagamento, descontos, tabela de pre\u00e7os, vendedor, limites de cr\u00e9dito\u2026\n- <strong>Inativos</strong>: deixam de aparecer em op\u00e7\u00f5es/documentos novos, mas mant\u00eam-se em an\u00e1lises e permitem faturar dossiers antigos.\n- Regras de integridade de documentos certificados: com documentos certificados emitidos, h\u00e1 campos que ficam bloqueados a altera\u00e7\u00f5es (ex.: n\u00e3o alterar NIF de cliente com documentos certificados; regras nome/morada/NIF).\n- Par\u00e2metro \"Quando altera dados do cliente, n\u00e3o atualiza tabelas relacionadas\" controla a propaga\u00e7\u00e3o de altera\u00e7\u00f5es a C/C, Documentos e Recibos.\n- <strong>Moradas de Carga e Descarga</strong> (tabela pr\u00f3pria) alimentam os campos \"Local de carga/descarga\" dos documentos de transporte (ShipFrom/ShipTo no SAF-T).</p>\n<p><strong>Fornecedores (FI)</strong> \u2014 estrutura an\u00e1loga \u00e0 de clientes; conta corrente de fornecedores, adiantamentos, aprova\u00e7\u00e3o de pagamentos, compras com/sem IVA, autofatura\u00e7\u00e3o.</p>\n<p><strong>Stocks e Servi\u00e7os (artigos)</strong> \u2014 manual pr\u00f3prio do m\u00f3dulo <strong>PHC CS Stocks desktop</strong>:\n- Ficheiro de refer\u00eancias com designa\u00e7\u00e3o (multi-idioma), fam\u00edlia, marca, unidade e <strong>unidade alternativa com factor de convers\u00e3o</strong> (e invers\u00e3o do factor), c\u00f3digo de barras/EAN, imagem.\n- <strong>Refer\u00eancias alternativas</strong> (mesmo artigo com v\u00e1rias refs de cliente/fornecedor), designa\u00e7\u00e3o do artigo por cliente/fornecedor (impress\u00e3o no idioma definido).\n- <strong>Compostos (Kits)</strong> \u2014 produtos compostos por componentes.\n- <strong>Grelha de cores e tamanhos</strong> (vestu\u00e1rio/cal\u00e7ado).\n- <strong>Lotes</strong> (rastreabilidade, validades) e <strong>n\u00fameros de s\u00e9rie</strong> (com o m\u00f3dulo Equipamentos).\n- Pre\u00e7os: pre\u00e7o de venda por tabela (com validades), pre\u00e7o de custo, <strong>PCMP \u2014 Pre\u00e7o de Custo M\u00e9dio Ponderado</strong> (m\u00e9todo de custeio usado no c\u00e1lculo do valor de stock), margens, contribui\u00e7\u00e3o.\n- Stocks: stock atual por armaz\u00e9m, reservado para cliente, encomendado a fornecedor, quantidade esperada, stock cativo e pr\u00e9-cativo, stock m\u00ednimo/m\u00e1ximo, ponto de encomenda, ruturas.\n- <strong>Ecovalor</strong> (m\u00f3dulo adicional) para taxas ecol\u00f3gicas.</p>\n<h3>4.2 Vendas e fatura\u00e7\u00e3o</h3>\n<ul>\n<li><strong>Documentos de Fatura\u00e7\u00e3o (tabela FT)</strong> configur\u00e1veis por <strong>s\u00e9rie</strong>: tipos de documento <strong>1, 2, 3</strong> (Fatura, Fatura Simplificada, Fatura-Recibo, Nota de D\u00e9bito, Nota de Cr\u00e9dito \u2014 mapeados para SAF-T como FT/FS/FR/ND/NC), <strong>tipo 4 = documento de transporte (Guia de Remessa)</strong> e <strong>tipo 5 = Outro (Proforma)</strong>.</li>\n<li>Cada s\u00e9rie define: o que movimenta (<strong>conta corrente, stocks, tesouraria</strong>), numera\u00e7\u00e3o, tipo para SAF-T, motivo de isen\u00e7\u00e3o nas linhas, valida\u00e7\u00e3o de locais de carga/descarga, envio de SMS ao motorista com o c\u00f3digo da AT, comunica\u00e7\u00e3o por webservice vs. ficheiro, etc.</li>\n<li>Emiss\u00e3o, altera\u00e7\u00e3o, anula\u00e7\u00e3o (<strong>documento anulado + motivo de anula\u00e7\u00e3o obrigat\u00f3rio</strong>), reimpress\u00e3o controlada por acessos, consulta e totais por m\u00faltiplos crit\u00e9rios.</li>\n<li><strong>Atualiza\u00e7\u00e3o autom\u00e1tica</strong> ao emitir: stocks (baixa de artigos), conta corrente (saldos, idades), ficha do cliente (fatura\u00e7\u00e3o acumulada).</li>\n<li><strong>Emiss\u00e3o autom\u00e1tica de fatura\u00e7\u00e3o</strong>: faturar em massa por c\u00f3pia de outros documentos ou de <strong>dossiers internos</strong> (guias, encomendas, propostas, folhas de obra) com ecr\u00e3 de prepara\u00e7\u00e3o/sele\u00e7\u00e3o.</li>\n<li><strong>Vendas a dinheiro</strong>, faturas-recibo, <strong>recibos de adiantamento</strong> e sua regulariza\u00e7\u00e3o (gera NC autom\u00e1tica com motivo de retifica\u00e7\u00e3o \"Retifica\u00e7\u00e3o de Fatura de Adiantamento\").</li>\n<li><strong>Reten\u00e7\u00e3o de IRS na fonte</strong> em documentos (taxa + valor de reten\u00e7\u00e3o; vis\u00edvel no mailing de C/C).</li>\n<li>Campos fiscais/operacionais do documento: classifica\u00e7\u00e3o de vendas, local de carga/descarga, idioma, data/hora de carga, <strong>data efetiva de entrega</strong> (obrigat\u00f3ria por lei; comunicada no SAF-T), matr\u00edcula da viatura (Frota ou tabela de <strong>Viaturas de Expedi\u00e7\u00e3o</strong>), motorista, linha final (texto livre), segmento, expedi\u00e7\u00e3o, ref\u00aa interna, centro anal\u00edtico, opera\u00e7\u00e3o triangular UE, c\u00f3digo EAN (Documentos Eletr\u00f3nicos), C\u00f3d. Ident. AT (documentos de transporte), <strong>ATCUD + QR Code</strong> em layouts.</li>\n<li><strong>Multibanco</strong>: disponibiliza\u00e7\u00e3o de refer\u00eancias multibanco para cobran\u00e7a.</li>\n<li><strong>e-TaxFree</strong> (vendas a turistas), <strong>Pagamentos via Unicre/PayPal</strong> (com PHC CS Web), <strong>fatura\u00e7\u00e3o eletr\u00f3nica</strong> (Documentos Eletr\u00f3nicos, CIUS-PT, SaphetyDoc por webservice).</li>\n</ul>\n<h3>4.3 Dossiers Internos (DI \u2014 tabela BO)</h3>\n<p>Conceito central do PHC: <strong>documentos parametriz\u00e1veis pelo utilizador para uso interno</strong>, que alimentam o circuito comercial:\n- <strong>Or\u00e7amentos/Propostas</strong>, <strong>Encomendas de Cliente</strong>, <strong>Encomendas a Fornecedor</strong>, <strong>Folhas de Obra</strong>, <strong>Consigna\u00e7\u00f5es</strong>, e dossiers \u00e0 medida (o utilizador cria tipos de DI).\n- <strong>Circuito (convers\u00f5es)</strong>: Or\u00e7amento \u2192 Encomenda \u2192 Guia \u2192 Fatura; Encomenda a Fornecedor \u2192 \"Comprar a Encomenda a Fornecedor\" (gera compra); \"Faturar a Encomenda de Cliente\"; c\u00f3pias entre DI, Fatura\u00e7\u00e3o e Compras com op\u00e7\u00f5es de c\u00f3pia configur\u00e1veis.\n- <strong>Dossiers especiais</strong> (conte\u00fado da certifica\u00e7\u00e3o Advanced): <strong>Dossier de Stock Inicial</strong>, <strong>Dossier de Transfer\u00eancia de Armaz\u00e9m</strong>, <strong>Dossier de Pre\u00e7os (Cliente/Fornecedor)</strong>, <strong>Dossier de Aven\u00e7as</strong> (fatura\u00e7\u00e3o recorrente), <strong>Dossier de Composi\u00e7\u00e3o e de Produ\u00e7\u00e3o</strong>.\n- <strong>Sistema de Aprova\u00e7\u00e3o de Dossiers</strong> (gama Enterprise) e <strong>Workflow Operacional</strong> (Advanced+) para circuitos de aprova\u00e7\u00e3o.\n- An\u00e1lises de DI (mapas de acompanhamento, convers\u00e3o, pendentes).</p>\n<h3>4.4 Compras</h3>\n<ul>\n<li>Documentos de compras (faturas de fornecedor, guias de entrada, notas de d\u00e9bito/cr\u00e9dito de compra), com gest\u00e3o de IVA, reten\u00e7\u00f5es e custos acess\u00f3rios.</li>\n<li><strong>Comprar a partir de Encomenda a Fornecedor</strong>; rece\u00e7\u00e3o por guia e fatura\u00e7\u00e3o posterior.</li>\n<li><strong>Gest\u00e3o de aprova\u00e7\u00e3o para pagamentos</strong> a fornecedores; <strong>adiantamentos a fornecedores</strong>.</li>\n<li><strong>Faturas de fornecedor eletr\u00f3nicas</strong>: com Cegid Docs, as faturas CIUS-PT s\u00e3o anexadas em PDF e <strong>pr\u00e9-lan\u00e7adas</strong> automaticamente.</li>\n<li><strong>Espanha</strong>: envio de documentos de Compras para o <strong>SII</strong> (fun\u00e7\u00f5es internas na framework/alertas).</li>\n</ul>\n<h3>4.5 Stocks e armaz\u00e9ns</h3>\n<ul>\n<li><strong>Armaz\u00e9ns</strong> m\u00faltiplos; <strong>C\u00f3digos de Movimentos de Stocks</strong> (tipos de movimento configur\u00e1veis).</li>\n<li>Movimentos autom\u00e1ticos por documentos (fatura\u00e7\u00e3o/compras/guias) e manuais (regulariza\u00e7\u00f5es, transfer\u00eancias entre armaz\u00e9ns via dossier).</li>\n<li><strong>Invent\u00e1rio f\u00edsico (contagens)</strong>: contagens por armaz\u00e9m/fam\u00edlia, lan\u00e7amento autom\u00e1tico de <strong>acertos (quebras/sobras)</strong> no ficheiro de movimentos; <strong>comunica\u00e7\u00e3o do invent\u00e1rio \u00e0 AT</strong> (ficheiro SAF-T/CSV/XML conforme fatura\u00e7\u00e3o do ano anterior \u2014 artigo oficial \"Comunica\u00e7\u00e3o de invent\u00e1rio \u00e0 AT: onde, quando e como quiser\").</li>\n<li>An\u00e1lises de stock: produtos com maior lucro, <strong>rankings de vendas</strong>, contributo nos custos, acima do stock m\u00e1ximo, a encomendar, em rutura, entradas/sa\u00eddas mensais com compara\u00e7\u00e3o anual, valor de stock.</li>\n<li><strong>Lotes</strong> e <strong>n\u00fameros de s\u00e9rie</strong>; <strong>stock cativo/pr\u00e9-cativo</strong>; liga\u00e7\u00e3o a <strong>terminais port\u00e1teis (PDA)</strong> para contagens/movimentos.</li>\n</ul>\n<h3>4.6 Conta corrente, cobran\u00e7as e pagamentos</h3>\n<ul>\n<li><strong>C\u00f3digos de Conta Corrente</strong> (tabela de tipos de movimento de C/C), movimentos por documento, saldos e <strong>saldos por idades</strong> (aging).</li>\n<li><strong>Recibos de clientes (RE)</strong> \u2014 normais ou de adiantamento; <strong>Pagamentos a fornecedores</strong>; <strong>liquida\u00e7\u00e3o/regulariza\u00e7\u00e3o</strong> de documentos por recibos/pagamentos (total ou parcial).</li>\n<li><strong>Controlo de cobran\u00e7as</strong>: monitor de controlo de d\u00edvidas de clientes, <strong>mailing de C/C</strong> (avisos por documento), gest\u00e3o de <strong>cheques em carteira</strong>, <strong>letras/t\u00edtulos</strong>.</li>\n<li><strong>Recibos incobr\u00e1veis</strong> (tratamento fiscal).</li>\n<li><strong>Cobran\u00e7as via banco</strong>: ficheiros <strong>SEPA</strong> (d\u00e9bitos diretos), transfer\u00eancias em lote (ficheiro SEPA de pagamentos), <strong>WebBanking</strong> (hist\u00f3rico: Millennium BCP) e <strong>open banking</strong> no Evolution (reconcilia\u00e7\u00e3o e previs\u00f5es aceleradas).</li>\n<li><strong>Refer\u00eancias Multibanco</strong> para receber mais r\u00e1pido.</li>\n</ul>\n<h3>4.7 Tesouraria e bancos</h3>\n<ul>\n<li><strong>Contas de Tesouraria</strong> (caixas e bancos), <strong>C\u00f3digos de Tesouraria</strong> (tipos de movimento), movimentos constantes de tesouraria.</li>\n<li><strong>Extratos banc\u00e1rios</strong> e reconcilia\u00e7\u00e3o; <strong>transfer\u00eancias banc\u00e1rias</strong>; <strong>gest\u00e3o de t\u00edtulos de tesouraria</strong> (letras, cheques).</li>\n<li><strong>Tesouraria real, previsional e or\u00e7amental</strong> \u2014 previs\u00f5es com base em documentos pendentes/vencimentos; or\u00e7amentos de tesouraria.</li>\n<li>No Evolution: <strong>open banking</strong> nativo para importar movimentos e acelerar reconcilia\u00e7\u00f5es.</li>\n</ul>\n<h3>4.8 Pol\u00edtica comercial</h3>\n<ul>\n<li><strong>Tabelas de pre\u00e7os</strong> m\u00faltiplas <strong>com validades</strong> (saber sempre o pre\u00e7o atual); pre\u00e7os por cliente/fornecedor (dossier de pre\u00e7os).</li>\n<li><strong>Tipos de desconto</strong> e descontos autom\u00e1ticos (por tipo de cliente, tipo de artigo, quantidade, valor \u2014 configura\u00e7\u00e3o dispon\u00edvel em web desde 202501); descontos em cascata (Desc.1, Desc.2\u2026).</li>\n<li><strong>Promo\u00e7\u00f5es e campanhas</strong> (com datas de validade; na gama Advanced/Enterprise h\u00e1 op\u00e7\u00f5es extra de promo\u00e7\u00e3o no m\u00f3dulo Gest\u00e3o desktop), <strong>rappel</strong> de clientes e fornecedores (descontos de fim de per\u00edodo por volumes).</li>\n<li><strong>Comiss\u00f5es</strong>: por vendedor, por tipo de cliente, por fam\u00edlias de produtos, etc.; mapas de comiss\u00f5es.</li>\n<li><strong>Vendedores</strong> e zonas; classifica\u00e7\u00e3o de clientes para an\u00e1lises de vendas.</li>\n</ul>\n<h3>4.9 An\u00e1lises, mapas e dashboards</h3>\n<ul>\n<li><strong>Mapas definidos</strong> (relat\u00f3rios standard configur\u00e1veis) e <strong>impress\u00e3o definida pelo utilizador</strong> (Advanced+): layouts personaliz\u00e1veis de documentos e listagens; <strong>templates</strong> de documentos.</li>\n<li><strong>An\u00e1lises de utilizador</strong> (consultas SQL apresentadas em grelha, com filtros de utilizador) e, na gama Advanced, <strong>An\u00e1lises Multidimensionais</strong> criadas a partir de an\u00e1lises de utilizador (cubos OLAP-like para drill-down).</li>\n<li><strong>Snapshots</strong> ( Advanced+): \"fotografias\" de dados com instru\u00e7\u00f5es T-SQL e vari\u00e1veis (ex.: <code>#stamp#</code>), agrup\u00e1veis com cores; \u00fateis para monitores e pain\u00e9is.</li>\n<li><strong>Pain\u00e9is de informa\u00e7\u00e3o / Painel central / Dashboards</strong>: vis\u00e3o 360\u00ba num s\u00f3 ecr\u00e3 (ex.: template de Dashboard para o m\u00f3dulo Gest\u00e3o, se adquirir o <strong>PHC Dashboard</strong>); monitores (ex.: controlo de d\u00edvidas).</li>\n<li><strong>Rankings</strong> e an\u00e1lises de fatura\u00e7\u00e3o por segmento/zona/vendedor/fam\u00edlia.</li>\n<li><strong>Cegid Pulse</strong> (IA, plano Plus+): perguntas em linguagem natural sobre vendas/tesouraria/stocks, <strong>assistentes de neg\u00f3cio</strong> (o primeiro \u00e9 o comercial) e <strong>Smart Tools</strong> que os parceiros podem configurar e monetizar.</li>\n<li>Exporta\u00e7\u00e3o de listagens para <strong>Excel/PDF</strong>, c\u00f3pia de dados a partir de grelhas, \"Altera\u00e7\u00f5es de seguida em Excel\", <strong>Importar Excel para linhas</strong> de documentos.</li>\n</ul>\n<h3>4.10 Integra\u00e7\u00e3o Gest\u00e3o \u2192 Contabilidade</h3>\n<p>(T\u00f3pico obrigat\u00f3rio da certifica\u00e7\u00e3o; o t\u00e9cnico de Gest\u00e3o tem de o dominar.)\n- <strong>Documentos pr\u00e9-definidos</strong> (na Contabilidade e na Gest\u00e3o): regras de contabiliza\u00e7\u00e3o autom\u00e1tica por tipo de documento.\n- <strong>Integra\u00e7\u00f5es da Gest\u00e3o na Contabilidade</strong>: configura\u00e7\u00e3o de contas (clientes, fornecedores, IVA, contrapartidas), integra\u00e7\u00e3o de fatura\u00e7\u00e3o, compras, recibos e pagamentos (com informa\u00e7\u00e3o do documento original no descritivo \u2014 Advanced+).\n- <strong>Apuramento do IVA</strong> a partir dos documentos; <strong>Declara\u00e7\u00e3o Peri\u00f3dica de IVA</strong>; <strong>CEVMC</strong> (custo das mercadorias vendidas e consumidas); apuramento de resultados.\n- <strong>Mapas de Gest\u00e3o</strong> (importa\u00e7\u00e3o/emiss\u00e3o) e <strong>PHC XL</strong> (centros anal\u00edticos, grandes volumes).\n- <strong>Taxonomia</strong> (tabela de taxonomia SNC para mapping contabil\u00edstico).</p>\n<hr />\n<h2 id=\"cap-5\">5. Configura\u00e7\u00e3o do m\u00f3dulo Gest\u00e3o (o dia-a-dia do t\u00e9cnico)</h2>\n<h3>5.1 Onde se configura o qu\u00ea</h3>\n<table>\n<thead>\n<tr>\n<th>O qu\u00ea</th>\n<th>Onde</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Par\u00e2metros gerais e por m\u00f3dulo</td>\n<td>Menu <strong>Sistema \u2192 Par\u00e2metros</strong> (gerais, fatura\u00e7\u00e3o, stocks, tesouraria\u2026). Acesso protegido e configur\u00e1vel <strong>por utilizador</strong></td>\n</tr>\n<tr>\n<td>S\u00e9ries e tipos de documento</td>\n<td><strong>Configura\u00e7\u00e3o de Documentos de Fatura\u00e7\u00e3o</strong> (s\u00e9ries: tipo 1\u20135, mapping SAF-T, numera\u00e7\u00e3o, o que movimenta, op\u00e7\u00f5es AT)</td>\n</tr>\n<tr>\n<td>Dossiers internos</td>\n<td>Configura\u00e7\u00e3o de tipos de DI (nome, s\u00e9ries, o que movimenta, convers\u00f5es permitidas)</td>\n</tr>\n<tr>\n<td>Tabelas base</td>\n<td>IVA/taxas, motivos de isen\u00e7\u00e3o (M01\u2013M99), condi\u00e7\u00f5es de pagamento, formas de pagamento, bancos/contas de tesouraria, c\u00f3digos de C/C, c\u00f3digos de tesouraria, c\u00f3digos de movimentos de stock, zonas, pa\u00edses, moedas/c\u00e2mbios, idiomas, viaturas de expedi\u00e7\u00e3o, moradas de carga/descarga</td>\n</tr>\n<tr>\n<td>Ficheiros</td>\n<td>Clientes, fornecedores, artigos (com fam\u00edlias/marcas), vendedores, tabelas de pre\u00e7os, descontos, armaz\u00e9ns, lotes</td>\n</tr>\n<tr>\n<td>Framework (personaliza\u00e7\u00e3o)</td>\n<td>Menu <strong>Supervisor \u2192 Framework PHC</strong>: campos de utilizador, regras, valores por defeito, teclas de utilizador, fun\u00e7\u00f5es de utilizador, instru\u00e7\u00f5es internas, alertas de utilizador, \u00edndices de utilizador, tabelas de utilizador, ecr\u00e3s personalizados, p\u00e1ginas/objetos (Enterprise), consultas, snapshots, monitores, filtros</td>\n</tr>\n<tr>\n<td>Base de dados</td>\n<td><strong>Supervisor \u2192 Tratamento da base de dados</strong>: Dicion\u00e1rio de Dados, desfragmenta\u00e7\u00e3o, arquivo</td>\n</tr>\n<tr>\n<td>Impress\u00e3o</td>\n<td>Editor de mapas/templates, \"Impress\u00e3o Definida pelo Utilizador\" (Advanced+), defini\u00e7\u00f5es de assinatura</td>\n</tr>\n</tbody>\n</table>\n<h3>5.2 Par\u00e2metros essenciais que tem de conhecer a frio</h3>\n<p>Exemplos de par\u00e2metros da plataforma/m\u00f3dulo que aparecem em quase todos os projetos (a lista exata varia por vers\u00e3o/gama \u2014 validar no ecr\u00e3 de Par\u00e2metros e no manual \"Par\u00e2metros\"):</p>\n<p><strong>Gerais/plataforma:</strong>\n- Defini\u00e7\u00e3o de tipos de acessos (por <strong>Grupos</strong> ou por <strong>Perfis</strong>)\n- Usa ecr\u00e3s em mem\u00f3ria (performance)\n- Mostrar \u00faltimo registo ao arrancar ecr\u00e3 (desligar em BDs grandes = ecr\u00e3s mais r\u00e1pidos)\n- Utiliza campos do utilizador? / ecr\u00e3s do utilizador? / fun\u00e7\u00f5es do utilizador? / filtros de utilizador? / p\u00e1ginas do utilizador? / navegador? / painel central? \u2014 <strong>ativam as ferramentas da Framework</strong> (algumas s\u00f3 gama Executive/Enterprise)\n- Utiliza multi-l\u00edngua? (idiomas de descri\u00e7\u00f5es)\n- Usa processamento ass\u00edncrono (grava\u00e7\u00e3o de documentos)\n- Primeiro dia da semana / n\u00ba da semana\n- Diret\u00f3rio por defeito para imagens; log\u00f3tipo (na BD ou caminho); imagem de fundo\n- Intervalo de refrescamento de alertas\n- Barra de status estendida; pain\u00e9is no menu; teclas do utilizador em rodap\u00e9</p>\n<p><strong>Fatura\u00e7\u00e3o (Par\u00e2metros de Fatura\u00e7\u00e3o):</strong>\n- Percentagem de reten\u00e7\u00e3o de IRS\n- M\u00e9todo de envio de faturas emitidas (<strong>Webservice</strong> vs. ficheiro) \u2192 influencia motivos de isen\u00e7\u00e3o dispon\u00edveis (s\u00f3 M01\u2013M99 aceites pelo webservice)\n- M\u00e9todo de envio de <strong>documentos de transporte</strong> (webservice AT vs. <strong>SAF-T (PT) resumido</strong>)\n- Preenche e valida Local de Carga/Descarga\n- Utiliza data efetiva de entrega nas linhas\n- Utiliza motivo de isen\u00e7\u00e3o nas linhas\n- Comportamento de altera\u00e7\u00f5es de dados de cliente em tabelas relacionadas\n- Envio de SMS (m\u00f3dulo SMS) e SMS ao motorista com c\u00f3digo da AT</p>\n<p><strong>Stocks/Compras/Tesouraria:</strong> par\u00e2metros de custeio (PCMP), stocks negativos, lotes/s\u00e9ries, armaz\u00e9m por defeito, c\u00f3digos de movimento; aprova\u00e7\u00e3o de pagamentos; contas e bancos por defeito; refer\u00eancias multibanco; SEPA.</p>\n<h3>5.3 Configura\u00e7\u00e3o de uma s\u00e9rie de documentos (receita)</h3>\n<ol>\n<li>Criar a <strong>s\u00e9rie</strong> (c\u00f3digo, descri\u00e7\u00e3o, tipo de documento 1\u20135, documento SAF-T correspondente: FT/FS/FR/NC/ND/GT\u2026).</li>\n<li>Definir <strong>o que movimenta</strong>: stocks? conta corrente? tesouraria?</li>\n<li><strong>Numera\u00e7\u00e3o</strong>: sequ\u00eancia por s\u00e9rie/ano; regras de n\u00ba de documento.</li>\n<li>Op\u00e7\u00f5es fiscais: motivo de isen\u00e7\u00e3o (cabe\u00e7alho ou linhas), valida\u00e7\u00e3o de transporte (locais, data/hora), ATCUD.</li>\n<li><strong>Comunica\u00e7\u00e3o \u00e0 AT</strong>: para documentos de transporte \u2014 m\u00e9todo (webservice ou SAF-T resumido); op\u00e7\u00e3o de SMS ao motorista com o c\u00f3digo da AT.</li>\n<li><strong>Layout de impress\u00e3o</strong>: template com QR Code + ATCUD (obrigat\u00f3rio em documentos fiscalmente relevantes).</li>\n<li><strong>Acessos</strong>: quem pode emitir/alterar/anular/reimprimir.</li>\n<li>Para vendas a dinheiro/consumidor final: regras de cliente gen\u00e9rico e NIF.</li>\n</ol>\n<h3>5.4 Viragem de ano / obriga\u00e7\u00f5es peri\u00f3dicas de configura\u00e7\u00e3o</h3>\n<ul>\n<li><strong>Comunicar s\u00e9ries \u00e0 AT</strong> antes de as usar (ATCUD): a AT devolve o <strong>c\u00f3digo de valida\u00e7\u00e3o da s\u00e9rie</strong>, que se associa na configura\u00e7\u00e3o \u2014 sem ele, <strong>a impress\u00e3o de documentos \u00e9 bloqueada</strong> (regra em vigor desde 2021).</li>\n<li>Carregar tabelas fiscais novas (reten\u00e7\u00f5es IRS com data de vig\u00eancia \u2014 202601 permite coexist\u00eancia de tabelas antigas/novas).</li>\n<li>Rever motivos de isen\u00e7\u00e3o de IVA (atualiza\u00e7\u00e3o manual ou autom\u00e1tica \u2014 202501+).</li>\n<li>Invent\u00e1rio: contagem e <strong>comunica\u00e7\u00e3o \u00e0 AT at\u00e9 31 de janeiro</strong> (quando aplic\u00e1vel).</li>\n<li>Verificar calend\u00e1rio de obriga\u00e7\u00f5es no <strong>Calend\u00e1rio PHC</strong> (PHC On).</li>\n</ul>\n<hr />\n<h2 id=\"cap-6\">6. Fiscalidade e obriga\u00e7\u00f5es legais</h2>\n<blockquote>\n<p>Um expert em Gest\u00e3o PHC \u00e9, na pr\u00e1tica, um especialista em conformidade fiscal portuguesa aplicada ao ERP. A PHC publica artigos oficiais para cada obriga\u00e7\u00e3o \u2014 todos citados nas fontes.</p>\n</blockquote>\n<h3>6.1 Certifica\u00e7\u00e3o do software e assinatura</h3>\n<ul>\n<li>O software \u00e9 <strong>certificado pela AT (ex-DGCI)</strong> \u2014 n\u00ba de certificado impresso nos documentos.</li>\n<li><strong>Assinatura digital qualificada/hash</strong> dos documentos obrigat\u00f3ria (artigo oficial: \"Assinatura digital qualificada nas faturas \u00e9 obrigat\u00f3ria a partir de 1 de janeiro\") \u2014 cadeia de hashes que garante a integridade; documentos certificados bloqueiam altera\u00e7\u00f5es a dados fiscais de clientes.</li>\n<li>Regras de <strong>fatura\u00e7\u00e3o</strong>: obriga\u00e7\u00e3o de emiss\u00e3o, prazos, documentos retificativos (NC com <strong>motivo de retifica\u00e7\u00e3o</strong> obrigat\u00f3rio), anula\u00e7\u00e3o com motivo.</li>\n</ul>\n<h3>6.2 SAF-T (PT)</h3>\n<ul>\n<li><strong>SAF-T de fatura\u00e7\u00e3o (auditoria)</strong>: exporta\u00e7\u00e3o mensal para a AT (e-fatura) e para o contabilista; inclui campos de controlo como a indica\u00e7\u00e3o de documento exportado para o SAF-T de auditoria, e o mapeamento de tipos de documento (FT, FS, FR, NC, ND, GT, GA, GC\u2026).</li>\n<li><strong>SAF-T (PT) resumido para documentos de transporte</strong>: alternativa ao webservice para comunicar guias; exporta <code>ShipFrom</code>/<code>ShipTo</code> (locais de carga/descarga) na tabela <code>MovementOfGoods</code>.</li>\n<li><strong>Comunica\u00e7\u00e3o de documentos de transporte \u00e0 AT</strong>: por <strong>webservice</strong> (tempo real, antes do in\u00edcio do transporte; devolve o <strong>C\u00f3d. Ident. AT</strong> que pode seguir por SMS ao motorista) ou por <strong>SAF-T resumido</strong>.</li>\n<li><strong>Comunica\u00e7\u00e3o de invent\u00e1rio</strong> via SAF-T/CSV/XML.</li>\n<li>Boas pr\u00e1ticas: validar o SAF-T no validador da AT/Portal das Finan\u00e7as ap\u00f3s cada mudan\u00e7a de configura\u00e7\u00e3o; testar com documentos isentos (motivos M01\u2013M99), NC/ND, autofatura\u00e7\u00e3o.</li>\n</ul>\n<h3>6.3 ATCUD e QR Code</h3>\n<ul>\n<li>Desde 2021 (v27+): <strong>todas as faturas e documentos fiscalmente relevantes</strong> incluem <strong>QR Code</strong> e <strong>ATCUD</strong> (c\u00f3digo \u00fanico do documento: c\u00f3digo de valida\u00e7\u00e3o da s\u00e9rie + n\u00famero sequencial).</li>\n<li>Passos: comunicar s\u00e9ries \u00e0 AT \u2192 receber c\u00f3digo de valida\u00e7\u00e3o \u2192 associ\u00e1-lo na s\u00e9rie no PHC \u2192 garantir <strong>layouts preparados</strong> com QR e ATCUD \u2192 o software <strong>impede a impress\u00e3o</strong> de documentos de s\u00e9ries n\u00e3o validadas.</li>\n</ul>\n<h3>6.4 e-Fatura e fatura\u00e7\u00e3o eletr\u00f3nica</h3>\n<ul>\n<li><strong>M\u00e9todo de envio de faturas emitidas</strong>: webservice \u00e0 AT em tempo real (par\u00e2metro) ou via SAF-T mensal pelo contabilista.</li>\n<li><strong>Fatura\u00e7\u00e3o eletr\u00f3nica</strong>: m\u00f3dulo <strong>Documentos Eletr\u00f3nicos</strong> (c\u00f3digo EAN da empresa, EDI), integra\u00e7\u00e3o <strong>SaphetyDoc via webservice</strong> (artigo oficial no Help Center: \"Comunica\u00e7\u00e3o de Documentos com SaphetyDoc via Webservice no PHC CS Desktop\"), e <strong>CIUS-PT</strong> para fatura\u00e7\u00e3o \u00e0 Administra\u00e7\u00e3o P\u00fablica; com <strong>Cegid Docs</strong>, PDFs de faturas de fornecedor CIUS-PT s\u00e3o <strong>anexados e pr\u00e9-lan\u00e7ados</strong> automaticamente (202601).</li>\n<li><strong>e-TaxFree</strong> (turistas) e vendas intra-comunit\u00e1rias (<strong>opera\u00e7\u00f5es triangulares</strong>, Intrastat).</li>\n</ul>\n<h3>6.5 Impostos e reten\u00e7\u00f5es</h3>\n<ul>\n<li><strong>IVA</strong>: taxas, motivos de isen\u00e7\u00e3o (tabela M01\u2013M99 sincronizada com webservice), IVA de caixa (se aplic\u00e1vel), apuramento via Contabilidade, <strong>Declara\u00e7\u00e3o Peri\u00f3dica de IVA</strong>.</li>\n<li><strong>Reten\u00e7\u00f5es na fonte</strong>: IRS (faturas com taxa/valor de reten\u00e7\u00e3o), IRC, <strong>Imposto do Selo</strong> \u2014 o Calend\u00e1rio PHC documenta o tratamento no software.</li>\n<li><strong>Modelo 22 / IRC</strong> (202601 atualizou apuramento de IRC 2025), <strong>Modelo 30</strong> (rendimentos pagos a n\u00e3o residentes \u2014 guia passo-a-passo oficial), <strong>DMR</strong> (n\u00e3o emitir valores negativos \u2014 202601).</li>\n<li><strong>Espanha</strong>: <strong>SII</strong> (Suministro Inmediato de Informaci\u00f3n AEAT) e <strong>TicketBAI</strong> \u2014 par\u00e2metro geral com 4 op\u00e7\u00f5es (202601); fun\u00e7\u00f5es internas \"Enviar documentos de Compras/Vendas para o SII\".</li>\n<li><strong>Peru</strong>: c\u00e1lculo de reten\u00e7\u00e3o nas vendas (taxa de reten\u00e7\u00e3o no documento).</li>\n</ul>\n<h3>6.6 Novas obriga\u00e7\u00f5es 2026 (vers\u00e3o 202601)</h3>\n<ul>\n<li><strong>SDR \u2014 Sistema de Dep\u00f3sito e Recolha</strong>: desde <strong>10 de abril de 2026</strong>, dep\u00f3sito de <strong>0,10 \u20ac/unidade</strong> em embalagens de bebidas de uso \u00fanico (at\u00e9 3 L). Configura\u00e7\u00e3o \u00fanica dos \"itens SDR\" no software; o dep\u00f3sito \u00e9 aplicado automaticamente em cada venda. Retorno de embalagens/vales gerido maioritariamente por RVM (m\u00e1quinas) \u2014 integra\u00e7\u00e3o ERP\u2194RVM para estabelecimentos \u2265400 m\u00b2 <strong>n\u00e3o \u00e9 standard</strong> (oportunidade de desenvolvimento!).</li>\n<li><strong>Seguran\u00e7a Social com 2FA</strong> obrigat\u00f3rio para empresas desde <strong>12 de maio de 2026</strong> (afeta comunica\u00e7\u00f5es do m\u00f3dulo Pessoal, mas o t\u00e9cnico deve conhecer).</li>\n</ul>\n<h3>6.7 RGPD</h3>\n<ul>\n<li>Aviso legal configur\u00e1vel e registo do tratamento de dados; direito ao esquecimento (anonimiza\u00e7\u00e3o/processamento de dados pessoais); hist\u00f3rico de utilizadores; log de atividade (Enterprise). Artigos oficiais: \"RGPD: Como o PHC CS o ajuda a cumprir a legisla\u00e7\u00e3o\".</li>\n</ul>\n<hr />\n<h2 id=\"cap-7\">7. Desenvolvimento e personaliza\u00e7\u00e3o (Framework PHC)</h2>\n<blockquote>\n<p>Aqui est\u00e1 o cora\u00e7\u00e3o do \"t\u00e9cnico que desenvolve solu\u00e7\u00f5es\". A plataforma tem <strong>duas frameworks</strong>: desktop (<strong>Xbase</strong>) e web (<strong>C#</strong>), mais a camada <strong>SQL Server</strong> (T-SQL) e a plataforma de integra\u00e7\u00e3o <strong>EyePeak</strong>.</p>\n</blockquote>\n<h3>7.1 Princ\u00edpios</h3>\n<ul>\n<li><strong>Tudo o que \u00e9 personaliza\u00e7\u00e3o fica gravado na base de dados</strong> (c\u00f3digo, regras, campos, ecr\u00e3s) \u2014 sobrevive a reinstala\u00e7\u00f5es do execut\u00e1vel, mas <strong>tem de ser validado a cada upgrade de vers\u00e3o</strong>.</li>\n<li>As ferramentas da framework ativam-se por <strong>par\u00e2metros</strong> (ex.: \"Utiliza campos do utilizador?\") e aparecem no menu <strong>Supervisor \u2192 Framework PHC</strong>.</li>\n<li>A disponibilidade depende da <strong>gama/plano</strong> (Corporate tem pouco; Advanced abre a personaliza\u00e7\u00e3o; Enterprise abre p\u00e1ginas/objetos/eventos completos e aprova\u00e7\u00f5es).</li>\n</ul>\n<h3>7.2 Ferramentas da Framework desktop (invent\u00e1rio completo)</h3>\n<table>\n<thead>\n<tr>\n<th>Ferramenta</th>\n<th>Para que serve</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Campos de Utilizador</strong></td>\n<td>Adicionar colunas a tabelas do software (com tipos, valida\u00e7\u00f5es) sem alterar o core</td>\n</tr>\n<tr>\n<td><strong>Tabelas de Utilizador</strong></td>\n<td>Criar tabelas novas da aplica\u00e7\u00e3o (ex.: a \"Zona\" do cliente \u00e9 um campo de tabela do utilizador)</td>\n</tr>\n<tr>\n<td><strong>\u00cdndices de Utilizador</strong></td>\n<td>Criar \u00edndices SQL sobre tabelas do software (incl. INCLUDED COLUMNS) para performance</td>\n</tr>\n<tr>\n<td><strong>Valores por Defeito</strong></td>\n<td>Preenchimento autom\u00e1tico de qualquer campo de qualquer tabela (com express\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>Regras de Utilizador</strong> (+ Assistente)</td>\n<td>Valida\u00e7\u00f5es de neg\u00f3cio: obrigar campos, impedir grava\u00e7\u00e3o sem stock, validar NIF\u2026 com editor e assistente de constru\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Teclas de Utilizador</strong></td>\n<td>Atalhos de teclado personalizados (com descri\u00e7\u00e3o em rodap\u00e9)</td>\n</tr>\n<tr>\n<td><strong>Fun\u00e7\u00f5es de Utilizador</strong></td>\n<td>Fun\u00e7\u00f5es Xbase reutiliz\u00e1veis criadas pelo utilizador</td>\n</tr>\n<tr>\n<td><strong>Instru\u00e7\u00f5es Internas</strong></td>\n<td>Instru\u00e7\u00f5es/procedimentos escritos pelo utilizador associados a cada ecr\u00e3 principal (documenta\u00e7\u00e3o in-app e automa\u00e7\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>Eventos de Utilizador</strong></td>\n<td>C\u00f3digo Xbase associado a eventos de objetos/ecr\u00e3s (ver 7.3)</td>\n</tr>\n<tr>\n<td><strong>P\u00e1ginas de Utilizador / Objetos de Ecr\u00e3</strong></td>\n<td>Acrescentar p\u00e1ginas (separadores) e objetos (campos, textos, bot\u00f5es, grelhas, campos de liga\u00e7\u00e3o, campos em \u00e1rvore\u2026) aos ecr\u00e3s standard</td>\n</tr>\n<tr>\n<td><strong>Ecr\u00e3s Personalizados (IDU)</strong></td>\n<td>Criar ecr\u00e3s novos de raiz (desenhador de ecr\u00e3s; em POS touch com drag-and-drop), com liga\u00e7\u00f5es entre IDUs, par\u00e2metros de ecr\u00e3 e bot\u00e3o personaliz\u00e1vel</td>\n</tr>\n<tr>\n<td><strong>Op\u00e7\u00f5es de Ecr\u00e3 / Menus</strong></td>\n<td>Acrescentar bot\u00f5es \u00e0s toolbars e criar menus para op\u00e7\u00f5es novas; Configura\u00e7\u00f5es de Menus</td>\n</tr>\n<tr>\n<td><strong>Consultas / An\u00e1lises de Utilizador</strong></td>\n<td>Consultas SQL do utilizador apresentadas como ecr\u00e3s de an\u00e1lise; base das An\u00e1lises Multidimensionais</td>\n</tr>\n<tr>\n<td><strong>Snapshots</strong></td>\n<td>Consultas T-SQL \"fotografadas\" com vari\u00e1veis (ex.: <code>#stamp#</code>), agrup\u00e1veis e coloridas</td>\n</tr>\n<tr>\n<td><strong>Monitores / Itens de Monitor</strong></td>\n<td>Apresenta\u00e7\u00f5es de dados sequenciais (colunas configur\u00e1veis) para operational dashboards</td>\n</tr>\n<tr>\n<td><strong>Alertas de Utilizador / Notifica\u00e7\u00f5es</strong></td>\n<td>Alertas autom\u00e1ticos (fun\u00e7\u00f5es internas como <code>CriaAvs(stamp, userAv, \u2026)</code>; novas fun\u00e7\u00f5es internas 202601: \"Enviar documentos de Compras/Vendas para o SII\"); aviso interno, PHC Notify, e-mail</td>\n</tr>\n<tr>\n<td><strong>Filtros de Utilizador</strong></td>\n<td>Filtros pr\u00f3prios para as tabelas/grelhas</td>\n</tr>\n<tr>\n<td><strong>Templates (B\u00e1sicos / de Tabela) / Defini\u00e7\u00e3o de Assinaturas</strong></td>\n<td>Modelos r\u00e1pidos de UI e assinaturas digitais em ecr\u00e3s (interven\u00e7\u00f5es, faturas, dossiers)</td>\n</tr>\n<tr>\n<td><strong>Multi-l\u00edngua</strong></td>\n<td>Tradu\u00e7\u00f5es de descri\u00e7\u00f5es (artigos, etc.)</td>\n</tr>\n<tr>\n<td><strong>Importa\u00e7\u00e3o/Exporta\u00e7\u00e3o</strong></td>\n<td>Importar Excel para linhas, exportar listagens xlsx/pdf, importa\u00e7\u00e3o de c\u00e2mbios via ODBC</td>\n</tr>\n<tr>\n<td><strong>Dicion\u00e1rio de Dados</strong></td>\n<td>Consulta da estrutura de <strong>qualquer tabela</strong> (campos, descri\u00e7\u00f5es, tipos, tamanhos) e <strong>rela\u00e7\u00f5es entre tabelas</strong> (desde a vers\u00e3o 2008) \u2014 acess\u00edvel por Supervisor \u2192 Tratamento da base de dados, ou pelo menu de op\u00e7\u00f5es de qualquer ecr\u00e3 (posiciona-se na tabela do ecr\u00e3). <strong>A ferramenta n\u00ba 1 do programador PHC.</strong></td>\n</tr>\n<tr>\n<td><strong>Simulador de SQL / Explorador de Dados</strong></td>\n<td>Executar consultas \u00e0 BD dentro da aplica\u00e7\u00e3o; explorar dados</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Onde ficam gravados os <strong>erros de execu\u00e7\u00e3o dos eventos/c\u00f3digo do utilizador</strong> (linha do erro; express\u00f5es n\u00e3o t\u00eam n\u00ba de linha) \u2014 primeiro s\u00edtio a ver quando \"o evento n\u00e3o faz nada\"</td>\n</tr>\n</tbody>\n</table>\n<h3>7.3 Eventos e o objeto <code>ObjRecebido</code> (Xbase desktop)</h3>\n<p>Os eventos s\u00e3o express\u00f5es/programas em <strong>Xbase</strong> (sintaxe tipo Visual FoxPro) associados a objetos (Enterprise; alguns eventos de utilizador dispon\u00edveis desde Advanced). Lista oficial de eventos:</p>\n<ul>\n<li><strong>Init</strong>, <strong>Ativar</strong>, <strong>Desativar</strong>, <strong>Refrescar</strong></li>\n<li><strong>Clique</strong>, <strong>Duplo Clique</strong>, <strong>Clique Direito</strong></li>\n<li><strong>Ao Entrar</strong>, <strong>Ao Sair</strong>, <strong>Ap\u00f3s Atualizar</strong>, <strong>Ap\u00f3s n\u00e3o Atualizado</strong></li>\n<li><strong>Antes mudar Linha/Coluna</strong>, <strong>Depois mudar Linha/Coluna</strong></li>\n<li><strong>MouseEnter</strong>, <strong>MouseLeave</strong>, <strong>MouseMove</strong>, <strong>MouseWheel</strong></li>\n<li><strong>Tecla Pressionada</strong></li>\n</ul>\n<p>Em cada evento programado existe o objeto <strong><code>ObjRecebido</code></strong>, com:</p>\n<ul>\n<li><strong><code>ObjRecebido.Janela</code></strong> \u2014 apontador para o ecr\u00e3 (ex.: <code>ObjRecebido.Janela.Caption = \"Exemplo\"</code>; altera\u00e7\u00f5es n\u00e3o persistem \u2014 usar no evento Init para aplicar sempre).</li>\n<li><strong><code>ObjRecebido.Objecto</code></strong> \u2014 apontador para o pr\u00f3prio objeto (propriedades <code>Value</code>, <code>Parent</code>; em objetos compostos como o <strong>Campo de Liga\u00e7\u00e3o</strong>: <code>.Lista1</code>, <code>.Nossocampo1</code>, <code>.Procura</code>).</li>\n<li><strong><code>ObjRecebido.Objecto.MeusDados</code></strong> \u2014 reposit\u00f3rio chave/valor do utilizador para passar dados entre eventos: <code>AddParametro</code>, <code>GuardaParametro</code>, <code>ExisteParametro</code>, <code>GetNomeParametro</code>, <code>GetIndexParametro</code>, <code>TotalParametros</code> (leitura do valor: <code>MeusDados.CorFundoAntiga</code>).</li>\n<li><strong><code>Return .F.</code></strong> \u2014 cancela o comportamento de raiz do objeto para esse evento (ex.: impedir digita\u00e7\u00e3o, esconder calend\u00e1rio em campos de data). Sem <code>Return</code> em express\u00f5es simples (o valor \u00e9 retornado automaticamente).</li>\n<li>Debug: erros de eventos gravados na <strong>An\u00e1lise Interna</strong>.</li>\n</ul>\n<p><strong>Exemplo (guardar/rep\u00f4r cor de fundo entre eventos):</strong></p>\n<pre><code class=\"language-xbase\">* Evento Init (programa)\nObjRecebido.Objecto.MeusDados.GuardaParametro(&quot;CorFundoAntiga&quot;, ObjRecebido.Objecto.BackColor)\nObjRecebido.Objecto.BackColor = RGB(0,255,255)\n</code></pre>\n<p><strong>Fun\u00e7\u00f5es internas \u00fateis (exemplos documentados):</strong> <code>U_NAVEGA</code> (navegar para registos/ecr\u00e3s; o 2\u00ba par\u00e2metro interage com \"mostrar \u00faltimo registo\"), <code>CriaAvs</code> (criar avisos/avisos internos a utilizadores \u2014 par\u00e2metros incluem <code>stamp</code> do ecr\u00e3 e <code>userAv</code>), fun\u00e7\u00f5es de envio SII (202601), <code>PromptFunction()</code> (202601 \u2014 nova fun\u00e7\u00e3o da framework para invocar IA/Cegid Pulse a partir de c\u00f3digo; base dos <strong>Smart Tools</strong> que os parceiros podem configurar/monetizar).</p>\n<h3>7.4 Framework PHC CS Web (C#)</h3>\n<p>No lado web (inclu\u00eddo no Evolution), a framework oferece (lista oficial do manual \"Framework PHC CS Web\"):</p>\n<ul>\n<li><strong>Editor de C\u00f3digo</strong> (C#) para eventos e regras</li>\n<li><strong>Eventos</strong> (ex.: enviar e-mail com o material quando algu\u00e9m introduz uma encomenda)</li>\n<li><strong>Regras</strong> (valida\u00e7\u00f5es de neg\u00f3cio: obrigar campos, impedir grava\u00e7\u00e3o sem stock\u2026)</li>\n<li><strong>Ecr\u00e3s de Utilizador</strong> (novos ecr\u00e3s \u00e0 medida), <strong>Objetos de Ecr\u00e3</strong> (acrescentar campos a p\u00e1ginas existentes), <strong>Objetos Internos</strong> (campos novos em objetos existentes), <strong>Objetos da Framework</strong> (lista de todos os objetos do ecr\u00e3)</li>\n<li><strong>Op\u00e7\u00f5es de Ecr\u00e3</strong> (bot\u00f5es novos em toolbars), <strong>Menus</strong></li>\n<li><strong>Scripts</strong> (programa executado por URL \u2014 endpoints pr\u00f3prios!)</li>\n<li><strong>Monitores</strong> e <strong>Itens de Monitor</strong>, <strong>Templates B\u00e1sicos</strong>, <strong>Templates de Tabela</strong>, <strong>Defini\u00e7\u00e3o de Assinaturas</strong></li>\n<li><strong>Valores por Defeito</strong>, <strong>Filtros do Utilizador</strong>, <strong>RSS do Utilizador</strong></li>\n<li><strong>Par\u00e2metros</strong> (configura\u00e7\u00e3o das aplica\u00e7\u00f5es autorizadas)</li>\n<li><strong>Log de C\u00f3digo</strong> (diagn\u00f3stico da execu\u00e7\u00e3o do c\u00f3digo de utilizador)</li>\n<li><strong>Dicion\u00e1rio de dados</strong> (web)</li>\n</ul>\n<p>Relat\u00f3rios web usam <strong>DevExpress</strong> (\"Relat\u00f3rios DevExpress no PHC CS Web\", cobrindo Gest\u00e3o: Clientes, Fatura\u00e7\u00e3o, Recibos de Adiantamento\u2026).</p>\n<h3>7.5 Camada SQL Server (T-SQL)</h3>\n<ul>\n<li>Consultas diretas para an\u00e1lises/snapshots/relat\u00f3rios externos (com <code>WITH (NOLOCK)</code> para leituras, e aten\u00e7\u00e3o a <code>ref</code>/<code>stamp</code>).</li>\n<li><strong>\u00cdndices de utilizador</strong> via framework (evitar criar \u00edndices \"\u00e0 m\u00e3o\" sem documentar).</li>\n<li>Views/procedures: poss\u00edveis, mas <strong>a PHC atualiza o esquema entre vers\u00f5es</strong> \u2014 nunca alterar tabelas/colunas do core; usar campos/tabelas de utilizador.</li>\n<li><strong>Desfragmenta\u00e7\u00e3o</strong> e manuten\u00e7\u00e3o (cap\u00edtulo 3).</li>\n</ul>\n<h3>7.6 Receitas pr\u00e1ticas (padr\u00f5es que vai usar sempre)</h3>\n<ol>\n<li><strong>Validar NIF portugu\u00eas ao gravar cliente</strong> \u2192 Regra de utilizador no ecr\u00e3 Clientes (com assistente ou c\u00f3digo Xbase), mensagem via aviso.</li>\n<li><strong>Impedir fatura\u00e7\u00e3o sem stock</strong> \u2192 Regra de utilizador no documento (gama Advanced+) ou evento Ap\u00f3s Atualizar nas linhas.</li>\n<li><strong>Campo extra \"N\u00ba de contrato\" na fatura</strong> \u2192 Campo de utilizador na tabela FT + arrastar para p\u00e1gina de utilizador no ecr\u00e3 + valor por defeito.</li>\n<li><strong>Alerta de cr\u00e9dito excedido</strong> \u2192 Alerta de utilizador/<code>CriaAvs</code> no evento de grava\u00e7\u00e3o do documento + PHC Notify por e-mail.</li>\n<li><strong>An\u00e1lise de vendas por zona</strong> \u2192 An\u00e1lise de utilizador (SQL com join FT\u00d7CL\u00d7CL2) + filtro de utilizador; na gama Advanced, promover a <strong>An\u00e1lise Multidimensional</strong>.</li>\n<li><strong>Endpoint para loja online ler stock</strong> \u2192 PHC CS Web: <strong>Script</strong> por URL + (ou) sincroniza\u00e7\u00e3o <strong>EyePeak</strong>.</li>\n<li><strong>Assistente de IA para comerciais</strong> \u2192 Cegid Pulse: configurar assistente de neg\u00f3cio / Smart Tool com <code>PromptFunction()</code> (202601).</li>\n</ol>\n<h3>7.7 Boas pr\u00e1ticas de desenvolvimento PHC</h3>\n<ul>\n<li>Trabalhar sempre sobre <strong>clone da BD</strong> (detach/copy/attach) antes de personalizar em produ\u00e7\u00e3o.</li>\n<li><strong>Documentar cada personaliza\u00e7\u00e3o</strong> (onde, c\u00f3digo, motivo, vers\u00e3o) \u2014 os upgrades anuais obrigam a revalidar.</li>\n<li>Usar <strong>Dicion\u00e1rio de Dados</strong> para descobrir tabelas/rela\u00e7\u00f5es em vez de adivinhar nomes.</li>\n<li>Respeitar <code>stamp</code>/concorr\u00eancia otimista nas atualiza\u00e7\u00f5es por SQL; preferir a API de grava\u00e7\u00e3o da aplica\u00e7\u00e3o quando poss\u00edvel.</li>\n<li>Verificar a <strong>An\u00e1lise Interna</strong> (desktop) / <strong>Log de C\u00f3digo</strong> (web) ap\u00f3s cada altera\u00e7\u00e3o.</li>\n<li>N\u00e3o tocar em objetos certificados/fiscais sem validar SAF-T depois.</li>\n<li>Manter conven\u00e7\u00e3o de nomes nas entidades de utilizador (prefixo do parceiro/projeto).</li>\n</ul>\n<hr />\n<h2 id=\"cap-8\">8. Base de dados: estrutura e boas pr\u00e1ticas</h2>\n<h3>8.1 Conven\u00e7\u00f5es confirmadas</h3>\n<ul>\n<li><strong>SQL Server</strong> exclusivo (termos de licenciamento: 2008R2+; instala\u00e7\u00e3o t\u00edpica: 2012+; Express no Corporate).</li>\n<li><strong>Nomes de tabelas curtos (2 letras)</strong> + variantes numeradas para extens\u00f5es:</li>\n<li><code>CL</code> = Clientes; <code>CL2</code> = Clientes \u2013 Outros Dados (ex.: pa\u00eds da morada)</li>\n<li><code>FT</code> = Documentos de Fatura\u00e7\u00e3o (ex.: <code>ft.ndoc</code> = tipo de documento)</li>\n<li><code>BO</code> = Dossiers Internos</li>\n<li><code>RE</code> = Recibos</li>\n<li><code>TABOP</code> = Ordens de Fabrico (Manufactor)</li>\n<li>(as restantes \u2014 fornecedores, artigos/stocks, movimentos, C/C, tesouraria, pagamentos, compras \u2014 descobrem-se com o <strong>Dicion\u00e1rio de Dados</strong>, que mostra campos, descri\u00e7\u00f5es, tipos e rela\u00e7\u00f5es de qualquer tabela, ex.: pesquisar \"clientes\" ou \".CL\")</li>\n<li>Campos estruturais recorrentes: <strong><code>ref</code></strong> (identificador do registo), <strong><code>stamp</code></strong> (vers\u00e3o/concorr\u00eancia do registo \u2014 usado em snapshots com <code>#stamp#</code> e em navega\u00e7\u00e3o), <code>ndoc</code>/s\u00e9ries em documentos.</li>\n<li>Leituras pesadas com <code>WITH (NOLOCK)</code> (pr\u00e1tica comum nas an\u00e1lises/snapshots documentados pela PHC).</li>\n</ul>\n<h3>8.2 O Dicion\u00e1rio de Dados \u00e9 o seu melhor amigo</h3>\n<p>Dispon\u00edvel <strong>em todas as gamas</strong>: Supervisor \u2192 Tratamento da base de dados \u2192 Dicion\u00e1rio de dados (ou menu de op\u00e7\u00f5es de qualquer ecr\u00e3, ficando posicionado na tabela do ecr\u00e3). Mostra: campos, descri\u00e7\u00f5es, tipos, tamanhos e, desde a vers\u00e3o 2008, as <strong>express\u00f5es de rela\u00e7\u00e3o entre tabelas</strong> (duplo clique numa liga\u00e7\u00e3o salta para a tabela relacionada). Use-o para mapear qualquer processo antes de escrever SQL.</p>\n<h3>8.3 Dados por empresa e ciclo de vida</h3>\n<ul>\n<li>1 empresa = 1 BD; multiempresa = multiplas BDs no mesmo servidor.</li>\n<li><strong>Arquivo</strong>: passagem de dados antigos para BD de arquivo (performance + redu\u00e7\u00e3o do tamanho contratado nos planos 10 GB).</li>\n<li><strong>File Storage</strong>: anexos fora da BD (diretoria f\u00edsica) exceto fiscalmente relevantes.</li>\n</ul>\n<hr />\n<h2 id=\"cap-9\">9. Integra\u00e7\u00f5es e ecossistema</h2>\n<table>\n<thead>\n<tr>\n<th>Integra\u00e7\u00e3o</th>\n<th>O que faz</th>\n<th>Como se configura</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>EyePeak</strong></td>\n<td>Plataforma log\u00edstica/WMS/e-commerce (Cegid Primavera). Fluxos documentais ERP\u2194EyePeak (ex.: encomendas de fornecedor \u2192 guias; s\u00e9ries de fatura\u00e7\u00e3o sincronizadas)</td>\n<td>Monitor <strong>EyePeak Sincroniza\u00e7\u00e3o</strong> no menu Supervisor (desktop) / ecr\u00e3 Eye Peak Sincroniza\u00e7\u00e3o (web)</td>\n</tr>\n<tr>\n<td><strong>PHC CS Web / Front Web</strong></td>\n<td>Aplica\u00e7\u00f5es web sobre a mesma BD: Gest\u00e3o Web (fatura\u00e7\u00e3o, adiantamentos, recibos\u2026), Front Web (extranet para clientes/fornecedores consultarem documentos/dossiers)</td>\n<td>Package PHC CS Web; servidor IIS; utilizadores do desktop t\u00eam acesso</td>\n</tr>\n<tr>\n<td><strong>SaphetyDoc / Documentos Eletr\u00f3nicos</strong></td>\n<td>Fatura\u00e7\u00e3o eletr\u00f3nica (EDI, CIUS-PT) por webservice; c\u00f3digo EAN da empresa</td>\n<td>M\u00f3dulo Documentos Eletr\u00f3nicos + artigo oficial de configura\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Cegid Docs</strong></td>\n<td>Arquivo digital legal na cloud; faturas CIUS-PT anexadas em PDF e pr\u00e9-lan\u00e7adas; pesquisa na WebApp (Evolution)</td>\n<td>Configura\u00e7\u00e3o \"Arquivo Digital Legal com Cegid Docs\" (artigo oficial + FAQs)</td>\n</tr>\n<tr>\n<td><strong>Open Banking</strong></td>\n<td>Importa\u00e7\u00e3o de movimentos banc\u00e1rios, reconcilia\u00e7\u00e3o e previs\u00e3o de tesouraria (Evolution)</td>\n<td>Ativa\u00e7\u00e3o no plano Evolution; configura\u00e7\u00e3o de contas</td>\n</tr>\n<tr>\n<td><strong>SEPA / bancos</strong></td>\n<td>Ficheiros de d\u00e9bitos diretos e pagamentos; transfer\u00eancias de vencimentos; WebBanking</td>\n<td>Ecr\u00e3s de tesouraria/bancos + artigos oficiais</td>\n</tr>\n<tr>\n<td><strong>Multibanco / Unicre / PayPal</strong></td>\n<td>Refer\u00eancias MB, pagamentos online (web)</td>\n<td>M\u00f3dulos/par\u00e2metros pr\u00f3prios</td>\n</tr>\n<tr>\n<td><strong>SMS / e-mail (SMTP)</strong></td>\n<td>Envio de documentos e avisos (c\u00f3digo AT ao motorista, documentos por e-mail com idioma do cliente)</td>\n<td>M\u00f3dulo SMS; par\u00e2metros de envio de e-mail diretos por SMTP</td>\n</tr>\n<tr>\n<td><strong>TPA / POS / PDA</strong></td>\n<td>Terminais de pagamento, postos de retalho, terminais port\u00e1teis de stock</td>\n<td>Liga\u00e7\u00f5es/configura\u00e7\u00e3o POS e Stocks</td>\n</tr>\n<tr>\n<td><strong>Excel / ODBC</strong></td>\n<td>Importa\u00e7\u00e3o (c\u00e2mbios via ODBC, Excel para linhas), exporta\u00e7\u00e3o (xlsx/pdf)</td>\n<td>Nativo</td>\n</tr>\n<tr>\n<td><strong>Comunidade XML/B2B</strong></td>\n<td>Troca de documentos cliente-fornecedor em XML (eProcurement) \u2014 hist\u00f3rico da plataforma</td>\n<td>Documenta\u00e7\u00e3o da Comunidade</td>\n</tr>\n<tr>\n<td><strong>Cegid Pulse (IA)</strong></td>\n<td>Assistentes de neg\u00f3cio (comercial), Smart Tools configur\u00e1veis pelos parceiros, <code>PromptFunction()</code></td>\n<td>M\u00f3dulo Cegid Pulse + Cegid Account por utilizador (3 passos: acesso ao m\u00f3dulo, ativar Cegid Account na ficha, login)</td>\n</tr>\n<tr>\n<td><strong>Seguran\u00e7a Social Direta / AT</strong></td>\n<td>Comunica\u00e7\u00f5es oficiais (webservice AT, SSD com 2FA desde 05/2026)</td>\n<td>Par\u00e2metros + credenciais</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"cap-10\">10. Opera\u00e7\u00e3o, suporte, diagn\u00f3stico e performance</h2>\n<h3>10.1 Diagn\u00f3stico (por onde come\u00e7ar quando algo falha)</h3>\n<ol>\n<li><strong>An\u00e1lise Interna</strong> \u2014 erros de eventos/c\u00f3digo Xbase do utilizador.</li>\n<li><strong>Log de C\u00f3digo</strong> (web) e <strong>Log de atividade</strong> (Enterprise v30+: quem consultou/alterou/apagou).</li>\n<li><strong>Hist\u00f3rico de utilizadores</strong> e tracking de a\u00e7\u00f5es.</li>\n<li><strong>Simulador de SQL / Explorador de dados</strong> \u2014 validar dados diretamente.</li>\n<li>Monitor de liga\u00e7\u00e3o ao SQL (quebras de rede), estado do ODBC.</li>\n<li>Documentos \"n\u00e3o processados\" \u2192 verificar <strong>processamento ass\u00edncrono</strong>.</li>\n<li>Impress\u00f5es bloqueadas \u2192 s\u00e9ries sem <strong>c\u00f3digo de valida\u00e7\u00e3o AT</strong> (ATCUD).</li>\n<li>SAF-T inv\u00e1lido \u2192 motivos de isen\u00e7\u00e3o fora de M01\u2013M99 com webservice ativo; tipos de documento mal mapeados na s\u00e9rie.</li>\n</ol>\n<h3>10.2 Performance</h3>\n<ul>\n<li>Ecr\u00e3s em mem\u00f3ria; desligar \"mostrar \u00faltimo registo ao arrancar\";</li>\n<li>\u00cdndices de utilizador (INCLUDED COLUMNS) para as consultas mais usadas;</li>\n<li>Desfragmenta\u00e7\u00e3o das tabelas principais + manuten\u00e7\u00e3o SQL;</li>\n<li>BD de arquivo para hist\u00f3ricos; File Storage para anexos;</li>\n<li>NOLOCK em leituras anal\u00edticas; snapshots bem desenhados;</li>\n<li>Monitorizar espa\u00e7o da BD (limites de plano).</li>\n</ul>\n<h3>10.3 Upgrades e migra\u00e7\u00f5es</h3>\n<ul>\n<li>Upgrade de vers\u00e3o: backup \u2192 ambiente de teste (clone) \u2192 upgrade \u2192 validar personaliza\u00e7\u00f5es (campos, regras, eventos, an\u00e1lises, templates de impress\u00e3o, integra\u00e7\u00f5es) \u2192 agendar produ\u00e7\u00e3o.</li>\n<li>Migra\u00e7\u00e3o <strong>PHC CS perp\u00e9tuo \u2192 Cegid PHC Evolution</strong>: diagn\u00f3stico, plano (escolher plano/m\u00f3dulos), migra\u00e7\u00e3o t\u00e9cnica (dados, configura\u00e7\u00f5es, integra\u00e7\u00f5es), suporte p\u00f3s-arranque \u2014 \u00e9 o processo standard dos parceiros; desenvolvimentos/addons existentes mant\u00eam-se.</li>\n</ul>\n<hr />\n<h2 id=\"cap-11\">11. Forma\u00e7\u00e3o, certifica\u00e7\u00e3o e recursos oficiais</h2>\n<h3>11.1 O que existe oficialmente</h3>\n<table>\n<thead>\n<tr>\n<th>Recurso</th>\n<th>O que \u00e9</th>\n<th>Acesso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Help Center (helpcenter.phccs.net / phc.pt/portal)</strong></td>\n<td>Manuais completos (Gest\u00e3o, Stocks, Fatura\u00e7\u00e3o, Framework, Web\u2026), artigos \"como fazer\", Novidades por vers\u00e3o</td>\n<td><strong>P\u00fablico</strong></td>\n</tr>\n<tr>\n<td><strong>Manuais dentro da aplica\u00e7\u00e3o</strong></td>\n<td>Bot\u00e3o \"Ajuda\" em cada ecr\u00e3 \u2014 manuais atualizados com novas funcionalidades</td>\n<td>Instalado</td>\n</tr>\n<tr>\n<td><strong>Comunidade PHC (community.phcsoftware.com)</strong></td>\n<td>\u00c1rea t\u00e9cnica e comercial: not\u00edcias, ficheiros, downloads, documenta\u00e7\u00e3o de parceiro</td>\n<td>Login <strong>N\u00ba Cliente + ID T\u00e9cnico + password</strong></td>\n</tr>\n<tr>\n<td><strong>PHC On (on.phc.pt)</strong></td>\n<td>Forma\u00e7\u00e3o online, autoforma\u00e7\u00e3o em v\u00eddeo, truques e dicas, novidades, Calend\u00e1rio PHC de obriga\u00e7\u00f5es legais</td>\n<td>Acordo PHC On</td>\n</tr>\n<tr>\n<td><strong>Cegid Academy \u2014 PEP (Cegid PHC Evolution Program)</strong></td>\n<td>Programa intensivo pr\u00e1tico de <strong>140 h</strong>, online p\u00f3s-laboral (edi\u00e7\u00e3o com in\u00edcio a 17 de setembro; 1.650 \u20ac + IVA, pagamento faseado): configurar/administrar software e ambientes t\u00e9cnicos, BD e SQL (performance e seguran\u00e7a), processos e m\u00f3dulos do ERP (gest\u00e3o, tesouraria, contabilidade, vencimentos). Certifica\u00e7\u00e3o oficial Cegid PHC; os primeiros certificados podem integrar projetos do ecossistema</td>\n<td>Inscri\u00e7\u00e3o via phcsoftware.com/pt/formacao-pep</td>\n</tr>\n<tr>\n<td><strong>Certifica\u00e7\u00f5es PHC (hist\u00f3rico/atuais)</strong></td>\n<td>Certifica\u00e7\u00e3o PHC CS Desktop Corporate/Advanced/Enterprise + por m\u00f3dulos; \"bolsa de t\u00e9cnicos certificados\"; pr\u00e9-requisito para n\u00edveis de parceiro</td>\n<td>Via parceiro/Cegid</td>\n</tr>\n<tr>\n<td><strong>Microcredencia\u00e7\u00e3o IPT</strong></td>\n<td>Curso acad\u00e9mico \"Software Cegid PHC CS Advanced\" (Instituto Polit\u00e9cnico de Tomar)</td>\n<td>portal2.ipt.pt</td>\n</tr>\n<tr>\n<td><strong>PHC Hi, Tech</strong></td>\n<td>Forma\u00e7\u00e3o de 3 meses (h\u00edbrida) para entrada na carreira (ex.: Angola)</td>\n<td>phcsoftware.com/ao</td>\n</tr>\n<tr>\n<td><strong>Eventos de programadores</strong></td>\n<td>\"Coding PHC\" (evento anual de developers das frameworks) e hist\u00f3rico DevSummit</td>\n<td>Comunidade/site</td>\n</tr>\n<tr>\n<td><strong>YouTube (@SoftwarePHC) e blog</strong></td>\n<td>V\u00eddeos de produto, webinars, artigos</td>\n<td>P\u00fablico</td>\n</tr>\n<tr>\n<td><strong>Listagens de Novidades (PDF)</strong></td>\n<td>Por vers\u00e3o (v18\u2026v30, 202501, 202601\u2026) \u2014 os parceiros publicam (Arentia, Winsig, NSoft\u2026)</td>\n<td>P\u00fablico</td>\n</tr>\n<tr>\n<td><strong>Programa de Parceiros</strong></td>\n<td>Venda/implementa\u00e7\u00e3o exclusivamente via parceiros certificados (com especializa\u00e7\u00f5es setoriais); acesso a demos, NFR, forma\u00e7\u00e3o cont\u00ednua</td>\n<td>phcsoftware.com/pt/parceiros</td>\n</tr>\n</tbody>\n</table>\n<h3>11.2 O programa oficial da Certifica\u00e7\u00e3o PHC CS Desktop Advanced (o curr\u00edculo do expert)</h3>\n<p>Resumo fiel do conte\u00fado program\u00e1tico oficial \u2014 use-o como \u00edndice de estudo:</p>\n<ol>\n<li><strong>Plataforma client/server</strong>: caracter\u00edsticas da BD e performance; limites de GB; instala\u00e7\u00e3o (SQL Express; requisitos m\u00ednimos; HCL); passos de instala\u00e7\u00e3o; utilizadores/logins SQL; detach/attach; seguran\u00e7a; backups e recupera\u00e7\u00e3o.</li>\n<li><strong>Instala\u00e7\u00e3o do PHC Desktop</strong>: exe \u00fanico; instala\u00e7\u00e3o + attach + ODBC autom\u00e1tico; utilizadores e grupos; acessos; toolbars; barra de status estendida; barra de janelas; ecr\u00e3s em mem\u00f3ria; ecr\u00e3s personalizados; campos obrigat\u00f3rios; an\u00e1lise multidimensional; BD de arquivo; <strong>regras, campos de utilizador, valores por defeito e teclas de utilizador</strong>; painel de ecr\u00e3; Enciclop\u00e9dia PHC.</li>\n<li><strong>Navega\u00e7\u00e3o</strong>: organiza\u00e7\u00e3o de ecr\u00e3s e menus; l\u00f3gica de funcionamento; mapas definidos e filtros.</li>\n<li><strong>Gest\u00e3o \u2014 ficheiros</strong>: Clientes/Fornecedores (sede/estabelecimentos, tipos de desconto, condi\u00e7\u00f5es de pagamento); Stocks e Servi\u00e7os (refer\u00eancias alternativas, compostos, invent\u00e1rio f\u00edsico, <strong>PCMP</strong>, promo\u00e7\u00f5es, tabelas de pre\u00e7os com validade).</li>\n<li><strong>Gest\u00e3o \u2014 circuito documental</strong>: DI \u2194 Faturas/Compras (encomendas de cliente/a fornecedor, comprar a encomenda, faturar a encomenda, c\u00f3pias); tabela de c\u00f3digos de C/C; c\u00f3digos de tesouraria; c\u00f3digos de movimentos de stock; configura\u00e7\u00e3o de documentos de fatura\u00e7\u00e3o.</li>\n<li><strong>Tesouraria</strong>: contas, extratos, movimentos, t\u00edtulos.</li>\n<li><strong>Painel de bordo</strong>: monitor de d\u00edvidas, saldo de C/C por idades, rankings, an\u00e1lises de DI.</li>\n<li><strong>RGPD</strong>: aviso legal, esquecimento, registo de tratamento.</li>\n<li><strong>Dossiers especiais</strong>: stock inicial, transfer\u00eancia de armaz\u00e9m, pre\u00e7os, aven\u00e7as, composi\u00e7\u00e3o/produ\u00e7\u00e3o.</li>\n<li><strong>PHC CS Web</strong>: conceito, aplica\u00e7\u00f5es, Front Web e Gest\u00e3o Web.</li>\n<li><strong>Configura\u00e7\u00e3o de documentos</strong> (conceitos, campos obrigat\u00f3rios, grupos, acessos a reimprimir/totalizar/anexar, gr\u00e1ficos, \"imprimir quando\").</li>\n<li><strong>Contabilidade</strong>: conceitos, par\u00e2metros, abertura de ano, contas, di\u00e1rios, <strong>documentos pr\u00e9-definidos (incl. na Gest\u00e3o)</strong>, movimentos, centros anal\u00edticos, apuramento IVA, declara\u00e7\u00e3o peri\u00f3dica, CEVMC, resultados, <strong>integra\u00e7\u00f5es Gest\u00e3o\u2192Contabilidade (configura\u00e7\u00e3o + opera\u00e7\u00e3o)</strong>, mapas de gest\u00e3o, BD pronta, PHC XL, taxonomia.</li>\n<li><strong>Imobilizado</strong> e <strong>Pessoal</strong> (vis\u00e3o geral operacional completa).</li>\n<li><strong>POS</strong> e <strong>Suporte</strong> (circuitos completos).</li>\n<li><strong>T\u00e9cnico</strong>: instala\u00e7\u00e3o do software e do SQL Server; manuten\u00e7\u00e3o manual de BDs; <strong>PHC ON</strong>; <strong>Framework PHC (3 partes)</strong>; \u00e1rea t\u00e9cnica e comercial da <strong>Comunidade PHC</strong>.</li>\n<li><strong>Implementing SQL</strong> (labs) e prepara\u00e7\u00e3o de demonstra\u00e7\u00f5es.</li>\n</ol>\n<hr />\n<h2 id=\"cap-12\">12. Plano de estudos at\u00e9 ao n\u00edvel expert</h2>\n<h3>Fase 0 \u2014 Prepara\u00e7\u00e3o (semana 1)</h3>\n<ul>\n<li>[ ] Perceber o ecossistema (cap\u00edtulo 1): Evolution vs. GO vs. CS; planos vs. gamas; m\u00f3dulos.</li>\n<li>[ ] Ler as <strong>Novidades da vers\u00e3o atual</strong> (202601) e das 2\u20133 anteriores no Help Center.</li>\n<li>[ ] Criar contas/marcadores: Help Center, phcsoftware.com, YouTube @SoftwarePHC, blog, Comunidade PHC (se tiver credenciais de parceiro/cliente).</li>\n</ul>\n<h3>Fase 1 \u2014 Infraestrutura (semanas 2\u20133)</h3>\n<ul>\n<li>[ ] Montar laborat\u00f3rio: VM Windows Server + SQL Server Express + instala\u00e7\u00e3o de demonstra\u00e7\u00e3o do PHC (pedir a um parceiro ou usar licen\u00e7a NFR/eval da Cegid).</li>\n<li>[ ] Instalar, criar empresa de demo, fazer detach/attach, backup/restore, criar utilizadores/grupos/acessos.</li>\n<li>[ ] Atualizar o software; explorar o Supervisor e o Dicion\u00e1rio de Dados.</li>\n</ul>\n<h3>Fase 2 \u2014 Dom\u00ednio funcional do Gest\u00e3o (semanas 4\u20137)</h3>\n<ul>\n<li>[ ] Ficheiros: criar 20 clientes (com filiais, idiomas, zonas), 10 fornecedores, 50 artigos (fam\u00edlias, unidades alternativas, compostos/kits, lotes), armaz\u00e9ns, tabelas de pre\u00e7os, descontos, condi\u00e7\u00f5es/formas de pagamento, IVA.</li>\n<li>[ ] Vendas: configurar 5 s\u00e9ries (Fatura FT, Fatura Simplificada FS, Fatura-Recibo FR, Nota de Cr\u00e9dito NC, Guia tipo 4) e emitir o circuito completo: Or\u00e7amento \u2192 Encomenda \u2192 Guia (com comunica\u00e7\u00e3o de transporte simulada) \u2192 Fatura \u2192 Recibo \u2192 liquida\u00e7\u00e3o. Testar adiantamentos, reten\u00e7\u00e3o IRS, isen\u00e7\u00f5es (M08\u2026), vendas a dinheiro, emiss\u00e3o autom\u00e1tica.</li>\n<li>[ ] Compras: encomenda a fornecedor \u2192 rece\u00e7\u00e3o \u2192 fatura de compra \u2192 pagamento com aprova\u00e7\u00e3o; adiantamentos.</li>\n<li>[ ] Stocks: movimentos, transfer\u00eancia entre armaz\u00e9ns (dossier), contagem/invent\u00e1rio com acertos, an\u00e1lise de ruturas/m\u00e1x-m\u00edn, PCMP e valor de stock.</li>\n<li>[ ] Tesouraria: contas, extrato, reconcilia\u00e7\u00e3o, transfer\u00eancias, t\u00edtulos, previs\u00f5es; SEPA e refer\u00eancias MB (te\u00f3rico).</li>\n<li>[ ] C/C: aging, mailing, monitor de d\u00edvidas, incobr\u00e1veis.</li>\n<li>[ ] An\u00e1lises: mapas definidos, an\u00e1lises de utilizador (SQL), snapshot, ranking de vendas.</li>\n</ul>\n<h3>Fase 3 \u2014 Fiscalidade (semanas 8\u20139)</h3>\n<ul>\n<li>[ ] Exportar e validar <strong>SAF-T (PT)</strong> no validador da AT; inspecionar o XML (tipos de documento, motivos de isen\u00e7\u00e3o, MovementOfGoods).</li>\n<li>[ ] Simular o fluxo <strong>ATCUD/QR</strong>: comunica\u00e7\u00e3o de s\u00e9ries, c\u00f3digo de valida\u00e7\u00e3o, layouts, bloqueio de impress\u00e3o.</li>\n<li>[ ] Configurar comunica\u00e7\u00e3o de documentos de transporte (webservice vs. SAF-T resumido) e SMS ao motorista.</li>\n<li>[ ] Rever artigos oficiais: e-fatura, fatura\u00e7\u00e3o eletr\u00f3nica/SaphetyDoc/CIUS-PT, invent\u00e1rio \u00e0 AT, e-TaxFree, reten\u00e7\u00f5es, SDR 2026, RGPD.</li>\n<li>[ ] Integra\u00e7\u00e3o com Contabilidade: documentos pr\u00e9-definidos, contas de integra\u00e7\u00e3o, apuramento de IVA (lan\u00e7ar um m\u00eas completo).</li>\n</ul>\n<h3>Fase 4 \u2014 Desenvolvimento (semanas 10\u201314)</h3>\n<ul>\n<li>[ ] Estudar <strong>Xbase/VFP</strong> (sintaxe: comandos, cursores, fun\u00e7\u00f5es) e <strong>T-SQL</strong>.</li>\n<li>[ ] Framework desktop, por ordem: valores por defeito \u2192 campos de utilizador \u2192 regras (assistente e c\u00f3digo) \u2192 teclas \u2192 fun\u00e7\u00f5es de utilizador \u2192 alertas \u2192 instru\u00e7\u00f5es internas.</li>\n<li>[ ] Eventos: implementar os padr\u00f5es do \u00a77.6 (1\u20134) num clone; depurar com a An\u00e1lise Interna; usar <code>ObjRecebido</code> completo (Janela, Objecto, MeusDados, Return .F.).</li>\n<li>[ ] P\u00e1ginas/objetos de utilizador e <strong>IDUs</strong>: construir um ecr\u00e3 novo (ex.: \"Cr\u00e9dito do Cliente\" com dados de C/C + bot\u00f5es de a\u00e7\u00e3o) e lig\u00e1-lo a um menu.</li>\n<li>[ ] An\u00e1lises multidimensionais + snapshots com <code>#stamp#</code>; monitores.</li>\n<li>[ ] \u00cdndices de utilizador para otimizar as suas consultas; medir antes/depois.</li>\n<li>[ ] Framework <strong>Web (C#)</strong>: editor de c\u00f3digo, eventos, regras, <strong>scripts por URL</strong> (criar um endpoint de teste), monitores, templates.</li>\n<li>[ ] <strong>EyePeak</strong>: configurar o monitor de sincroniza\u00e7\u00e3o; desenhar um fluxo encomenda\u2192guia.</li>\n<li>[ ] <strong>Cegid Pulse</strong>: ativar (3 passos), explorar o assistente comercial, desenhar uma Smart Tool com <code>PromptFunction()</code>.</li>\n</ul>\n<h3>Fase 5 \u2014 N\u00edvel consultor/expert (semanas 15+)</h3>\n<ul>\n<li>[ ] Fazer o <strong>PEP (Cegid Academy)</strong> ou a certifica\u00e7\u00e3o PHC equivalente; entrar na bolsa de t\u00e9cnicos certificados.</li>\n<li>[ ] Implementar um ciclo completo num cliente real (ou demo avan\u00e7ada): diagn\u00f3stico \u2192 desenho \u2192 configura\u00e7\u00e3o \u2192 migra\u00e7\u00e3o de dados (importa\u00e7\u00e3o Excel/ODBC) \u2192 forma\u00e7\u00e3o \u2192 arranque \u2192 p\u00f3s-arranque.</li>\n<li>[ ] Dominar upgrades: fazer upgrade de vers\u00e3o ao laborat\u00f3rio validando todas as personaliza\u00e7\u00f5es.</li>\n<li>[ ] Especializar-se num vertical (retalho/POS, distribui\u00e7\u00e3o/log\u00edstica com EyePeak, servi\u00e7os/suporte, manufatura) \u2014 \u00e9 onde os parceiros monetizam.</li>\n<li>[ ] Acompanhar cada nova vers\u00e3o (202602\u2026) e o Calend\u00e1rio PHC de obriga\u00e7\u00f5es.</li>\n</ul>\n<h3>H\u00e1bitos do expert</h3>\n<ul>\n<li>Ler o <strong>manual in-app</strong> de cada ecr\u00e3 antes de responder a um ticket (a PHC documenta campo a campo).</li>\n<li>Usar o <strong>Dicion\u00e1rio de Dados</strong> para tudo o que envolva SQL.</li>\n<li>Testar sempre em <strong>clone</strong> antes de produ\u00e7\u00e3o.</li>\n<li>Documentar personaliza\u00e7\u00f5es num registo vivo (o upgrade anual agradece).</li>\n<li>Participar na <strong>Comunidade PHC</strong> e nos eventos <strong>Coding PHC</strong>.</li>\n</ul>\n<hr />\n<h2 id=\"cap-13\">13. Checklists de autoavalia\u00e7\u00e3o</h2>\n<p><strong>Funcional (Gest\u00e3o)</strong> \u2014 sabe fazer sem consultar?\n- [ ] Criar/configurar s\u00e9ries e tipos de documento e explicar o mapping SAF-T\n- [ ] Circuito completo venda (or\u00e7amento\u2192fatura\u2192recibo\u2192liquida\u00e7\u00e3o) e compra\n- [ ] Invent\u00e1rio f\u00edsico com acertos e valoriza\u00e7\u00e3o PCMP\n- [ ] Aging, mailing e monitor de cobran\u00e7as\n- [ ] Tesouraria real/previsional/or\u00e7amental e reconcilia\u00e7\u00e3o\n- [ ] Integra\u00e7\u00e3o Gest\u00e3o\u2192Contabilidade (documentos pr\u00e9-definidos, IVA)</p>\n<p><strong>Configura\u00e7\u00e3o</strong>\n- [ ] Par\u00e2metros gerais e de fatura\u00e7\u00e3o (os ~20 mais usados)\n- [ ] Utilizadores/grupos/perfis e acessos por opera\u00e7\u00e3o\n- [ ] Layouts de impress\u00e3o com QR/ATCUD\n- [ ] RGPD (aviso legal, esquecimento)</p>\n<p><strong>Fiscal</strong>\n- [ ] SAF-T fatura\u00e7\u00e3o + transporte (webservice e resumido)\n- [ ] ATCUD: comunica\u00e7\u00e3o de s\u00e9ries e c\u00f3digo de valida\u00e7\u00e3o\n- [ ] Motivos de isen\u00e7\u00e3o M01\u2013M99 e impacto do webservice\n- [ ] Reten\u00e7\u00f5es IRS/Imposto Selo; invent\u00e1rio \u00e0 AT; SDR 2026</p>\n<p><strong>Desenvolvimento</strong>\n- [ ] Escrever um evento Xbase com ObjRecebido e Return .F.\n- [ ] Criar campo/tabela/\u00edndice/regra de utilizador\n- [ ] Construir um IDU e lig\u00e1-lo a um menu\n- [ ] An\u00e1lise de utilizador + snapshot + an\u00e1lise multidimensional\n- [ ] Script web C# por URL; monitores\n- [ ] Sincroniza\u00e7\u00e3o EyePeak; PromptFunction/Cegid Pulse</p>\n<p><strong>Opera\u00e7\u00e3o</strong>\n- [ ] Instalar do zero (SQL + PHC + ODBC + licen\u00e7as)\n- [ ] Backup/restore, detach/attach, BD de arquivo\n- [ ] Diagnosticar com An\u00e1lise Interna / Log de C\u00f3digo / log de atividade\n- [ ] Upgrade de vers\u00e3o com valida\u00e7\u00e3o de personaliza\u00e7\u00f5es\n- [ ] Plano de performance (\u00edndices, desfragmenta\u00e7\u00e3o, par\u00e2metros)</p>\n<hr />\n<h2 id=\"cap-14\">14. Gloss\u00e1rio PHC</h2>\n<table>\n<thead>\n<tr>\n<th>Termo</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cegid PHC Evolution</strong></td>\n<td>ERP desktop+web sucessor do PHC CS (subscri\u00e7\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>PHC CS</strong></td>\n<td>Nome hist\u00f3rico da plataforma (Client/Server)</td>\n</tr>\n<tr>\n<td><strong>Gamas</strong></td>\n<td>Corporate / Advanced / Enterprise (n\u00edveis funcionais)</td>\n</tr>\n<tr>\n<td><strong>Planos</strong></td>\n<td>Standard / Plus / Advanced / Premium / Ultimate (subscri\u00e7\u00e3o Evolution)</td>\n</tr>\n<tr>\n<td><strong>DI / Dossier Interno</strong></td>\n<td>Documento interno parametriz\u00e1vel (or\u00e7amentos, encomendas, folhas de obra\u2026) \u2014 tabela BO</td>\n</tr>\n<tr>\n<td><strong>FT</strong></td>\n<td>Documentos de Fatura\u00e7\u00e3o (tabela)</td>\n</tr>\n<tr>\n<td><strong>CL / CL2</strong></td>\n<td>Clientes / Clientes-Outros Dados (tabelas)</td>\n</tr>\n<tr>\n<td><strong>RE</strong></td>\n<td>Recibos (tabela)</td>\n</tr>\n<tr>\n<td><strong>ref / stamp</strong></td>\n<td>Identificador do registo / campo de vers\u00e3o-concorr\u00eancia</td>\n</tr>\n<tr>\n<td><strong>Xbase</strong></td>\n<td>Linguagem de personaliza\u00e7\u00e3o desktop (sintaxe VFP)</td>\n</tr>\n<tr>\n<td><strong>ObjRecebido</strong></td>\n<td>Objeto dispon\u00edvel nos eventos (Janela, Objecto, MeusDados)</td>\n</tr>\n<tr>\n<td><strong>IDU / Ecr\u00e3s Personalizados</strong></td>\n<td>Ecr\u00e3s desenhados pelo utilizador</td>\n</tr>\n<tr>\n<td><strong>Framework PHC</strong></td>\n<td>Conjunto de ferramentas de personaliza\u00e7\u00e3o (desktop e web)</td>\n</tr>\n<tr>\n<td><strong>Supervisor</strong></td>\n<td>Menu de administra\u00e7\u00e3o (framework, tratamento da BD, monitores)</td>\n</tr>\n<tr>\n<td><strong>PHC On</strong></td>\n<td>Acordo anual de atualiza\u00e7\u00f5es + portal de forma\u00e7\u00e3o/Calend\u00e1rio PHC</td>\n</tr>\n<tr>\n<td><strong>Comunidade PHC</strong></td>\n<td>Portal de parceiros/clientes (login N\u00ba Cliente + ID T\u00e9cnico)</td>\n</tr>\n<tr>\n<td><strong>Help Center</strong></td>\n<td>Manuais e artigos p\u00fablicos (helpcenter.phccs.net)</td>\n</tr>\n<tr>\n<td><strong>Dicion\u00e1rio de Dados</strong></td>\n<td>Consulta da estrutura/rela\u00e7\u00f5es de todas as tabelas</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Log de erros do c\u00f3digo de utilizador (desktop)</td>\n</tr>\n<tr>\n<td><strong>SAF-T (PT)</strong></td>\n<td>Ficheiro de auditoria fiscal normalizado (fatura\u00e7\u00e3o, transporte, invent\u00e1rio)</td>\n</tr>\n<tr>\n<td><strong>ATCUD</strong></td>\n<td>C\u00f3digo \u00fanico do documento (valida\u00e7\u00e3o de s\u00e9rie + sequencial)</td>\n</tr>\n<tr>\n<td><strong>e-Fatura</strong></td>\n<td>Comunica\u00e7\u00e3o de faturas \u00e0 AT (webservice ou SAF-T)</td>\n</tr>\n<tr>\n<td><strong>CIUS-PT</strong></td>\n<td>Especifica\u00e7\u00e3o portuguesa de fatura\u00e7\u00e3o eletr\u00f3nica (setor p\u00fablico)</td>\n</tr>\n<tr>\n<td><strong>SII / TicketBAI</strong></td>\n<td>Regimes fiscais de Espanha</td>\n</tr>\n<tr>\n<td><strong>SDR</strong></td>\n<td>Sistema de Dep\u00f3sito e Recolha de embalagens (2026)</td>\n</tr>\n<tr>\n<td><strong>PCMP</strong></td>\n<td>Pre\u00e7o de Custo M\u00e9dio Ponderado (custeio de stock)</td>\n</tr>\n<tr>\n<td><strong>C/C</strong></td>\n<td>Conta corrente</td>\n</tr>\n<tr>\n<td><strong>CEVMC</strong></td>\n<td>Custo das Exist\u00eancias Vendidas e das Mercadorias Consumidas</td>\n</tr>\n<tr>\n<td><strong>XL</strong></td>\n<td>Componente para grandes volumes/centros anal\u00edticos (PHC XL)</td>\n</tr>\n<tr>\n<td><strong>EyePeak</strong></td>\n<td>Plataforma de log\u00edstica/e-commerce que sincroniza com o PHC</td>\n</tr>\n<tr>\n<td><strong>Cegid Pulse</strong></td>\n<td>Ecossistema de IA no ERP (assistente Cris, Smart Tools, PromptFunction)</td>\n</tr>\n<tr>\n<td><strong>Cegid Docs</strong></td>\n<td>Gest\u00e3o documental/arquivo digital legal na cloud</td>\n</tr>\n<tr>\n<td><strong>PEP</strong></td>\n<td>Cegid PHC Evolution Program (forma\u00e7\u00e3o/certifica\u00e7\u00e3o de 140 h da Cegid Academy)</td>\n</tr>\n<tr>\n<td><strong>Snapshots</strong></td>\n<td>Consultas T-SQL guardadas com vari\u00e1veis (ex.: #stamp#)</td>\n</tr>\n<tr>\n<td><strong>Monitores</strong></td>\n<td>Apresenta\u00e7\u00f5es sequenciais de dados operacionais</td>\n</tr>\n<tr>\n<td><strong>Front Web</strong></td>\n<td>Extranet web para clientes/fornecedores</td>\n</tr>\n<tr>\n<td><strong>Aven\u00e7as</strong></td>\n<td>Dossier de fatura\u00e7\u00e3o recorrente</td>\n</tr>\n<tr>\n<td><strong>Rappel</strong></td>\n<td>Desconto de volume retroativo (cliente/fornecedor)</td>\n</tr>\n<tr>\n<td><strong>Ignios</strong></td>\n<td>Servi\u00e7o de preenchimento autom\u00e1tico de dados de empresa por NIF</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"cap-15\">15. Fontes e links de refer\u00eancia</h2>\n<p><strong>Oficiais (p\u00fablicos)</strong>\n- Site Cegid PHC: https://phcsoftware.com/pt \u2014 produtos: <code>/pt/cegid-phc-cs</code>, <code>/pt/cegid-phc-evolution</code>, m\u00f3dulo Gest\u00e3o: <code>/pt/modulos/phc-cs/phc-cs-modulo-phc-cs-gestao</code>\n- <strong>Help Center Cegid PHC CS/Evolution</strong>: https://helpcenter.phccs.net e http://phc.pt/portal (manuais SUG, artigos iDirecto, Novidades)\n  - Novidades da vers\u00e3o (\u00edndice): https://www.phc.pt/portal/programs/ewpview.aspx?codigo=pncs&amp;geo=pt&amp;lang=pt-pt\n  - Manual \"Eventos\" (Xbase/ObjRecebido): http://phc.pt/portal/sug/ptxview.aspx?ptxid=20345536\n  - Manual \"Constitui\u00e7\u00e3o da Tabela de Clientes\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?ptxid=20344844\n  - Manual \"Documentos de Fatura\u00e7\u00e3o\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?ptxid=20346102\n  - \"Framework PHC CS Web\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?ptxid=20368282\n  - \"O que \u00e9 o PHC ON\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?ptxid=20346837\n  - \"Dicion\u00e1rio de Dados\" (iDirecto): https://www.phc.pt/portal/programs/ewpview.aspx?codigo=IDIR070905\n  - \"Faturas com c\u00f3digo QR e ATCUD\": https://www.phc.pt/portal/programs/ewpview.aspx?codigo=IDIR201007\n  - \"Comunica\u00e7\u00e3o de Documentos de Transporte \u00e0 AT via SAF-T\": https://www.phcsoftware.com/pt/artigo/a-comunicacao-de-documentos-de-transporte-a-at-via-saf-t-esta-mais-simples\n  - \"Como configurar dossiers internos\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?stamp=bg91527ededbdgeb32c597\n  - \"Como sincronizar o ERP Cegid PHC Desktop com o EyePeak\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?stamp=!!!5fg%3Ae89ee1bc8gdc96357d\n  - \"Desenhar Ecr\u00e3s Personalizados\": https://helpcenter.phccs.net/pt/sug/ptxview.aspx?ptxid=20370447\n  - \"PHC CS 202501: novidades\" (File Storage, Cris/GenAI, descontos web): https://phcsoftware.com/pt/artigo/phcs-cs-novidades-transformar-gestao-2025\n- <strong>Comunidade PHC</strong> (login t\u00e9cnico): https://community.phcsoftware.com\n- <strong>Forma\u00e7\u00e3o PEP / Cegid Academy</strong>: https://phcsoftware.com/pt/formacao-pep e https://pt.primaverabss.com/pt/pagina/academy-pep/\n- Programa oficial \"Certifica\u00e7\u00e3o PHC CS Desktop Advanced\" (PDF): http://www.phc.pt/enews/Conte%C3%BAdo%20Program%C3%A1tico%20Certifica%C3%A7%C3%A3o%20PHC%20CS%20Desktop%20Advanced.pdf\n- Termos de licenciamento (SQL Server 2008R2+): https://phcsoftware.com/pt/phc-cs/termos-e-condicoes-de-licenciamento-utlizacao-phc-cs\n- Parceiros: https://phcsoftware.com/pt/parceiros | Diretoria de parceiros certificados: https://www.phc.pt/portal/programs/ewpview.aspx?codigo=dirpcsx1239\n- Microcredencia\u00e7\u00e3o IPT \"Software Cegid PHC CS Advanced\": https://portal2.ipt.pt/pt/cursos/microcredenciacao/Mc_-_SCPHCCSA/</p>\n<p><strong>Parceiros (PDFs p\u00fablicos \u00fateis)</strong>\n- Brochura PHC Gest\u00e3o CS (\u00e2mbito funcional): https://web.trimatriz.com/SITE_12/UserFiles/Downloads/PHCGestao.pdf\n- Diferen\u00e7as entre gamas Corporate vs Advanced (v28): https://www.absinformatica.pt/uploads/cms/20210204173610_Diferencas_entre_Corporate_e_Advanced_PT.pdf\n- Novidades PHC CS v18/v19/v27 (Arentia/phc.pt): https://www.arentia.pt/api/backoffice/library/get?r=/&amp;d=PDFs&amp;f=Listagem_de_Novidades_v18&amp;e=.pdf | http://www.phc.pt/enews/Listagem_de_Novidades_v19.pdf | http://www.phc.pt/enews/Listagem_Novidades_27.pdf\n- Descritivo PHC CS Web: https://microvesa.pt/wp-content/uploads/2020/06/             if(o.settings)s.settings=Object.assign(defaultSettings(),o.settings);

function overallPct(){return Math.round(labsMastered()/DATA.labs.length*0.7+quizzesPassed()/9*0.2+cardsMastered()/DATA.cards.length*0.1)}

function pickVoice(){try{var vs=speechSynthesis.getVoices()||[];
  return vs.find(function(v){return /pt[-_]BR/i.test(v.lang)})||vs.find(function(v){return /^pt/i.test(v.lang)})||null}catch(e){return null}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}TTS.q=[];TTS.on=false;TTS.done=null;MascotBus.set("mood","idle");MascotBus.set("bubble","")}
function speak(text,done){
  if(!S.settings.tts||!text){if(done)done();return}
  stopSpeak();
  var parts=String(text).match(/[^.!?]+[.!?]*/g)||[String(text)];
  var chunks=[],cur="";
  parts.forEach(function(p){if((cur+p).length>170){chunks.push(cur);cur=p}else{cur+=p}});
  if(cur.trim())chunks.push(cur);
  TTS.q=chunks;TTS.on=true;TTS.done=done||null;
  MascotBus.set("mood","talk");
  nextChunk();
}
function nextChunk(){
  if(!TTS.q.length){TTS.on=false;var d=TTS.done;TTS.done=null;MascotBus.set("mood","idle");MascotBus.set("bubble","");if(d)d();return}
  var c=TTS.q.shift().trim();
  try{
    var u=new SpeechSynthesisUtterance(c);
    var v=pickVoice();if(v)u.voice=v;
    u.lang=(v&&v.lang)||"pt-BR";u.rate=S.settings.rate||1;u.pitch=1.05;
    u.onend=nextChunk;u.onerror=nextChunk;
    MascotBus.set("bubble",c);
    speechSynthesis.speak(u);
  }catch(e){nextChunk()}
}
